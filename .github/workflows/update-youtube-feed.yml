name: Update YouTube feed

on:
  schedule:
    # 3時間ごと（日本時間 0:41, 3:41, 6:41 …）
    - cron: '41 */3 * * *'
  workflow_dispatch:
  # スクリプトや設定を変えたら、main に入ったときにすぐ作り直す
  push:
    branches: [main]
    paths:
      - .github/scripts/build_youtube_feed.py
      - .github/workflows/update-youtube-feed.yml

permissions:
  contents: write

concurrency:
  group: update-youtube-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FEED: portfolio/youtube/videos.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build feed from YouTube RSS
        run: python .github/scripts/build_youtube_feed.py "$FEED"

      - name: Commit if changed
        run: |
          if git diff --quiet -- "$FEED"; then
            echo "動画一覧に変更はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git add "$FEED"
          git commit -m "Update YouTube feed"
          git pull --rebase
          git push
