name: Update sticker catalog

on:
  schedule:
    # 毎日 日本時間 9:00
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sticker-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CATALOG: common/line-promo/sticker-catalog.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Build catalog from LINE STORE
        run: python .github/scripts/build_sticker_catalog.py .github/scripts/authors.json "$CATALOG"

      - name: Commit if changed
        run: |
          if git diff --quiet -- "$CATALOG"; then
            echo "カタログに変更はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git add "$CATALOG"
          git commit -m "Update sticker catalog"
          git push
