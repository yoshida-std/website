<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ヨシダスタジオ ポートフォリオ</title>
<meta name="description" content="ヨシダスタジオの作品紹介。LINEスタンプ・絵文字、ブラウザゲーム、制作支援ツール、note記事。">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="./">ヨシダスタジオ</a>
    <nav class="nav">
      <a href="./" aria-current="page">トップ</a>
      <a href="line/">LINEスタンプ</a>
      <span>ゲーム</span>
      <span>ツール</span>
      <a href="#note">note</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1>ヨシダスタジオ</h1>
  <p class="lead">LINEスタンプ・絵文字、ブラウザゲーム、制作ツールなどの作品をまとめています。</p>

  <div class="cards">
    <a class="card is-ready" href="line/">
      <h2>LINEスタンプ・絵文字</h2>
      <p>LINE STORE で販売中のスタンプと絵文字の一覧。</p>
      <span class="badge">見る</span>
    </a>
    <div class="card">
      <h2>ブラウザゲーム</h2>
      <p>スマホのブラウザで遊べるミニゲーム。</p>
      <span class="badge">準備中</span>
    </div>
    <div class="card">
      <h2>LINEスタンプ制作支援ツール</h2>
      <p>スタンプ制作に使っている自作ツール。</p>
      <span class="badge">準備中</span>
    </div>
  </div>

  <section class="section" id="note" hidden>
    <div class="section-head">
      <h2>note の最新記事</h2>
      <a class="more" id="note-more" href="https://note.com/yoshida_std" target="_blank" rel="noopener">もっと見る →</a>
    </div>
    <ul class="articles" id="note-list"></ul>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">©YoshidaStudio</div>
</footer>

<script>
(function () {
  "use strict";
  // note の RSS は GitHub Actions が3時間ごとに articles.json に書き出す（新しい順）
  var FEED = "note/articles.json";
  var COUNT = 3;
  var section = document.getElementById("note");
  var list = document.getElementById("note-list");

  function safeUrl(u) {
    return /^https:\/\//.test(u || "") ? u : "";
  }

  // 見る人のタイムゾーンによらず、note に出ている日付（日本時間）のまま出す
  function formatDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
    return m ? m[1] + "." + Number(m[2]) + "." + Number(m[3]) : "";
  }

  fetch(FEED, { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      var items = (data.items || []).filter(function (it) { return safeUrl(it.url); }).slice(0, COUNT);
      if (!items.length) return;
      if (safeUrl(data.profile)) document.getElementById("note-more").href = data.profile;
      items.forEach(function (it) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.className = "article";
        a.href = it.url;
        a.target = "_blank";
        a.rel = "noopener";
        var thumb = document.createElement("div");
        thumb.className = "article-thumb";
        if (safeUrl(it.image)) {
          var img = document.createElement("img");
          img.src = it.image;
          img.alt = "";
          img.loading = "lazy";
          img.decoding = "async";
          thumb.appendChild(img);
        }
        var body = document.createElement("div");
        body.className = "article-body";
        var date = document.createElement("time");
        date.dateTime = it.date || "";
        date.textContent = formatDate(it.date);
        var title = document.createElement("h3");
        title.textContent = it.title;
        body.appendChild(date);
        body.appendChild(title);
        a.appendChild(thumb);
        a.appendChild(body);
        li.appendChild(a);
        list.appendChild(li);
      });
      section.hidden = false;
    })
    .catch(function () { /* 読めなければ記事の欄は出さない */ });
})();
</script>
</body>
</html>
