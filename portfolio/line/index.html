<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:site_name" content="ヨシダスタジオ">
<meta property="og:title" content="LINEスタンプ・絵文字 | ヨシダスタジオ">
<meta property="og:description" content="ヨシダスタジオの LINE スタンプ・絵文字の一覧。">
<meta property="og:url" content="https://yoshida-std.github.io/website/portfolio/line/">

<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="../">ヨシダスタジオ</a>
    <nav class="nav">
      <a href="../">トップ</a>
      <a href="./" aria-current="page">LINEスタンプ</a>
      <a href="../games/">ゲーム</a>
      <span>キャラクターIP</span>
      <span>ツール</span>
      <a href="../#note">note</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1>LINEスタンプ・絵文字</h1>
  <p class="lead">LINE STORE で販売中の作品です。タップすると LINE STORE が開きます。</p>

  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-type="sticker" aria-selected="true">スタンプ <span data-count="sticker"></span></button>
      <button type="button" role="tab" data-type="emoji" aria-selected="false">絵文字 <span data-count="emoji"></span></button>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="名前で絞り込み" autocomplete="off" aria-label="名前で絞り込み">
      <button type="button" id="clear" aria-label="クリア" hidden>×</button>
    </div>
  </div>

  <p class="count" id="count" aria-live="polite">読み込み中…</p>
  <ul class="grid" id="grid"></ul>
  <p class="empty" id="empty" hidden>見つかりませんでした。</p>
  <nav class="pager" id="pager" aria-label="ページ"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

<footer class="site-footer">
  <div class="wrap">©YoshidaStudio</div>
</footer>

<script>
(function () {
  "use strict";
  // カタログは GitHub Actions が毎日作り直す（並びは新しい順）
  var CATALOG = "../../common/line-promo/sticker-catalog.json";

  var grid = document.getElementById("grid");
  var countEl = document.getElementById("count");
  var emptyEl = document.getElementById("empty");
  var input = document.getElementById("q");
  var clearBtn = document.getElementById("clear");
  var tabs = document.querySelectorAll(".tabs button");
  var pagerEl = document.getElementById("pager");

  // スマホはナビが横スクロールなので、今のページのタブが見える位置に動かす
  var cur = document.querySelector(".nav [aria-current]");
  if (cur && cur.scrollIntoView) cur.scrollIntoView({ inline: "center", block: "nearest" });
  var toastEl = document.getElementById("toast");
  var PER_PAGE = 20;
  var COPY_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  var items = [];
  var params = new URLSearchParams(location.search);
  var state = {
    type: params.get("type") === "emoji" ? "emoji" : "sticker",
    q: params.get("q") || "",
    page: Math.max(1, parseInt(params.get("p"), 10) || 1)
  };
  input.value = state.q;

  // 全角半角・大文字小文字・カタカナひらがなの違いを無視して比べる
  function norm(s) {
    return String(s).normalize("NFKC").toLowerCase()
      .replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); })
      .replace(/\s+/g, "");
  }

  function safeUrl(u) {
    return /^https:\/\//.test(u) ? u : "#";
  }

  function render() {
    tabs.forEach(function (b) {
      b.setAttribute("aria-selected", String(b.dataset.type === state.type));
    });
    clearBtn.hidden = !state.q;

    var words = state.q.split(/[\s　]+/).map(norm).filter(Boolean);
    var list = items.filter(function (it) {
      return it.type === state.type && words.every(function (w) { return it.key.indexOf(w) !== -1; });
    });

    var pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
    if (state.page > pages) state.page = pages;
    var start = (state.page - 1) * PER_PAGE;

    var frag = document.createDocumentFragment();
    list.slice(start, start + PER_PAGE).forEach(function (it) {
      var li = document.createElement("li");
      li.className = "item";
      var a = document.createElement("a");
      a.href = safeUrl(it.url);
      a.target = "_blank";
      a.rel = "noopener";
      var thumb = document.createElement("div");
      thumb.className = "thumb";
      var img = document.createElement("img");
      img.src = it.image;
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";
      thumb.appendChild(img);
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = it.name;
      a.appendChild(thumb);
      a.appendChild(name);
      li.appendChild(a);
      var copy = document.createElement("button");
      copy.type = "button";
      copy.className = "copy";
      copy.title = "リンクをコピー";
      copy.setAttribute("aria-label", it.name + " のリンクをコピー");
      copy.innerHTML = COPY_ICON;
      copy.addEventListener("click", function () { copyLink(a.href); });
      li.appendChild(copy);
      frag.appendChild(li);
    });
    grid.replaceChildren(frag);

    countEl.textContent = list.length
      ? list.length + " 件中 " + (start + 1) + "〜" + Math.min(start + PER_PAGE, list.length) + " 件"
      : "0 件";
    emptyEl.hidden = list.length > 0;
    renderPager(pages);
  }

  // ページ番号は 1 … 前後 … 最後 の形で出す
  function renderPager(pages) {
    pagerEl.replaceChildren();
    if (pages <= 1) return;
    function btn(label, page, opt) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      if (opt && opt.label) b.setAttribute("aria-label", opt.label);
      if (page === state.page && !(opt && opt.nav)) b.setAttribute("aria-current", "page");
      if (page < 1 || page > pages) b.disabled = true;
      else b.addEventListener("click", function () { goPage(page); });
      pagerEl.appendChild(b);
    }
    function gap() {
      var s = document.createElement("span");
      s.textContent = "…";
      pagerEl.appendChild(s);
    }
    btn("‹", state.page - 1, { nav: true, label: "前のページ" });
    var last = 0;
    for (var i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i - state.page) <= 1) {
        if (last && i - last > 1) gap();
        btn(String(i), i);
        last = i;
      }
    }
    btn("›", state.page + 1, { nav: true, label: "次のページ" });
  }

  function goPage(page) {
    state.page = page;
    syncUrl();
    render();
    var top = document.querySelector(".toolbar").getBoundingClientRect().top + scrollY - 70;
    if (scrollY > top) scrollTo({ top: top, behavior: "smooth" });
  }

  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
  }

  function copyLink(url) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = url;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      ta.remove();
      toast(ok ? "リンクをコピーしました" : "コピーできませんでした");
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(function () { toast("リンクをコピーしました"); }, fallback);
    } else {
      fallback();
    }
  }

  // 今の状態を URL に残す（共有・戻るボタン用）
  function syncUrl() {
    var p = new URLSearchParams();
    if (state.type !== "sticker") p.set("type", state.type);
    if (state.q) p.set("q", state.q);
    if (state.page > 1) p.set("p", state.page);
    var qs = p.toString();
    history.replaceState(null, "", location.pathname + (qs ? "?" + qs : ""));
  }

  tabs.forEach(function (b) {
    b.addEventListener("click", function () {
      state.type = b.dataset.type;
      state.page = 1;
      syncUrl();
      render();
    });
  });
  input.addEventListener("input", function () {
    state.q = input.value.trim();
    state.page = 1;
    syncUrl();
    render();
  });
  clearBtn.addEventListener("click", function () {
    input.value = "";
    state.q = "";
    state.page = 1;
    syncUrl();
    render();
    input.focus();
  });

  // Object.keys は数字のキー（スタンプ）を小さい順に並べ替えてしまうので、
  // JSON の文字列に書かれている順（＝新しい順）でキーを拾う
  function catalogOrder(text, map) {
    var keys = [], seen = {}, m;
    var re = /"([0-9A-Za-z]+)"\s*:\s*\{/g;
    while ((m = re.exec(text))) {
      if (map[m[1]] && !seen[m[1]]) { seen[m[1]] = true; keys.push(m[1]); }
    }
    Object.keys(map).forEach(function (k) { if (!seen[k]) keys.push(k); });
    return keys;
  }

  fetch(CATALOG, { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (text) {
      var map = JSON.parse(text).items || {};
      items = catalogOrder(text, map).map(function (id) {
        var v = map[id];
        return { id: id, type: v.type, name: v.name, url: v.url, image: v.image, key: norm(v.name) };
      });
      ["sticker", "emoji"].forEach(function (t) {
        var n = items.filter(function (it) { return it.type === t; }).length;
        document.querySelector('[data-count="' + t + '"]').textContent = "(" + n + ")";
      });
      render();
    })
    .catch(function () {
      countEl.textContent = "一覧を読み込めませんでした。時間をおいて再読み込みしてください。";
    });
})();
</script>
</body>
</html>
