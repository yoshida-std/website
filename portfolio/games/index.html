<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ブラウザゲーム | ヨシダスタジオ</title>
<meta name="description" content="ヨシダスタジオのブラウザゲーム。スマホでもパソコンでも、インストールなしですぐ遊べます。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ヨシダスタジオ">
<meta property="og:title" content="ブラウザゲーム | ヨシダスタジオ">
<meta property="og:description" content="ヨシダスタジオのブラウザゲーム。スマホでもパソコンでも、インストールなしですぐ遊べます。">
<meta property="og:url" content="https://yoshida-std.github.io/website/portfolio/games/">
<meta property="og:image" content="https://yoshida-std.github.io/website/portfolio/img/header.jpg">
<meta property="og:image:width" content="1424">
<meta property="og:image:height" content="748">
<meta property="og:image:alt" content="ヨシダスタジオ YOSHIDA STUDIO">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="../style.css?v=5">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="../">ヨシダスタジオ</a>
    <nav class="nav">
      <a href="../">トップ</a>
      <a href="../line/">LINEスタンプ</a>
      <a href="./" aria-current="page">ゲーム</a>
      <span>ツール</span>
      <a href="../#note">note</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1>ブラウザゲーム</h1>
  <p class="lead">インストールなしで、すぐ遊べます。スマホは横向きにして遊んでください。</p>

  <p class="count" id="count" aria-live="polite">読み込み中…</p>
  <ul class="games" id="list"></ul>
</main>

<footer class="site-footer">
  <div class="wrap">©YoshidaStudio</div>
</footer>

<script>
(function () {
  "use strict";
  // 公開するゲームは games.json に書いたものだけ（公開日の新しい順に並べる）
  var FEED = "games.json";
  var list = document.getElementById("list");
  var countEl = document.getElementById("count");

  // スマホはナビが横スクロールなので、今のページのタブが見える位置に動かす
  var cur = document.querySelector(".nav [aria-current]");
  if (cur && cur.scrollIntoView) cur.scrollIntoView({ inline: "center", block: "nearest" });

  // 相対パスか https だけ通す（javascript: などは弾く）
  function safeUrl(u) {
    u = String(u || "");
    return /^[a-z][a-z0-9+.-]*:/i.test(u) ? (/^https:\/\//i.test(u) ? u : "") : u;
  }

  function formatDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || "");
    return m ? m[1] + "." + Number(m[2]) + "." + Number(m[3]) : "";
  }

  fetch(FEED, { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      var items = (data.items || []).filter(function (it) { return it.title && safeUrl(it.path); });
      // 公開日の新しい順（同じ日は書いた順のまま）
      items = items.map(function (it, i) { return { it: it, i: i }; })
        .sort(function (a, b) {
          var da = a.it.published || "", db = b.it.published || "";
          return da < db ? 1 : da > db ? -1 : a.i - b.i;
        })
        .map(function (x) { return x.it; });

      countEl.textContent = items.length ? items.length + " 本" : "まだ公開しているゲームはありません。";
      items.forEach(function (it) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.className = "game";
        a.href = safeUrl(it.path);
        var thumb = document.createElement("div");
        thumb.className = "game-thumb";
        if (safeUrl(it.image)) {
          var img = document.createElement("img");
          img.src = safeUrl(it.image);
          img.alt = "";
          img.loading = "lazy";
          img.decoding = "async";
          thumb.appendChild(img);
        }
        var body = document.createElement("div");
        body.className = "game-body";
        var title = document.createElement("h2");
        title.textContent = it.title;
        body.appendChild(title);
        if (it.description) {
          var desc = document.createElement("p");
          desc.textContent = it.description;
          body.appendChild(desc);
        }
        var date = formatDate(it.published);
        if (date) {
          var t = document.createElement("time");
          t.dateTime = it.published;
          t.textContent = "公開 " + date;
          body.appendChild(t);
        }
        a.appendChild(thumb);
        a.appendChild(body);
        li.appendChild(a);
        list.appendChild(li);
      });
    })
    .catch(function () {
      countEl.textContent = "一覧を読み込めませんでした。時間をおいて再読み込みしてください。";
    });
})();
</script>
</body>
</html>
