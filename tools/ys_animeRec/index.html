<div id="preview-container" style="margin-top: 20px; display: none;">
    <h3>録画プレビュー</h3>
    <video id="preview" width="320" height="270" controls></video><br>
    <button onclick="downloadVideo()" style="background: green; color: white;">この動画をダウンロードする</button>
</div>

<script>
    let mediaRecorder;
    let recordedChunks = [];
    let videoBlob = null; // 録画データを一時保存する変数

    function toggleRecording() {
        const btn = document.getElementById('rec-btn');
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            btn.innerText = '● Record';
            document.getElementById('preview-container').style.display = 'block';
        } else {
            const stream = recCanvas.captureStream(30);
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            recordedChunks = [];
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
                const preview = document.getElementById('preview');
                preview.src = URL.createObjectURL(videoBlob);
            };
            mediaRecorder.start();
            btn.innerText = '■ Stop';
            document.getElementById('preview-container').style.display = 'none';
        }
    }

    function downloadVideo() {
        if (!videoBlob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(videoBlob);
        a.download = 'animation.webm';
        a.click();
    }
</script>
