<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14172b">
<title>ホリホリ・ロボバスター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: HUD / progress bar / scrolling maze canvas / controls (stick + dig button). Famicom-like palette */
:root{
  --hero-sheet:url(hero.png); --boss-sheet:url(boss.png);
  --bg:#1a4a8c; --panel:#2f8fe6; --line:#ffd84a; --fg:#eaff8f; --dim:#d6efff; --ink:#ffffff;
  --red:#ff5d5d; --green:#7dff6a; --orange:#ff9f2e;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;
  -webkit-touch-callout:none;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#2a74cc,#1a4a8c 45%,#0d2a52);color:var(--ink);font-family:var(--font)}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:24vh;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70px 34px at 6% 104%,#2f9e3a 62%,#0000 64%),radial-gradient(ellipse 60px 40px at 20% 108%,#43b94a 62%,#0000 64%),
  radial-gradient(ellipse 80px 36px at 40% 110%,#2f9e3a 62%,#0000 64%),radial-gradient(ellipse 70px 40px at 62% 108%,#43b94a 62%,#0000 64%),
  radial-gradient(ellipse 80px 38px at 82% 106%,#2f9e3a 62%,#0000 64%),radial-gradient(ellipse 60px 34px at 98% 104%,#43b94a 62%,#0000 64%)}
button{touch-action:manipulation;font-family:var(--font);cursor:pointer}
img{-webkit-user-drag:none}
canvas,#stick,#digBtn{touch-action:none}
canvas{display:block}
[hidden]{display:none!important}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:6px;max-width:520px;margin:0 auto;box-sizing:border-box;
  padding:max(6px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px))
          max(6px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#hud{display:flex;gap:5px;font-variant-numeric:tabular-nums}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:2px 8px;min-width:0;box-shadow:inset 0 0 0 2px #1d6fc4}
.stat b{display:block;font-size:9px;letter-spacing:.12em;color:var(--dim);font-weight:400}
.stat span{font-size:16px;white-space:nowrap;color:var(--fg)}
#stScore{flex:1;min-width:58px;text-align:right}
.stat b{white-space:nowrap}
@media (max-width:400px){
  #hud{gap:3px}.stat{padding:2px 5px}.stat span{font-size:14px}.stat b{font-size:8px;letter-spacing:.02em}
  #stLife i{width:10px;height:10px;margin-right:2px}#pauseBtn{flex-basis:34px}
}
#stScore b{text-align:left}
#stLife span{font-size:14px;letter-spacing:1px}
#stLife i{display:inline-block;width:12px;height:12px;margin-right:3px;border-radius:50%;background:var(--red);border:2px solid #fff;box-sizing:border-box}
#stLife i.off{background:#0000;border-color:#ffffff66}
#pauseBtn{flex:0 0 44px;color:var(--ink);font-size:14px;padding:0;background:var(--panel);border:2px solid var(--line);border-radius:8px}
#progBar{height:6px;background:#1d6fc4;border:2px solid var(--line);border-radius:99px;overflow:hidden}
#prog{height:100%;width:0;background:linear-gradient(90deg,#7dff6a,#fff27a)}
#stage{position:relative;flex:1;min-height:0;border-radius:8px;overflow:hidden;border:3px solid #7ad84a;box-shadow:0 0 0 2px var(--line);background:#2d7a2d}
#cv{position:absolute;inset:0;width:100%;height:100%}
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;pointer-events:none;font-size:34px;color:#fff6a0;
  text-shadow:2px 2px 0 #7a2a00,-2px -2px 0 #7a2a00,2px -2px 0 #7a2a00,-2px 2px 0 #7a2a00,0 4px 0 #7a2a00;line-height:1.4}
#redAlert{position:absolute;left:50%;top:44%;width:min(94%,520px);height:auto;pointer-events:none;z-index:2;
  transform:translate(-50%,-50%);filter:drop-shadow(0 6px 10px #0009)}
#redAlert.show{animation:redIn 2.6s ease-out forwards}
@keyframes redIn{
  0%{transform:translate(-50%,-50%) scale(.35);opacity:0}
  12%{transform:translate(-50%,-50%) scale(1.14);opacity:1}
  20%{transform:translate(-50%,-50%) scale(.97)}
  27%{transform:translate(-50%,-50%) scale(1)}
  34%{transform:translate(-47.5%,-50%) scale(1)}
  38%{transform:translate(-52.5%,-50%) scale(1)}
  42%{transform:translate(-48.5%,-50%) scale(1)}
  46%{transform:translate(-50%,-50%) scale(1)}
  80%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.06);opacity:0}
}
@media (prefers-reduced-motion:reduce){#redAlert.show{animation:redFade 2.6s linear forwards}@keyframes redFade{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}}
#banner small{display:block;font-size:14px;color:#fff;text-shadow:1px 1px 0 #7a2a00,-1px -1px 0 #7a2a00,1px -1px 0 #7a2a00,-1px 1px 0 #7a2a00}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,70,140,.9);
  padding:12px;box-sizing:border-box}
.card{width:100%;max-width:340px;max-height:100%;overflow-y:auto;touch-action:pan-y;text-align:center;box-sizing:border-box;padding:4px 2px 10px}
.logo{height:clamp(210px,40vh,340px);background:#0a1630 url(logo.jpg) center 42%/auto 112% no-repeat}
#overlay.is-title{background:#0a1630;padding:0;align-items:flex-start}
#overlay.is-title .card{max-width:none;padding:0 0 10px}
.pad{max-width:340px;margin:0 auto;padding:0 14px}
.card h1{font-weight:400;font-size:clamp(28px,9.5vw,40px);margin:6px 0 0;line-height:1.15;color:var(--fg);text-shadow:3px 3px 0 #c4521e}
.card h2{font-weight:400;font-size:28px;margin:4px 0;color:var(--fg);text-shadow:3px 3px 0 #c4521e}
.card .tag{margin:6px 0 0;font-size:11px;letter-spacing:.3em;color:var(--green)}
.card p{margin:6px 0;font-size:13px;line-height:1.6;color:#e4f3ff}
.rules{text-align:left;font-size:13px;line-height:1.6;background:#1f6fc4;border:2px solid var(--line);border-radius:8px;
  padding:9px 11px;margin:12px 0;color:var(--ink)}
.rules div{display:grid;grid-template-columns:18px 1fr;gap:4px;margin-bottom:3px}
.rules em{font-style:normal;color:var(--orange)}
.spr{--u:72px;--c:0;--r:0;display:inline-block;width:var(--u);height:var(--u);background-repeat:no-repeat;
  background-size:calc(var(--u)*8) calc(var(--u)*6);background-position:calc(var(--u)*var(--c)*-1) calc(var(--u)*var(--r)*-1)}
.spr.cheer{animation:cheer .7s steps(1) infinite}
@keyframes cheer{0%{background-position:calc(var(--u)*-4) calc(var(--u)*-5)}50%{background-position:calc(var(--u)*-5) calc(var(--u)*-5)}}
.cast{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:2px 0 0}
.big{font-size:22px;color:var(--fg);margin:6px 0}
.sp-btn{display:block;width:100%;margin:8px 0 0;padding:11px 0;font-size:18px;color:#2a1200;background:var(--orange);
  border:3px solid #fff;border-radius:8px;box-shadow:0 4px 0 #8a4a00}
.sp-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4a00}
.sp-btn.sub{background:#2f8fe6;color:#fff;border-color:#ffd84a;box-shadow:0 4px 0 #14457f;font-size:15px}
.copy{font-size:10px!important;color:#cfe6ff!important;letter-spacing:.04em;margin-top:14px!important}
#ctrl{flex:0 0 auto;height:clamp(154px,21vh,182px);display:flex;justify-content:space-between;align-items:center;padding:0 14px 0 28px}
#stick{position:relative;width:112px;height:112px;border-radius:50%;background:#2f8fe6aa;border:3px solid #ffd84a}
#stick::after{content:"";position:absolute;inset:-20px;border-radius:50%;z-index:-1;pointer-events:none;
  background:radial-gradient(circle,#0000 0 62%,#ffffff33 64%,#ffffff2a 100%);border:3px dashed #ffb04a}
#ringLabel{position:absolute;left:50%;top:-19px;font-size:10px;transform:translateX(-50%);color:#fff;letter-spacing:.02em;white-space:nowrap;pointer-events:none;text-shadow:0 1px 0 #7a3a00}
#stick::before{content:"▲\A◀　▶\A▼";white-space:pre;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;color:#ffffff66;font-size:20px;line-height:1.25}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0,#b7c0ff 45%,#6a76c8 100%);border:3px solid #fff5;pointer-events:none}
#digBtn{width:100px;height:100px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,#ffd37a 0,#ff9f2e 55%,#c8620a 100%);border:4px solid #fff;
  box-shadow:0 5px 0 #7a3a00;color:#2a1200;font-size:22px;line-height:1.1}
#digBtn small{font-size:10px}
#digBtn.on{transform:translateY(4px);box-shadow:0 1px 0 #7a3a00}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat"><b>STAGE</b><span id="vStage">1</span></div>
    <div class="stat" id="stLife"><b>MISS</b><span id="vLife"></span></div>
    <div class="stat"><b>ハシゴ</b><span id="vLad">×3</span></div>
    <div class="stat"><b>金</b><span id="vGold">0/10</span></div>
    <div class="stat" id="stScore"><b>SCORE</b><span id="vScore">0</span></div>
    <button id="pauseBtn" aria-label="ポーズ">II</button>
  </div>
  <div id="progBar"><div id="prog"></div></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="banner" hidden></div>
    <img id="redAlert" src="redalert.png" alt="あかいロボが きた！" hidden>
    <div id="overlay"></div>
  </div>
  <div id="ctrl">
    <div id="stick"><div id="knob"></div><span id="ringLabel">この外側タップで ホル</span></div>
    <div id="digBtn">ホル<small>あなをほる</small></div>
  </div>
</div>

<script>
// ---- Touch guards (ダブルタップ拡大・ピンチ・スクロール・長押しの抑止) ----
const KEEP='button,.menu,.scrollable';
document.addEventListener('touchstart',e=>{
  if(e.touches.length>1||!e.target.closest(KEEP))e.preventDefault();
},{passive:false});
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{
  const t=Date.now();
  if(t-lastTouchEnd<350&&!e.target.closest(KEEP))e.preventDefault();
  lastTouchEnd=t;
},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(!e.target.closest('.scrollable'))e.preventDefault();},{passive:false});

(()=>{
'use strict';
const COLS=13, PSPD=3.9, HOLE_LIFE=5.5, HOLE_OPEN=0.3, DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d'), ov=$('overlay'), banner=$('banner');
const COPY='<p class="copy"><b>©YoshidaStudio, ©PANICPUMPKIN</b></p>';
const rnd=n=>Math.floor(Math.random()*n);

// ---------- canvas sizing (all drawing in device pixels) ----------
let S=30, ox=0, viewRows=20;
function resize(){
  const r=cv.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr));
  S=Math.max(8,Math.floor(cv.width/COLS)); ox=Math.floor((cv.width-S*COLS)/2); viewRows=cv.height/S;
  ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize);

// ---------- audio ----------
let ac=null, sfxOn=true;
function initAudio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
  loadSamples();
}
// short sound samples (wav). Until one is decoded (or if it fails) a synthesized blip stands in
const SAMPLES={dig:{file:'dig.wav',vol:.55},spawn:{file:'spawn.wav',vol:.5},gold:{file:'gold.wav',vol:.6},clear:{file:'clear.wav',vol:.5},miss:{file:'miss.wav',vol:.55}};
function loadSamples(){
  if(!ac)return;
  for(const k in SAMPLES){
    const m=SAMPLES[k];
    if(m.buf||m.loading)continue;
    m.loading=true;
    fetch(m.file).then(r=>r.arrayBuffer()).then(a=>new Promise((ok,ng)=>ac.decodeAudioData(a,ok,ng)))
      .then(b=>{m.buf=b;}).catch(()=>{m.loading=false;});
  }
}
function playSample(k,fallback){
  if(!ac||!sfxOn)return;
  const m=SAMPLES[k];
  if(!m.buf){fallback();return;}
  const s=ac.createBufferSource(),g=ac.createGain();
  s.buffer=m.buf;g.gain.value=m.vol;s.connect(g);g.connect(ac.destination);s.start();
}
function tone(f,d,type,vol,slide,delay){
  if(!ac||!sfxOn)return;
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(delay||0);
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol||.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.02);
}
const SFX={
  dig:()=>playSample('dig',()=>tone(200,.09,'square',.05,-100)),
  no:()=>tone(110,.08,'square',.04),
  fall:()=>tone(520,.35,'triangle',.07,-420),
  trap:()=>tone(420,.2,'triangle',.05,-300),
  stomp:()=>{tone(330,.07,'square',.06);tone(660,.1,'square',.06,0,.07);},
  crush:()=>{tone(150,.2,'sawtooth',.06,-90);tone(90,.2,'square',.05,-40,.05);},
  miss:()=>playSample('miss',()=>tone(440,.5,'sawtooth',.07,-380)),
  clear:()=>playSample('clear',()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.06,0,i*.12))),
  ladder:()=>[392,523,659].forEach((f,i)=>tone(f,.08,'square',.05,0,i*.06)),
  coin:()=>playSample('gold',()=>{tone(988,.07,'square',.05);tone(1319,.14,'square',.05,0,.07);}),
  alarm:()=>[880,660,880,660].forEach((f,i)=>tone(f,.12,'square',.05,0,i*.14)),
  pop:()=>tone(300,.12,'square',.04,300),
  spawn:()=>playSample('spawn',()=>tone(300,.12,'square',.04,300)),
  go:()=>tone(660,.2,'square',.05)
};

// ---------- BGM (bgm.mp3, quiet; looped through WebAudio so it works on iOS too) ----------
const BGM_VOL=0.2, BGM_LEN=143.7; // the file ends with ~1.5s of silence, which is left out of the loop
let bgmBuf=null, bgmGain=null, bgmSrc=null, bgmWant=false, bgmOff=0, bgmAt=0, bgmLoading=false;
function bgmLoad(){
  if(bgmBuf||bgmLoading||!ac)return;
  bgmLoading=true;
  fetch('bgm.mp3').then(r=>r.arrayBuffer()).then(a=>new Promise((ok,ng)=>ac.decodeAudioData(a,ok,ng)))
    .then(b=>{bgmBuf=b;if(bgmWant)bgmStart();}).catch(()=>{bgmLoading=false;});
}
function bgmStart(){
  bgmWant=true;
  if(!ac||!sfxOn)return;
  if(!bgmBuf){bgmLoad();return;}
  if(bgmSrc)return;
  if(!bgmGain){bgmGain=ac.createGain();bgmGain.connect(ac.destination);}
  bgmGain.gain.cancelScheduledValues(ac.currentTime);bgmGain.gain.value=BGM_VOL;
  const s=ac.createBufferSource();
  s.buffer=bgmBuf;s.loop=true;s.loopStart=0;s.loopEnd=Math.min(BGM_LEN,bgmBuf.duration);
  s.connect(bgmGain);s.start(0,bgmOff%s.loopEnd);bgmAt=ac.currentTime-bgmOff;bgmSrc=s;
}
function bgmPause(){ // keeps the position, so bgmStart() continues from here
  if(!bgmSrc)return;
  bgmOff=(ac.currentTime-bgmAt)%bgmSrc.loopEnd;
  try{bgmSrc.stop();}catch(e){}
  bgmSrc=null;
}
function bgmStop(){bgmWant=false;bgmPause();bgmOff=0;}

// ---------- game state ----------
let st='title', stage=1, score=0, lives=3, best=0;
try{best=+localStorage.getItem('horihori_best')||0;}catch(e){}
let grid=null, H=0, startX=5, startY=0, holes=new Map(), ens=[], pl=null, camY=0, camSpd=1;
let grace=0, readyT=0, bestRow=0, flow=null, flowKey=-1, tNow=0, digReq=0, digHeld=false, digFresh=false, digHeldT=0;
const digIds=new Set(); // pointers currently pressing 'dig' (the button, or any tap outside the stick)
let exitX=1, redDone=false, bannerT=0, redT=0, fxP=[], fxT=[], ladders=3, golds=[], goldGot=0;
const RESPAWN_PAUSE=2.0, GOLD_N=10, GOLD_PTS=300, PERFECT_PTS=3000;
const idx=(x,y)=>y*COLS+x;
const isWall=(x,y)=>x<0||x>=COLS||y<0||y>=H||grid[idx(x,y)]===1;

// ---------- stage generation ----------
function genStage(n){
  const R=Math.min(16+n*3,32), SR=6, CW=6;
  const hh0=2*R+SR+1, hh=hh0+2; // 2 extra rows on top: exit row (row 1) and the wall row in front of it (row 2)
  camSpd=Math.min(2.0,0.95+0.12*n);
  let bestG=null, bestSlack=-1e9;
  for(let tries=0;tries<40;tries++){
    const g0=new Uint8Array(hh0*COLS).fill(1), g=g0;
    const open=(x,y)=>{g[y*COLS+x]=0;};
    const vis=new Uint8Array(CW*R), sx=rnd(CW), list=[[sx,R-1]];
    vis[(R-1)*CW+sx]=1; open(2*sx+1,2*(R-1)+1);
    while(list.length){
      const i=Math.random()<0.5?list.length-1:rnd(list.length), [cx,cy]=list[i], nb=[];
      for(const [dx,dy] of DIRS){const nx=cx+dx,ny=cy+dy;if(nx>=0&&nx<CW&&ny>=0&&ny<R&&!vis[ny*CW+nx])nb.push([nx,ny]);}
      if(!nb.length){list.splice(i,1);continue;}
      const [nx,ny]=nb[rnd(nb.length)];
      open(2*cx+1+(nx-cx),2*cy+1+(ny-cy)); open(2*nx+1,2*ny+1);
      vis[ny*CW+nx]=1; list.push([nx,ny]);
    }
    // extra openings (braid)
    for(let y=1;y<2*R;y++)for(let x=1;x<COLS-1;x++){
      if((x+y)%2===1&&g[y*COLS+x]===1&&Math.random()<0.15)open(x,y);
    }
    // bomberman-like rooms: 3x3 with a pillar in the middle
    const rooms=Math.floor(R/5)+1;
    for(let k=0;k<rooms;k++){
      const cx=rnd(CW-1), cy=2+rnd(Math.max(1,R-4)), x0=2*cx+1, y0=2*cy+1;
      for(let y=y0;y<=y0+2;y++)for(let x=x0;x<=x0+2;x++)open(x,y);
      g[(y0+1)*COLS+(x0+1)]=1;
    }
    // start room (pillars at even,even)
    for(let y=2*R;y<2*R+SR;y++)for(let x=1;x<COLS-1;x++){if(!(x%2===0&&y%2===0))open(x,y);}
    // shift the maze down 2 rows and cut ONE exit through the top two rows
    const g2=new Uint8Array(hh*COLS).fill(1);
    g2.set(g0,2*COLS);
    const ex=1+2*rnd(6);
    g2[1*COLS+ex]=0;g2[2*COLS+ex]=0;
    const sy=hh-3, sxp=5;
    // solvability vs. scroll speed
    const par=new Int32Array(hh*COLS).fill(-2), q=[idx(sxp,sy)], dist=new Int32Array(hh*COLS);
    par[q[0]]=-1; let goal=-1;
    for(let qi=0;qi<q.length&&goal<0;qi++){
      const c=q[qi], cx=c%COLS, cy=(c/COLS)|0;
      for(const [dx,dy] of DIRS){
        const nx=cx+dx,ny=cy+dy;
        if(nx<0||nx>=COLS||ny<0||ny>=hh||g2[idx(nx,ny)]||par[idx(nx,ny)]!==-2)continue;
        par[idx(nx,ny)]=c; dist[idx(nx,ny)]=dist[c]+1; q.push(idx(nx,ny));
        if(ny===1){goal=idx(nx,ny);break;}
      }
    }
    let slack=1e9;
    for(let c=goal;c>=0;c=par[c]){
      const d=dist[c], y=(c/COLS)|0, t=d/2.8;
      slack=Math.min(slack,(hh-camSpd*Math.max(0,t-2.2))-(y+1));
    }
    if(slack>bestSlack){bestSlack=slack;bestG={g:g2,hh,R,sy,sxp,ex};}
    if(slack>=2.5)break;
  }
  grid=bestG.g; H=bestG.hh; exitX=bestG.ex; startX=bestG.sxp; startY=bestG.sy;
  holes=new Map(); ens=[]; fxP=[]; fxT=[]; flow=null; flowKey=-1;
}
function mkEnt(x,y,active,red){
  return {red:!!red,cx:x,cy:y,nx:x,ny:y,p:0,moving:false,dx:0,dy:1,state:'walk',t:0,dur:3,active:active,stomped:false,ph:Math.random()*6};
}
const ePos=e=>e.moving?[e.cx+(e.nx-e.cx)*e.p,e.cy+(e.ny-e.cy)*e.p]:[e.cx,e.cy];

// ---------- movement (tile stepping, reversal allowed mid-step) ----------
function startMove(e,chooser,canEnter){
  const w=chooser(e); if(!w)return false;
  const nx=e.cx+w[0], ny=e.cy+w[1];
  if(!canEnter(e,nx,ny))return false;
  e.nx=nx;e.ny=ny;e.dx=w[0];e.dy=w[1];e.moving=true;e.p=0;return true;
}
function advance(e,dt,speed,chooser,canEnter,onArrive,canReverse){
  if(e.moving&&canReverse){
    const w=chooser(e);
    if(w&&w[0]===-e.dx&&w[1]===-e.dy){
      [e.cx,e.nx]=[e.nx,e.cx];[e.cy,e.ny]=[e.ny,e.cy];e.p=1-e.p;e.dx=-e.dx;e.dy=-e.dy;
    }
  }
  if(e.moving){
    e.p+=speed*dt;
    if(e.p>=1){
      const over=e.p-1;
      e.cx=e.nx;e.cy=e.ny;e.moving=false;e.p=0;
      onArrive(e);
      if(e.state==='walk'&&startMove(e,chooser,canEnter))e.p=Math.min(over,0.99);
    }
  }else{
    startMove(e,chooser,canEnter);
  }
}

// ---------- flow field (BFS from the player) ----------
function updateFlow(){
  const px=pl.moving&&pl.p>=0.5?pl.nx:pl.cx, py=pl.moving&&pl.p>=0.5?pl.ny:pl.cy, key=idx(px,py);
  if(key===flowKey&&flow)return;
  flowKey=key; flow=new Int16Array(H*COLS).fill(9999);
  const q=[key]; flow[key]=0;
  for(let qi=0;qi<q.length;qi++){
    const c=q[qi], cx=c%COLS, cy=(c/COLS)|0;
    for(const [dx,dy] of DIRS){
      const nx=cx+dx,ny=cy+dy;
      if(isWall(nx,ny)||flow[idx(nx,ny)]!==9999)continue;
      flow[idx(nx,ny)]=flow[c]+1; q.push(idx(nx,ny));
    }
  }
}

// ---------- player ----------
const inp={stick:null,kb:null};
const inputDir=()=>inp.stick||inp.kb;
const squeezeLimit=()=>camY+viewRows-0.7; // the lowest y the player can stand at; the screen's bottom edge pushes them up
function enterPlayer(e,nx,ny){return !isWall(nx,ny)&&!(ny>e.cy&&ny>squeezeLimit());}
function trappedAt(x,y){return ens.find(o=>o.state==='trapped'&&o.cx===x&&o.cy===y);}
function arrivePlayer(p){
  p.forced=false;
  if(p.cy===1){stageClear();return;}
  if(p.cy<bestRow){score+=(bestRow-p.cy)*10;bestRow=p.cy;}
  if(holes.has(idx(p.cx,p.cy))){
    const e=trappedAt(p.cx,p.cy);
    if(e){
      if(!e.stomped){e.stomped=true;score+=200;text(p.cx+.5,p.cy-.2,'+200','#ffe27a');burst(p.cx+.5,p.cy+.3,'#fff',8);SFX.stomp();}
    }else{
      p.state='stuck';p.t=0;SFX.fall();text(p.cx+.5,p.cy-.2,'ドボン','#9ab');
    }
  }
  if(p.state==='walk'&&digReq>0)tryDig(); // dig right at the tile boundary, even while running
}
// Auto-aim: if a robot is within AIM_RANGE tiles (by walking distance), dig toward it
// (the tile next to the player on the robot's way here); otherwise dig where the player faces.
const AIM_RANGE=5;
function aimDir(){
  if(!flow||pl.moving)return null;
  let best=null,bd=1e9;
  for(const e of ens){
    if(e.state!=='walk'||!e.active||e.cy<camY-1||e.cy>camY+viewRows+1)continue;
    const d=flow[idx(e.cx,e.cy)];
    if(d>=1&&d<=AIM_RANGE&&d<bd){bd=d;best=e;}
  }
  if(!best)return null;
  let x=best.cx,y=best.cy,d=bd;
  while(d>1){
    let found=false;
    for(const [dx,dy] of DIRS){
      const ax=x+dx,ay=y+dy;
      if(!isWall(ax,ay)&&flow[idx(ax,ay)]===d-1){x=ax;y=ay;found=true;break;}
    }
    if(!found)return null;
    d--;
  }
  return [x-pl.cx,y-pl.cy];
}
// After filling a hole, further taps keep filling the other open holes around the player (for a short while)
// instead of digging new ones.
let lastFillAt=-99;
function adjacentHole(aim){
  const ds=aim?[aim].concat(DIRS):DIRS;
  for(const d of ds){const x=pl.cx+d[0],y=pl.cy+d[1];if(holes.has(idx(x,y)))return {x,y,kind:'fill'};}
  return null;
}
function digInfo(){
  if(tNow-lastFillAt<2){const h=adjacentHole(aimDir());if(h)return h;}
  const aim=aimDir(), fx=aim?aim[0]:pl.fx, fy=aim?aim[1]:pl.fy;
  const tx=pl.cx+fx, ty=pl.cy+fy;
  if(isWall(tx,ty)){
    if(tx>=1&&tx<=COLS-2&&ty>=3&&ty<=H-2&&ladders>0)return {x:tx,y:ty,kind:'ladder'};
    return null;
  }
  if(ty<=1||grid[idx(tx,ty)]===2)return null;
  return {x:tx,y:ty,kind:holes.has(idx(tx,ty))?'fill':'dig'};
}
function tryDig(){
  const t=digInfo(); digReq=0;
  if(!t){
    if(digFresh){SFX.no();if(ladders<=0&&isWall(pl.cx+pl.fx,pl.cy+pl.fy))text(pl.cx+.5,pl.cy-.3,'ハシゴなし','#ff9a9a');}
    digFresh=false;return;
  }
  pl.fx=t.x-pl.cx;pl.fy=t.y-pl.cy; // face the target while digging
  const k=idx(t.x,t.y);
  if(t.kind!=='dig'&&!digFresh)return; // holding the button only digs; filling / ladders need a new tap
  digFresh=false;
  if(t.kind==='ladder'){ // lean a ladder on the wall: it can be crossed from now on (by robots too)
    ladders--;grid[k]=2;flowKey=-1;
    pl.state='dig';pl.t=pl.digDur=0.3;SFX.ladder();burst(t.x+.5,t.y+.5,'#c9a05a',8);text(t.x+.5,t.y-.2,'ハシゴ！','#ffe27a');updateHud();
    return;
  }
  if(t.kind==='fill'){ // dig again = fill the hole
    holes.delete(k);lastFillAt=tNow;
    const e=trappedAt(t.x,t.y);
    if(e){killEnemy(e,300,'#fff');SFX.crush();}
    pl.state='dig';pl.t=pl.digDur=0.2;SFX.dig();burst(t.x+.5,t.y+.5,'#a47a42',7);
    return;
  }
  holes.set(k,{x:t.x,y:t.y,age:0});
  pl.state='dig';pl.t=pl.digDur=0.25;SFX.dig();burst(t.x+.5,t.y+.5,'#a47a42',7);
  for(const o of ens){ // a robot standing there falls in
    if(o.state!=='walk')continue;
    const nx=o.moving&&o.p>=0.5?o.nx:o.cx, ny=o.moving&&o.p>=0.5?o.ny:o.cy;
    if(nx===t.x&&ny===t.y){
      Object.assign(o,{cx:nx,cy:ny,nx:nx,ny:ny,moving:false,p:0,state:'trapped',t:0,dur:3+Math.random()*1.2,active:true});
      SFX.trap();
    }
  }
}
function climbOut(){
  const d=inputDir(), tries=[];
  if(d)tries.push(d);
  for(const dd of DIRS)tries.push(dd);
  let pick=null;
  for(const dd of tries){const nx=pl.cx+dd[0],ny=pl.cy+dd[1];if(!isWall(nx,ny)&&!holes.has(idx(nx,ny))){pick=dd;break;}}
  if(!pick)for(const dd of tries){if(!isWall(pl.cx+dd[0],pl.cy+dd[1])){pick=dd;break;}}
  if(!pick)return;
  pl.state='walk';pl.nx=pl.cx+pick[0];pl.ny=pl.cy+pick[1];pl.dx=pick[0];pl.dy=pick[1];pl.moving=true;pl.p=0;
}
function updPlayer(dt){
  const p=pl; p.inv=Math.max(0,p.inv-dt); digReq=Math.max(0,digReq-dt);
  digHeldT=digHeld?digHeldT+dt:0;
  if(digHeld&&digHeldT>0.5)digReq=0.4; // only a deliberate hold repeats; a slow tap must not dig twice
  if(digReq<=0&&!digHeld)digFresh=false;
  const d=inputDir();
  if(d&&p.state!=='stuck'){p.fx=d[0];p.fy=d[1];}
  if(p.state==='walk'){
    if(!p.moving&&digReq>0)tryDig();
    if(p.state==='walk')advance(p,dt,PSPD,inputDir,enterPlayer,arrivePlayer,!p.forced);
  }else if(p.state==='dig'){
    p.t-=dt;if(p.t<=0)p.state='walk';
  }else if(p.state==='stuck'){
    p.t+=dt;if(p.t>=1.0)climbOut();
  }
}

// ---------- enemies ----------
function blockedByEnemy(e,nx,ny){
  for(const o of ens){
    if(o===e||o.state!=='walk')continue;
    if((o.cx===nx&&o.cy===ny)||(o.moving&&o.nx===nx&&o.ny===ny))return true;
  }
  return false;
}
const enterEnemy=(e,nx,ny)=>!isWall(nx,ny)&&!blockedByEnemy(e,nx,ny);
function chooseEnemy(e){
  const opts=[];
  for(const d of DIRS){const nx=e.cx+d[0],ny=e.cy+d[1];if(!isWall(nx,ny))opts.push([d,flow[idx(nx,ny)]+Math.random()*0.5]);}
  if(!opts.length)return null;
  if(Math.random()<0.08)return opts[rnd(opts.length)][0];
  opts.sort((a,b)=>a[1]-b[1]);
  return opts[0][0];
}
function arriveEnemy(e){
  if(!holes.has(idx(e.cx,e.cy)))return;
  if(trappedAt(e.cx,e.cy))return; // walks over the trapped robot's head
  e.state='trapped';e.t=0;e.dur=3+Math.random()*1.2;SFX.trap();
}
function escapeEnemy(e){
  let best=null,bd=1e9;
  for(const d of DIRS){const nx=e.cx+d[0],ny=e.cy+d[1];if(isWall(nx,ny))continue;const v=flow[idx(nx,ny)]+Math.random();if(v<bd){bd=v;best=d;}}
  if(!best)return;
  e.state='walk';e.dx=best[0];e.dy=best[1];e.nx=e.cx+best[0];e.ny=e.cy+best[1];e.moving=true;e.p=0;
}
function updEnemy(e,dt){
  if(e.state==='dead')return;
  if(!e.active){if(e.cy>=camY-4)e.active=true;else return;}
  if(e.state==='trapped'){e.t+=dt;if(e.t>=e.dur)escapeEnemy(e);return;}
  const spd=e.red?3.1:Math.min(2.6,1.6+0.15*stage);
  advance(e,dt,spd,chooseEnemy,enterEnemy,arriveEnemy,false);
}
function killEnemy(e,pts,col){
  e.state='dead';
  if(e.red){if(pts)pts+=700;}else sendToQueue(e);
  if(pts){score+=pts;text(e.cx+.5,e.cy-.2,'+'+pts,'#ffe27a');}
  burst(e.cx+.5,e.cy+.5,col||'#fff',12);
}
function updHoles(dt){
  for(const [k,h] of holes){
    h.age+=dt;
    if(h.age<HOLE_LIFE)continue;
    holes.delete(k);
    const e=trappedAt(h.x,h.y);
    if(e){killEnemy(e,300,'#fff');SFX.crush();}
    if(pl.state==='stuck'&&pl.cx===h.x&&pl.cy===h.y)miss('あなにうまった！');
  }
}
// ---------- robot waiting line ----------
// Defeated robots queue up in a strip at the top of the screen. After a delay the head of the line
// slides over and drops into the maze; the rest close up behind it.
const MAX_ROBOTS=5, SLOT0=0.75, SLOTW=0.95;
let queue=[], entering=[];
const respawnDelay=()=>Math.max(4,7.5-0.4*stage);
function sendToQueue(e){
  queue.push({t:respawnDelay(),delay:respawnDelay(),x:Math.max(0.5,Math.min(COLS-.5,e.cx+.5)),ph:Math.random()*6});
}
function pickSpawn(x0){
  const y=Math.floor(camY)-1;
  if(y<2)return null;
  const xs=[];for(let x=1;x<COLS-1;x++)xs.push(x);
  xs.sort((a,b)=>Math.abs(a-x0)-Math.abs(b-x0)+(Math.random()-.5)*3);
  for(const x of xs){
    if(isWall(x,y)||ens.some(o=>o.state!=='dead'&&o.cx===x&&o.cy===y))continue;
    return {x,y};
  }
  return null;
}
const redAlert=$('redAlert');
function showRedAlert(){ // the cut-in picture: pops in, shakes, fades out (2.6s)
  redAlert.hidden=false;redAlert.classList.remove('show');void redAlert.offsetWidth;redAlert.classList.add('show');redT=2.6;
}
function hideRedAlert(){redAlert.hidden=true;redAlert.classList.remove('show');redT=0;}
function spawnRedRobot(){ // once the forced scroll has stopped, ONE red robot comes up from the bottom of the screen
  const y0=Math.min(H-3,Math.floor(camY+viewRows)+1);
  for(let y=y0;y>=y0-4;y--){
    const xs=[];for(let x=1;x<COLS-1;x++)if(!isWall(x,y)&&!ens.some(o=>o.state!=='dead'&&o.cx===x&&o.cy===y))xs.push(x);
    if(xs.length){
      const e=mkEnt(xs[rnd(xs.length)],y,true,true);ens.push(e);redDone=true;
      showRedAlert();SFX.spawn();SFX.alarm();
      return;
    }
  }
}
function updQueue(dt){
  queue.forEach((q,i)=>{q.t-=dt;q.x+=(SLOT0+i*SLOTW-q.x)*Math.min(1,dt*7);});
  const h=queue[0];
  if(h&&h.t<=0&&camY>=3){
    const sp=pickSpawn(1+rnd(COLS-2));
    if(sp){queue.shift();entering.push({x:h.x,x1:sp.x+.5,p:0,ph:h.ph});}
  }
  for(const en of entering){
    en.p+=dt/0.4;en.x+=(en.x1-en.x)*Math.min(1,dt*10);
    if(en.p>=1&&!en.done){
      en.done=true;
      const sp=pickSpawn(en.x1-.5);
      if(sp){ens.push(mkEnt(sp.x,sp.y,true));burst(sp.x+.5,sp.y+1,'#fff',8);SFX.spawn();}
      else queue.unshift({t:0.3,delay:respawnDelay(),x:en.x,ph:en.ph});
    }
  }
  entering=entering.filter(e=>!e.done);
}

// ---------- miss / clear / flow of the game ----------
function miss(msg){
  if(pl.state==='dead')return;
  digReq=0;digFresh=false;digHeld=false;digHeldT=0;digIds.clear();lastFillAt=-99;
  pl.state='dead';pl.t=0;pl.moving=false;lives--;st='dead';SFX.miss();updateHud();
  text(pl.cx+.5,pl.cy-.6,msg,'#ff9a9a');
  burst(pl.cx+.5,pl.cy+.5,'#ffd23c',14);
}
function respawn(){
  const ty=Math.min(H-3,Math.floor(camY+viewRows*0.6)), ys=Math.max(2,Math.floor(camY)+2), ye=Math.min(H-2,Math.floor(camY+viewRows)-2);
  let bx=startX,by=Math.min(startY,ye),bd=1e9;
  for(let y=ys;y<=ye;y++)for(let x=1;x<COLS-1;x++){
    if(isWall(x,y)||holes.has(idx(x,y)))continue;
    let d=Math.abs(x-6)+Math.abs(y-ty);
    for(const e of ens)if(e.state==='walk'&&e.active&&Math.abs(e.cx-x)+Math.abs(e.cy-y)<4)d+=20;
    if(d<bd){bd=d;bx=x;by=y;}
  }
  Object.assign(pl,{cx:bx,cy:by,nx:bx,ny:by,p:0,moving:false,state:'walk',t:0,inv:2.5});
  for(const e of ens)if(e.state!=='dead'&&!e.red&&Math.abs(e.cx-bx)+Math.abs(e.cy-by)<5&&(e.active||e.cy>=camY-1))killEnemy(e,0,'#fff');
  flowKey=-1;
  grace=RESPAWN_PAUSE; // the forced scroll holds still for a moment, then starts again
}
function placeGold(){ // 10 piles, one per horizontal band of the maze (spread from bottom to top)
  golds=[];goldGot=0;
  const R=(H-9)/2, lo=5, hi=2*R, n=hi-lo+1;
  for(let i=0;i<GOLD_N;i++){
    const y0=lo+Math.floor(i*n/GOLD_N), y1=lo+Math.floor((i+1)*n/GOLD_N)-1, c=[];
    for(let y=y0;y<=y1;y++)for(let x=1;x<COLS-1;x++)if(grid[idx(x,y)]===0&&!golds.some(g=>g.x===x&&g.y===y))c.push([x,y]);
    if(c.length){const p=c[rnd(c.length)];golds.push({x:p[0],y:p[1],got:false});}
  }
}
function collectGold(){
  const [px,py]=ePos(pl);
  for(const g of golds){
    if(g.got||Math.abs(g.x-px)>0.6||Math.abs(g.y-py)>0.6)continue;
    g.got=true;goldGot++;score+=GOLD_PTS;SFX.coin();
    text(g.x+.5,g.y-.2,'+'+GOLD_PTS,'#ffe27a');burst(g.x+.5,g.y+.5,'#ffd23a',10);
  }
}
function loadStage(){
  genStage(stage);
  queue=[];entering=[];redDone=false;bannerT=0;hideRedAlert();
  placeGold();
  for(let i=0;i<MAX_ROBOTS;i++)queue.push({t:2+i*1.4,delay:respawnDelay()+2+i*1.4,x:SLOT0+i*SLOTW,ph:Math.random()*6});
  pl={cx:startX,cy:startY,nx:startX,ny:startY,p:0,moving:false,dx:0,dy:-1,fx:0,fy:-1,state:'walk',t:0,inv:0};
  camY=Math.max(0,H-viewRows); bestRow=pl.cy; digReq=0; digFresh=false; digHeld=false; digHeldT=0; ladders=3;
  st='ready'; readyT=1.4; ov.hidden=true;
  banner.innerHTML='STAGE '+stage+'<small>つぶされるまえに うえの ゴールへ！</small>'; banner.hidden=false;
  SFX.go(); updateHud();
}
function stageClear(){
  if(st!=='play')return;
  st='clear'; bgmPause(); SFX.clear();
  const bonus=1000+lives*500, perfect=goldGot>=golds.length&&golds.length>0; score+=bonus+(perfect?PERFECT_PTS:0); saveBest();
  card('<div class="cast"><i class="spr cheer" style="--u:88px;background-image:var(--hero-sheet)"></i></div><h2>STAGE '+stage+' CLEAR!</h2><p class="big">ボーナス +'+bonus+'</p><p>金 '+goldGot+' / '+golds.length+'</p>'+(perfect?'<p class="big">PERFECT! +'+PERFECT_PTS+'</p>':'')+'<p>SCORE '+score+'</p>'+
    '<button class="sp-btn" data-act="next">つぎのステージへ</button>');
  updateHud();
}
function gameOver(){
  st='over'; bgmStop(); saveBest();
  card('<div class="cast"><i class="spr" style="--u:88px;--r:5;background-image:var(--hero-sheet)"></i></div><h2>GAME OVER</h2><p class="big">SCORE '+score+'</p><p>BEST '+best+'　到達 STAGE '+stage+'</p>'+
    '<button class="sp-btn" data-act="retry">もういちど</button><button class="sp-btn sub" data-act="title">タイトルへ</button>'+COPY);
  updateHud();
}
function saveBest(){if(score>best){best=score;try{localStorage.setItem('horihori_best',String(best));}catch(e){}}}

// ---------- effects ----------
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*3;fxP.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,life:.5+Math.random()*.3,col});}}
function text(x,y,s,col){fxT.push({x,y,s,col,life:1.1});}
function updFx(dt){
  for(const p of fxP){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=9*dt;}
  fxP=fxP.filter(p=>p.life>0);
  for(const t of fxT){t.life-=dt;t.y-=dt*1.1;}
  fxT=fxT.filter(t=>t.life>0);
}

// ---------- update ----------
function update(dt){
  if(!pl){return;}
  if(st==='ready'){
    readyT-=dt;updFx(dt);
    if(readyT<=0){st='play';grace=1.6;banner.hidden=true;}
    return;
  }
  if(st==='dead'){
    pl.t+=dt;updFx(dt);
    if(pl.t>=1.1){if(lives<=0)gameOver();else{respawn();st='play';}}
    return;
  }
  if(st!=='play'){updFx(dt);return;}
  updateFlow();
  updPlayer(dt);
  if(st!=='play')return;
  updHoles(dt);
  if(st!=='play')return;
  for(const e of ens)updEnemy(e,dt);
  // camera: forced scroll (catch-up when the player is far ahead)
  if(grace>0)grace-=dt;
  else{
    let sp=camSpd;
    if(pl.cy-camY<viewRows*0.4)sp*=2.4;
    camY=Math.max(0,camY-sp*dt);
  }
  updQueue(dt);
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)banner.hidden=true;}
  if(redT>0){redT-=dt;if(redT<=0)hideRedAlert();}
  if(camY<=0&&!redDone)spawnRedRobot();
  if(pl.state!=='dead')collectGold();
  for(const e of ens)if(e.state!=='dead'&&!e.red&&e.cy>camY+viewRows+1){e.state='dead';sendToQueue(e);}
  if(ens.length>120)ens=ens.filter(e=>e.state!=='dead');
  // collisions
  const [px,py]=ePos(pl);
  // forced scroll: the bottom edge pushes the player up; only getting squeezed against a wall is a miss
  if(py>squeezeLimit()&&pl.state!=='dead'){
    if(pl.state==='stuck'){miss('つぶされた！');return;}
    if(pl.state==='walk'){
      if(pl.moving){
        if(pl.ny>pl.cy&&!pl.forced){[pl.cx,pl.nx]=[pl.nx,pl.cx];[pl.cy,pl.ny]=[pl.ny,pl.cy];pl.p=1-pl.p;pl.dx=-pl.dx;pl.dy=-pl.dy;}
      }else if(isWall(pl.cx,pl.cy-1)){miss('かべに はさまれた！');return;}
      else{pl.nx=pl.cx;pl.ny=pl.cy-1;pl.dx=0;pl.dy=-1;pl.moving=true;pl.p=0;pl.forced=true;}
    }
  }
  if(pl.inv<=0)for(const e of ens){
    if(e.state!=='walk'||!e.active)continue;

// ---------- sprite sheet (robo.png: 8x6 cells of 128px; white robot / recoloured hero & boss) ----------
// rows: 0 front idle (0-3) + back (4-7) | 1 walk right | 2 walk left | 3 ladder climb | 4 dig (0 ready, 1-7 dig) | 5 down (0-2), overheat (3), cheer (4-5)
const SPR=128;
let SHEETS=null;
function loadSheets(){
  new Image().src='redalert.png'; // preload the cut-in picture // robo.png (white), hero.png (yellow), boss.png (red): the colour variants are made ahead of time, so nothing reads pixels at run time
  const names={white:'robo.png',hero:'hero.png',boss:'boss.png'}, out={};
  let left=3;
  for(const k in names){
    const img=new Image();
    img.onload=()=>{out[k]=img;if(--left===0){SHEETS=out;if(st==='title')titleCard();}};
    img.src=names[k];
  }
}
function drawCell(sh,col,row,X,Y,D,flip){
  const dy=Y+S*.46-D*.945, dx=X-D/2;
  ctx.imageSmoothingEnabled=true;
  if(flip){ctx.save();ctx.translate(X,0);ctx.scale(-1,1);ctx.translate(-X,0);}
  ctx.drawImage(sh,col*SPR,row*SPR,SPR,SPR,dx,dy,D,D);
  if(flip)ctx.restore();
  ctx.imageSmoothingEnabled=false;
}
function walkFrame(dx,dy,moving,ph){
  if(dx!==0)return {row:dx>0?1:2,col:moving?Math.floor(tNow*13+ph)%8:0};
  if(dy<0)return {row:0,col:moving?[4,6,4,7][Math.floor(tNow*10+ph)%4]:4};
  return {row:0,col:moving?Math.floor(tNow*12+ph)%4:Math.floor(tNow*3+ph)%4};
}
const onLadder=e=>{const t=e.moving&&e.p>=.5?[e.nx,e.ny]:[e.cx,e.cy];return grid[idx(t[0],t[1])]===2;};
function drawShadow(X,Y,k){rect(X-S*.26*k,Y+S*.38,S*.52*k,S*.1,'#0003');}
function drawRobotSprite(e,ov){
  const sh=e.red?SHEETS.boss:SHEETS.white, trapped=e.state==='trapped';
  let X,Y,sc=1;
  if(ov){X=ov.X;Y=ov.Y;sc=ov.s;}else{const [x,y]=ePos(e);X=sxp(x+.5);Y=sy(y+.38);}
  let f;
  if(trapped)f={row:5,col:Math.floor(tNow*6+e.ph)%3};
  else if(ov&&ov.mode==='soon')f=Math.floor(tNow*10)%2?{row:5,col:3}:{row:0,col:0};
  else if(!ov&&onLadder(e))f={row:3,col:e.moving?Math.floor(tNow*14+e.ph)%8:0};
  else f=ov?walkFrame(0,1,!!e.moving,e.ph):walkFrame(e.dx||0,e.dy===undefined?1:e.dy,!!e.moving,e.ph);
  const bob=(!trapped&&e.moving&&(f.row===0))?Math.abs(Math.sin(tNow*14+e.ph))*S*.05*sc:0;
  ctx.save();
  if(trapped){ctx.beginPath();ctx.rect(X-S/2,Y-S/2,S,S*.62);ctx.clip();ctx.translate(Math.sin(tNow*30)*S*.02,S*.26);}
  drawShadow(X,Y,sc);
  drawCell(sh,f.col,f.row,X,Y-bob,S*1.4*sc,false);
  ctx.restore();
  if(trapped){ctx.fillStyle='#ffe27a';
    for(let i=0;i<3;i++){const a=tNow*5+i*2.1;ctx.fillRect(Math.round(X+Math.cos(a)*S*.28),Math.round(Y-S*.55+Math.sin(a)*S*.08),Math.max(2,S*.09),Math.max(2,S*.09));}}
}
function drawPlayerSprite(){
  const p=pl;

  const [x,y]=ePos(p);

  if(p.state==='dead'){
    const k=Math.min(1,p.t/1.0);
    f=p.t<.3?{row:5,col:3}:{row:5,col:Math.floor((p.t-.3)*5)%3};

function draw(){

    '<div class="rules">'+
    '<div><em>▲</em><span>画面は<b>強制スクロール</b>。壁に挟まれる前に、上のゴールをめざせ！</span></div>'+
    '<div><em>●</em><span><b>スティック以外のどこをタップ</b>しても穴をほる（ロボが近ければその方向に自動で）。もう一度で埋まる</span></div>'+
    '<div><em>●</em><span>白いロボを穴に落として、<b>頭をふんで</b>わたろう。ふさがるとロボはつぶれる</span></div>'+
    '<div><em>●</em><span>壁にタップで<b>ハシゴ</b>。<b>金塊10個</b>でパーフェクト！</span></div>'+
    '<div><em>●</em><span>ロボにさわる・挟まれる・穴に埋まるとミス。<b>ミスは3回まで</b></span></div>'+
    '</div>'+COPY+'</div>');
  ov.classList.add('is-title');
}
function pauseCard(){
  card('<h2>PAUSE</h2><button class="sp-btn" data-act="resume">つづける</button>'+
    '<button class="sp-btn sub" data-act="sound">おと：'+(sfxOn?'ON':'OFF')+'</button>'+
    '<button class="sp-btn sub" data-act="restart">さいしょから</button>'+
    '<button class="sp-btn sub" data-act="title">タイトルへ</button>');
}
let pausedFrom=null;
function pause(){
  if(pausedFrom||(st!=='play'&&st!=='ready'))return;
  pausedFrom=st;st='pause';pauseCard();bgmPause();if(ac)ac.suspend();
}
function resume(){
  if(!pausedFrom)return;
  st=pausedFrom;pausedFrom=null;ov.hidden=true;if(ac&&sfxOn)ac.resume();bgmStart();
}
function newGame(){initAudio();bgmStop();stage=1;score=0;lives=3;pausedFrom=null;loadStage();bgmStart();}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='start'||a==='retry'||a==='restart')newGame();
  else if(a==='next'){initAudio();stage++;loadStage();bgmStart();}
  else if(a==='resume')resume();
  else if(a==='sound'){sfxOn=!sfxOn;if(!sfxOn)bgmPause();pauseCard();}
  else if(a==='title'){bgmStop();pausedFrom=null;genStage(1);pl=null;camY=Math.max(0,H-viewRows);updateHud();titleCard();}
});
$('pauseBtn').addEventListener('click',()=>{if(st==='pause')resume();else pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

// ---------- input: stick, dig button, keyboard ----------
const stick=$('stick'), knob=$('knob'); let stickId=null;
function stickMove(e){
  const r=stick.getBoundingClientRect();
  const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2), m=Math.hypot(dx,dy), max=r.width/2-8, k=m>max?max/m:1;
  knob.style.transform='translate('+dx*k+'px,'+dy*k+'px)';
  if(m<10){inp.stick=null;return;}
  const cur=inp.stick, horiz=cur&&cur[0]!==0;
  let h;
  if(!cur)h=Math.abs(dx)>Math.abs(dy);
  else if(horiz)h=!(Math.abs(dy)>Math.abs(dx)*1.25);
  else h=Math.abs(dx)>Math.abs(dy)*1.25;
  inp.stick=h?[Math.sign(dx),0]:[0,Math.sign(dy)];
}
function stickEnd(){stickId=null;inp.stick=null;knob.style.transform='';}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);initAudio();stickMove(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e);});
stick.addEventListener('pointerup',e=>{if(e.pointerId===stickId)stickEnd();});
stick.addEventListener('pointercancel',e=>{if(e.pointerId===stickId)stickEnd();});
const dig=$('digBtn');
// One-handed play: a tap anywhere outside the stick works like the dig button
function digPress(id){
  initAudio();
  if(st!=='play')return;
  digIds.add(id);digHeld=true;digFresh=true;digReq=0.4;dig.classList.add('on');
}
function digRelease(id){
  if(!digIds.delete(id))return;
  if(digIds.size===0){digHeld=false;dig.classList.remove('on');}
}
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('#stick,#pauseBtn,#overlay,button'))return;
  e.preventDefault();digPress(e.pointerId);
});
document.addEventListener('pointerup',e=>digRelease(e.pointerId));
document.addEventListener('pointercancel',e=>digRelease(e.pointerId));
const KD={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
const kStack=[];
addEventListener('keydown',e=>{
  if(KD[e.key]){e.preventDefault();const i=kStack.indexOf(e.key);if(i>=0)kStack.splice(i,1);kStack.push(e.key);inp.kb=KD[kStack[kStack.length-1]];}
  else if(e.key===' '||e.key==='z'||e.key==='x'||e.key==='Z'||e.key==='X'){e.preventDefault();if(st!=='play')return;if(!digHeld){digFresh=true;}digHeld=true;digReq=0.4;}
  else if(e.key==='p'||e.key==='Escape'){if(st==='pause')resume();else pause();}
});
addEventListener('keyup',e=>{
  if(KD[e.key]){const i=kStack.indexOf(e.key);if(i>=0)kStack.splice(i,1);inp.kb=kStack.length?KD[kStack[kStack.length-1]]:null;}
  else if(e.key===' '||e.key==='z'||e.key==='x'||e.key==='Z'||e.key==='X')digHeld=false;
});

// ---------- boot ----------
let last=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(t-last)/1000||0);last=t;tNow=t/1000;
  update(dt);draw();
}
loadSheets();resize();genStage(1);camY=Math.max(0,H-viewRows);updateHud();titleCard();
requestAnimationFrame(frame);
window.__dbg={missLoaded:()=>!!SAMPLES.miss.buf,clearLoaded:()=>!!SAMPLES.clear.buf,goldLoaded:()=>!!SAMPLES.gold.buf,digLoaded:()=>!!SAMPLES.dig.buf,spawnLoaded:()=>!!SAMPLES.spawn.buf,bgm:()=>({want:bgmWant,loaded:!!bgmBuf,playing:!!bgmSrc,vol:bgmGain?bgmGain.gain.value:null,off:bgmOff}),setCam:v=>{camY=v;},golds:()=>golds,goldGot:()=>goldGot,queue:()=>queue,killAll:()=>{for(const e of ens)if(e.state!=='dead')killEnemy(e,0,'#fff');},grace:v=>{grace=v;},sync:()=>{flowKey=-1;},st:()=>st,pl:()=>pl,ens:()=>ens,holes:()=>holes,camY:()=>camY,H:()=>H,grid:()=>grid,lives:()=>lives,score:()=>score,viewRows:()=>viewRows};
})();
</script>
</body>
