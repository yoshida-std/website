# NROM-256: PRG 32KB + CHR 8KB(横ミラー=縦スクロール向け) + 電池つきSRAM 8KB($6000。ハイスコア用)
MEMORY {
    ZP:   start = $0000, size = $0100, type = rw;
    OAM:  start = $0200, size = $0100, type = rw;
    RAM:  start = $0300, size = $0500, type = rw;
    HDR:  start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG:  start = $8000, size = $8000, type = ro, file = %O, fill = yes, define = yes;
    CHR:  start = $0000, size = $2000, type = ro, file = %O, fill = yes;
    SRAM: start = $6000, size = $2000, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    OAM:      load = OAM, type = bss, align = $100;
    BSS:      load = RAM, type = bss;
    HEADER:   load = HDR, type = ro;
    CODE:     load = PRG, type = ro, start = $8000;
    RODATA:   load = PRG, type = ro;
    VECTORS:  load = PRG, type = ro, start = $FFFA;
    CHARS:    load = CHR, type = ro;
    SAVE:     load = SRAM, type = bss;
}
