<title>たいじろうやん！</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* Layout: 画面いっぱいのキャンバス。左下に縦スライダー(ゴンドラ上下)、その上にうんちボタン。画面タップで発射。単一テーマのアーケード調。 */
:root {
  --bg: #0c1427;
  --panel: rgba(12, 20, 39, 0.58);
  --line: rgba(255, 255, 255, 0.38);
  --fg: #eef3ff;
  --accent: #ffcf4a;
  --accent-deep: #b8741a;
  --font: 'DotGothic16', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
  color-scheme: dark;
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
button { touch-action: manipulation; }
canvas { -webkit-user-drag: none; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
#probe { position: fixed; top: 0; left: 0; width: 0; height: env(safe-area-inset-top, 0px); visibility: hidden; pointer-events: none; }
.stage {
  position: fixed;
  inset: 0;
  margin: auto;
  width: min(100vw, calc(100dvh * 0.75));
  height: 100dvh;
  overflow: hidden;
  background: #63b9ec;
  touch-action: none;
}
#game { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.controls { position: absolute; inset: 0; pointer-events: none; }
.dock {
  position: absolute;
  left: max(14px, env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
#bomb {
  pointer-events: auto;
  touch-action: none;
  width: 70px;
  height: 78px;
  padding: 6px 0 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font: inherit;
  font-size: 20px;
  line-height: 1;
  color: var(--accent);
  background: var(--panel);
  border: 3px solid var(--line);
  border-radius: 22px;
  cursor: pointer;
}
#bomb .emoji { font-size: 32px; line-height: 1; display: block; }
#bomb.hot { background: rgba(184, 116, 26, 0.85); transform: scale(0.94); }
#bomb.empty { opacity: 0.42; color: #c9d4ee; }
#slider {
  pointer-events: auto;
  touch-action: none;
  position: relative;
  width: 60px;
  height: clamp(160px, 36dvh, 320px);
  background: var(--panel);
  border: 3px solid var(--line);
  border-radius: 32px;
}
#slider::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 14px;
  bottom: 14px;
  width: 4px;
  margin-left: -2px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.28);
}
#thumb {
  position: absolute;
  left: 50%;
  top: 4px;
  width: 46px;
  height: 46px;
  margin-left: -23px;
  border-radius: 50%;
  background:
    repeating-linear-gradient(to bottom, transparent 0 14px, rgba(60, 36, 8, 0.55) 14px 17px, transparent 17px 20px) center / 20px 12px no-repeat,
    var(--accent);
  border: 3px solid #fff3c4;
  box-sizing: border-box;
}
#mute {
  position: absolute;
  right: max(8px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 3px);
  pointer-events: auto;
  font: inherit;
  font-size: 12px;
  height: 22px;
  padding: 0 8px;
  color: var(--fg);
  background: rgba(8, 16, 36, 0.6);
  border: 2px solid var(--line);
  border-radius: 4px;
  cursor: pointer;
}
#guide {
  position: absolute;
  right: max(8px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 27px);
  pointer-events: auto;
  font: inherit;
  font-size: 11px;
  line-height: 1;
  height: 17px;
  padding: 0 7px;
  color: var(--fg);
  background: rgba(8, 16, 36, 0.6);
  border: 2px solid var(--line);
  border-radius: 4px;
  cursor: pointer;
}
#guide[aria-pressed="true"] { background: rgba(255, 207, 74, 0.88); color: #2a1d00; border-color: #ffe28a; }
#pauseBtn {
  position: absolute;
  right: max(8px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 52px);
  pointer-events: auto;
  font: inherit;
  font-size: 12px;
  line-height: 1;
  height: 24px;
  padding: 0 8px;
  color: var(--fg);
  background: rgba(8, 16, 36, 0.6);
  border: 2px solid var(--line);
  border-radius: 4px;
  cursor: pointer;
}
#pauseMenu {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(8, 16, 36, 0.72);
  touch-action: none;
}
#pauseMenu .menu { width: min(240px, 70%); display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
#titleMenu {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(270px, 74%);
  z-index: 4;
  display: flex;
  flex-direction: column;
  gap: 8px;
  touch-action: none;
}
#titleMenu button {
  font: inherit;
  height: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--fg);
  background: rgba(36, 58, 107, 0.95);
  border: 3px solid var(--line);
  border-bottom-width: 5px;
  border-radius: 12px;
  cursor: pointer;
}
#titleMenu button b { font-weight: 400; font-size: 18px; line-height: 1; }
#titleMenu button small { font-size: 11px; line-height: 1; color: #c9d4ee; }
#titleMenu #easyBtn { background: var(--accent-deep); border-color: #e0a043; color: #fff7e0; }
#titleMenu #easyBtn small { color: #ffe9bf; }
#titleMenu button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#rotate {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--bg);
  color: var(--fg);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-align: center;
  padding: 24px;
  font-size: 18px;
  line-height: 1.7;
  touch-action: none;
}
#rotate small { font-size: 12px; color: #c9d4ee; }
#rotate .phone {
  width: 44px;
  height: 76px;
  border: 4px solid var(--accent);
  border-radius: 9px;
  position: relative;
  animation: tilt 2.4s ease-in-out infinite;
}
#rotate .phone::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 12px; height: 4px; margin-left: -6px; border-radius: 2px; background: var(--accent); }
@keyframes tilt { 0%, 30% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
@media (orientation: landscape) and (pointer: coarse) and (max-height: 600px) {
  #rotate { display: flex; }
}
@media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; } }
#pauseMenu .credit { text-align: center; font-size: 11px; color: #9db0d6; margin-top: 4px; }
#pauseMode { text-align: center; font-size: 13px; color: #9fe3ff; margin-top: -6px; }
#pauseMenu h2 { margin: 0 0 6px; text-align: center; font-size: 30px; font-weight: 400; letter-spacing: 0.1em; color: var(--accent); }
#pauseMenu button {
  font: inherit;
  font-size: 18px;
  height: 54px;
  color: var(--fg);
  background: rgba(36, 58, 107, 0.95);
  border: 3px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
}
#pauseMenu #resumeBtn { background: var(--accent-deep); border-color: #e0a043; color: #fff7e0; }
#pauseBtn:focus-visible, #pauseMenu button:focus-visible, #mute:focus-visible, #guide:focus-visible, #bomb:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>

<script>
/* ---- 拡大・ダブルタップ・長押しメニューを止める（公開ページ単体でも遊べるように） ---- */
(function () {
  var opt = { passive: false };
  function stop(e) { e.preventDefault(); }
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) { document.addEventListener(n, stop, opt); });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, opt);
  document.addEventListener('dblclick', stop, opt);
  document.addEventListener('contextmenu', stop, opt);
  document.addEventListener('dragstart', stop, opt);
  document.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, opt);
  window.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) e.preventDefault();
  }, opt);
  var lastEnd = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    var t = e.target;
    var inMenu = t && t.closest && t.closest('#pauseMenu, #titleMenu');
    if (!inMenu && now - lastEnd < 350) e.preventDefault();
    lastEnd = now;
  }, opt);
})();

(function () {
  var FINAL = 10, W = 360, H = 640, GROUND = 592, ESC_Y = 50, PX = 312, PY_MIN = 62, PY_MAX = 540, TI = 0, SC = 1, DPR = 1, HUD_H = 44;
  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');
  var stage = document.getElementById('stage');
  var probe = document.getElementById('probe');
  var FONT = "'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif";
  var BC = ['#ff5d73', '#ffd23f', '#3ddc97', '#5aa9ff'];

  var hiN = 0, hiE = 0, easy = false;
  try { hiN = +localStorage.getItem('ponpoko-hi') || 0; } catch (e) {}
  try { hiE = +localStorage.getItem('ponpoko-hi-easy') || 0; } catch (e) {}
  try { easy = localStorage.getItem('ponpoko-mode') === 'easy'; } catch (e) {}
  var hi = easy ? hiE : hiN;
  var guideOn = false;
  try { guideOn = localStorage.getItem('ponpoko-guide') === '1'; } catch (e) {}

  var paused = false, endT = 0, boomT = 0;
  var state = 'title', g = null, frame = 0, overT = 0, soundOn = true;
  var keys = { up: false, down: false, fireKey: false };
  var firePtrs = {}, dragId = null, dragY = 0, dragSv = 0, dragMoved = false, dragFiring = false;
  var fireCount = 0, fireQ = 0, bombQueued = false, sv = 0.5;

  /* ---------- layout ---------- */
  function layout() {
    var cw = stage.clientWidth || 360, ch = stage.clientHeight || 640;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    SC = cw / W;
    H = ch / SC;
    cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
    ctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0);
    TI = (probe.offsetHeight || 0) / SC;
    GROUND = H - 48;
    ESC_Y = TI + HUD_H + 24;
    PY_MIN = TI + HUD_H + 68;
    PY_MAX = GROUND - 30;
    setThumb();
  }

  /* ---------- sound ---------- */
  var SFX_GAIN = 2.4;
  var ac = null;
  function audioCtx() {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) {}
    return ac;
  }

  /* ---- BGM（ユーザー提供の音源。プレイ中だけループ再生、一時停止で止まり続きから再開） ---- */
  var BGM_VOL = 0.24;
  var bgm = { buf: null, loading: false, failed: false, src: null, gain: null, t0: 0, off: 0 };
  function loadBgm() {
    if (bgm.buf || bgm.loading || bgm.failed) return;
    var a = audioCtx();
    if (!a) return;
    bgm.loading = true;
    try {
      var raw = atob(document.getElementById('bgmB64').textContent.replace(/\s+/g, ''));
      var u8 = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
      a.decodeAudioData(u8.buffer, function (b) { bgm.buf = b; bgm.loading = false; }, function () { bgm.loading = false; bgm.failed = true; });
    } catch (e) { bgm.loading = false; bgm.failed = true; }
  }
  /* ---- ゲームオーバーの曲（ワンショット） ---- */
  var jingle = { buf: null, loading: false, failed: false };
  function decodeB64(id, done, fail) {
    var a = audioCtx();
    if (!a) { fail(); return; }
    try {
      var raw = atob(document.getElementById(id).textContent.replace(/\s+/g, ''));
      var u8 = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
      a.decodeAudioData(u8.buffer, done, fail);
    } catch (e) { fail(); }
  }
  function loadJingle() {
    if (jingle.buf || jingle.loading || jingle.failed) return;
    jingle.loading = true;
    decodeB64('overB64', function (b) { jingle.buf = b; jingle.loading = false; }, function () { jingle.loading = false; jingle.failed = true; });
  }
  function playJingle() {
    if (!soundOn || !jingle.buf) return;
    var a = audioCtx();
    if (!a) return;
    try {
      var s = a.createBufferSource(), gn = a.createGain();
      s.buffer = jingle.buf; gn.gain.value = 0.75;
      s.connect(gn); gn.connect(a.destination); s.start(0);
    } catch (e) {}
  }
  function startBgm() {
    var a = audioCtx();
    if (!a || !bgm.buf) return;
    var s = a.createBufferSource();
    s.buffer = bgm.buf; s.loop = true;
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.linearRampToValueAtTime(BGM_VOL, a.currentTime + 0.4);
    s.connect(g); g.connect(a.destination);
    s.start(0, bgm.off % bgm.buf.duration);
    bgm.src = s; bgm.gain = g; bgm.t0 = a.currentTime - bgm.off;
  }
  function stopBgm(keepPos) {
    if (!bgm.src) return;
    var a = ac, now = a.currentTime;
    bgm.off = keepPos && bgm.buf ? (now - bgm.t0) % bgm.buf.duration : 0;
    try {
      bgm.gain.gain.cancelScheduledValues(now);
      bgm.gain.gain.setTargetAtTime(0.0001, now, 0.08);
      bgm.src.stop(now + 0.45);
    } catch (e) {}
    bgm.src = null; bgm.gain = null;
  }
  function syncBgm() {
    var want = state === 'play' && !(g && g.phase === 'over') && !paused && soundOn && !bgm.failed;
    if (want && !bgm.src) {
      if (!bgm.buf) { loadBgm(); return; }
      startBgm();
    } else if (!want && bgm.src) {
      stopBgm(state === 'play' && !(g && g.phase === 'over'));
    }
  }
  function beep(f1, f2, dur, type, vol) {
    if (!soundOn) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      var o = ac.createOscillator(), gn = ac.createGain(), t = ac.currentTime;
      o.type = type || 'square';
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
      gn.gain.setValueAtTime(Math.min(0.3, (vol || 0.04) * SFX_GAIN), t);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn); gn.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }

  /* ---------- game setup ---------- */
  function newGame() {
    g = { score: 0, lives: 5, stage: 0, py: (PY_MIN + PY_MAX) / 2, cool: 0, uid: 0,
      acorns: [], onigiri: [], crows: [], parts: [], pops: [], rings: [], eb: [], invT: 0, hurt: 0, fall: null, downT: 0, ammo: 16, bag: null, dryF: -999,
      onigiriLeft: 3, mode: 'down', quota: 0, spawned: 0, spawnT: 0,
      phase: 'intro', phaseT: 0, bonus: 0 };
    sv = 0.5; setThumb();
  }
  function startStage(n) {
    g.stage = n;
    g.mode = n % 2 === 1 ? 'down' : 'up';
    g.quota = Math.min(6 + 2 * n, 24);
    g.spawned = 0;
    g.spawnT = 40;
    g.crows = []; g.acorns = []; g.onigiri = []; g.eb = [];
    g.phase = 'intro'; g.phaseT = 110;
  }
  function saveHi() {
    if (g && g.score > hi) {
      hi = g.score; if (easy) hiE = hi; else hiN = hi;
      try { localStorage.setItem(easy ? 'ponpoko-hi-easy' : 'ponpoko-hi', String(hi)); } catch (e) {}
    }
  }
  function finishGame() {
    saveHi();
    g.phase = 'end'; g.crows = []; g.eb = [];
    state = 'ending'; endT = 70; boomT = 0;
    beep(520, 1040, 0.5, 'triangle', 0.06);
  }
  function startGame(mode) {
    lockPortrait();
    if (mode) { easy = mode === 'easy'; try { localStorage.setItem('ponpoko-mode', mode); } catch (e) {} }
    hi = easy ? hiE : hiN;
    bgm.off = 0; loadBgm(); loadJingle();
    paused = false; resetInputs();
    state = 'play';

  function setPaused(p) {
    if (p && state !== 'play') return;
    paused = p;
    resetInputs();
    pauseMenu.hidden = !p;
    if (p) pauseMode.textContent = easy ? 'やさしいモード' : 'ふつうモード';
    acc = 0;
  }
  function toTitle() {
    saveHi();
    paused = false; pauseMenu.hidden = true;
    resetInputs();
    state = 'title'; bgm.off = 0;
  }
  function tryStart(fromKey) {
    if (paused) return true;
    if (state === 'ending' && endT <= 0) { toTitle(); return true; }
    if (state === 'ending') return true;
    if (state === 'title') { if (fromKey) startGame(); return true; }
    if (state === 'over' && overT <= 0) { startGame(); return true; }
    return false;
  }
  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (paused && (k === ' ' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'x' || k === 'X')) { e.preventDefault(); return; }
    if (k === 'ArrowUp' || k === 'w' || k === 'W') { keys.up = true; e.preventDefault(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { keys.down = true; e.preventDefault(); }
    else if (k === ' ' || k === 'z' || k === 'Z') { e.preventDefault(); if (!tryStart(true)) keys.fireKey = true; }
    else if (k === 'x' || k === 'X') { e.preventDefault(); if (!tryStart(true)) bombQueued = true; }
    else if (k === 'Enter') { tryStart(true); }
    else if (k === 'Escape' || k === 'p' || k === 'P') { if (paused) setPaused(false); else setPaused(true); }
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.up = false;
    else if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = false;
    else if (k === ' ' || k === 'z' || k === 'Z') keys.fireKey = false;
  });
  window.addEventListener('blur', function () { keys.up = keys.down = keys.fireKey = false; fireCount = 0; });

  firePtrs = {};
  function fireUp(e) {
    if (firePtrs[e.pointerId]) { delete firePtrs[e.pointerId]; fireCount = Math.max(0, fireCount - 1); }
  }
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    if (tryStart()) return;
    if (!firePtrs[e.pointerId]) { firePtrs[e.pointerId] = 1; fireCount++; }
    fireQ = 8;
  });
  cv.addEventListener('pointerup', fireUp);
  cv.addEventListener('pointercancel', fireUp);
  cv.addEventListener('lostpointercapture', fireUp);
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* スライダー: タップで発射、12px以上ドラッグすると相対移動（指を置いた位置へジャンプしない） */
  dragId = null; dragY = 0; dragSv = 0; dragMoved = false; dragFiring = false;
  function stopSliderFire() {
    if (dragFiring) { dragFiring = false; fireCount = Math.max(0, fireCount - 1); }
  }
  slider.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var started = tryStart();
    dragId = e.pointerId; dragY = e.clientY; dragSv = sv; dragMoved = false;
    try { slider.setPointerCapture(e.pointerId); } catch (err) {}
    if (!started) { dragFiring = true; fireCount++; fireQ = 8; }
  });
  slider.addEventListener('pointermove', function (e) {
    if (dragId !== e.pointerId) return;
    var dy = e.clientY - dragY;
    if (!dragMoved && Math.abs(dy) > 12) { dragMoved = true; stopSliderFire(); }
    if (dragMoved) {
      var span = Math.max(1, slider.getBoundingClientRect().height - 52);
      var adj = dy > 0 ? dy - 12 : dy + 12;
      sv = Math.max(0, Math.min(1, dragSv + adj / span));
      setThumb();
    }
  });
  function sliderUp(e) { if (dragId === e.pointerId) { dragId = null; stopSliderFire(); } }
  slider.addEventListener('pointerup', sliderUp);
  slider.addEventListener('pointercancel', sliderUp);
  slider.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  bombBtn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    bombBtn.classList.add('hot');
    if (!tryStart()) bombQueued = true;
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) {
    bombBtn.addEventListener(n, function () { bombBtn.classList.remove('hot'); });
  });
  bombBtn.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  document.getElementById('easyBtn').addEventListener('click', function () { if (state === 'title') startGame('easy'); });
  document.getElementById('normalBtn').addEventListener('click', function () { if (state === 'title') startGame('normal'); });
  pauseBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  pauseBtn.addEventListener('click', function () { setPaused(true); });
  document.getElementById('resumeBtn').addEventListener('click', function () { setPaused(false); });
  document.getElementById('titleBtn').addEventListener('click', toTitle);
  pauseMenu.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  try {
    var land = window.matchMedia('(orientation: landscape) and (pointer: coarse) and (max-height: 600px)');
    var onLand = function () { if (land.matches) setPaused(true); };
    if (land.addEventListener) land.addEventListener('change', onLand); else if (land.addListener) land.addListener(onLand);
  } catch (e) {}
  function lockPortrait() {
    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(function () {}); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) setPaused(true); });
  var muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  muteBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    muteBtn.textContent = soundOn ? 'おと ON' : 'おと OFF';
    muteBtn.setAttribute('aria-pressed', soundOn ? 'false' : 'true');
  });

  var guideBtn = document.getElementById('guide');
  function syncGuide() {
    guideBtn.textContent = guideOn ? 'ガイド ON' : 'ガイド OFF';
    guideBtn.setAttribute('aria-pressed', guideOn ? 'true' : 'false');
  }
  guideBtn.addEventListener('click', function () {
    guideOn = !guideOn;
    try { localStorage.setItem('ponpoko-guide', guideOn ? '1' : '0'); } catch (e) {}
    syncGuide();
  });
  syncGuide();

  window.addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
  layout();
  if (document.fonts && document.fonts.load) { document.fonts.load('16px DotGothic16').catch(function () {}); }
  requestAnimationFrame(loop);
})();
</script>

</body></html>
