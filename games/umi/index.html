<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival Battle - Seamless Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; -webkit-user-select: none; }
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .id-display { font-size: 60px; color: gold; font-weight: bold; }
        
        /* PCビュー */
        #pc-view { display: none; text-align: center; width: 100vw; height: 100vh; }
        canvas { background: #111; border: 4px solid #333; margin-top: 10px; }
        .hp-bar { display: flex; justify-content: space-around; font-size: 30px; font-weight: bold; padding: 15px; }

        /* スマホコントローラー */
        #mobile-view { display: none; height: 100vh; background: #222; position: relative; }
        .ctrl-area { position: absolute; bottom: 40px; width: 100%; height: 260px; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; }
        
        .btn { background: #444; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 6px #222; border: 2px solid #555; }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px #222; background: #666; }
        
        .btn-move { width: 90px; height: 90px; font-size: 30px; border-radius: 15px; }
        .action-group { position: relative; width: 220px; height: 220px; }
        .pos-top    { position: absolute; top: 0;   left: 70px;  width: 80px; height: 80px; background: #2e91ff; }
        .pos-left   { position: absolute; top: 70px; left: 0;    width: 80px; height: 80px; background: #8e44ad; }
        .pos-right  { position: absolute; top: 70px; right: 0;   width: 80px; height: 80px; background: #ff4757; }

        .win-msg { font-size: 80px; color: gold; text-shadow: 0 0 20px gold; margin-bottom: 20px; }
        button { cursor: pointer; }
    </style>
</head>
<body>

<div id="setup-screen" class="overlay">
    <div id="host-setup">
        <h1>SERVER ID</h1>
        <div class="id-display" id="my-id-display">----</div>
        <p id="conn-count" style="color:#2ecc71; font-weight:bold;">接続済み: 0台</p>
        <button onclick="startGame()" style="padding:15px 40px; background:#2ecc71; color:white; border:none; border-radius:10px; font-size:24px; font-weight:bold;">GAME START</button>
        <button onclick="initStage()" style="padding:10px 20px; background:#444; color:white; border:none; border-radius:10px; margin-left:10px;">SHUFFLE</button>
    </div>
    <div id="client-setup" style="margin-top: 40px; text-align: center;">
        <input type="number" id="peer-id-input" placeholder="4桁IDを入力" style="padding:15px; font-size:24px; width:180px; border-radius:10px; border:none;">
        <br><br>
        <button onclick="connectToPC()" style="padding:15px 30px; background:#2e91ff; color:white; border:none; border-radius:10px; font-size:20px;">CONNECT</button>
    </div>
</div>

<div id="finish-ui" class="overlay" style="display:none;">
    <div class="win-msg" id="winner-text">P1 WIN!</div>
    <button onclick="rematch()" style="padding:20px 60px; background:#2ecc71; color:white; border:none; border-radius:10px; font-size:28px; font-weight:bold; box-shadow: 0 5px #27ae60;">REMATCH</button>
    <button onclick="initStage()" style="margin-top:20px; background:none; border:none; color:#888; text-decoration:underline;">ステージを再生成</button>
</div>

<div id="pc-view">
    <div class="hp-bar">
        <span style="color:#ff4757">P1: <span id="p1hp">100</span></span>
        <span style="color:#2e91ff">P2: <span id="p2hp">100</span></span>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<div id="mobile-view">
    <div style="padding: 20px; color: #888; text-align: center;">CONNECTED AS CONTROLLER</div>
    <div class="ctrl-area">
        <div style="display:flex; gap:15px; align-items:flex-end;">
            <div class="btn btn-move" id="btn-left">◀</div>
            <div class="btn btn-move" id="btn-right">▶</div>
        </div>
        <div class="action-group">
            <div class="btn pos-top" id="btn-jump">JUMP</div>
            <div class="btn pos-left" id="btn-dash">DASH</div>
            <div class="btn pos-right" id="btn-fire">FIRE</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = 1000; canvas.height = 600;

const shortId = Math.floor(1000 + Math.random() * 9000).toString();
const peer = new Peer(shortId);
let connections = [];
let role = "";
let gameActive = false;

peer.on('open', id => document.getElementById('my-id-display').innerText = id);

// --- ホスト(PC) ---
peer.on('connection', conn => {
    if (connections.length >= 2) return; // 2台まで
    connections.push(conn);
    document.getElementById('conn-count').innerText = `接続済み: ${connections.length}台`;
    const pIdx = connections.length - 1;
    conn.on('data', data => { if(data.type === 'input') handleInput(pIdx, data); });
});

function startGame() {
    if (connections.length === 0) return;
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('pc-view').style.display = 'block';
    gameActive = true;
    initStage();
    loop();
}

function rematch() {
    document.getElementById('finish-ui').style.display = 'none';
    gameActive = true;
    initStage();
    // loopは既に動いているので呼ぶ必要なし
}

// --- クライアント(スマホ) ---
function connectToPC() {
    const targetId = document.getElementById('peer-id-input').value;
    const myConn = peer.connect(targetId);
    myConn.on('open', () => {
        role = "client";
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('mobile-view').style.display = 'block';
        setInterval(() => {
            myConn.send({ type: 'input', ...currentInput, fire: fireTrigger });
            fireTrigger = false;
        }, 30);
    });
}

// --- ゲームロジック ---
const gravity = 0.8;
let platforms = [], walls = [], healZone = null;
const players = [];

function Player(color, x) {
    this.x = x; this.y = 400; this.w = 40; this.h = 60; this.color = color;
    this.vx = 0; this.vy = 0; this.hp = 100; this.side = 1; this.isJumping = false;
    this.bullets = [];
    this.update = function() {
        this.vy += gravity; this.x += this.vx; this.y += this.vy;
        if (this.y + this.h > 580) { this.y = 580 - this.h; this.vy = 0; this.isJumping = false; }
        platforms.forEach(p => {
            if (this.vy > 0 && this.x + this.w > p.x && this.x < p.x + p.w && this.y + this.h > p.y && this.y + this.h < p.y + p.h + this.vy) {
                this.y = p.y - this.h; this.vy = 0; this.isJumping = false;
            }
        });
        this.bullets.forEach((b, i) => {
            b.x += b.vx;
            if (b.x < 0 || b.x > 1000) this.bullets.splice(i, 1);
        });
    };
}

function initStage() {
    players[0] = new Player("#ff4757", 100);
    players[1] = new Player("#2e91ff", 860);
    platforms = [];
    for (let i = 0; i < 5; i++) platforms.push({x: 100+Math.random()*600, y: 200+Math.random()*250, w: 200, h: 15});
    healZone = {x: 400, y: 100, w: 200, h: 15};
}

function handleInput(pIdx, data) {
    const p = players[pIdx]; if(!p || !gameActive) return;
    const speed = data.dash ? 11 : 6;
    if (data.left) { p.vx = -speed; p.side = -1; }
    else if (data.right) { p.vx = speed; p.side = 1; }
    else { p.vx *= 0.8; }
    if (data.jump && !p.isJumping) { p.vy = -17; p.isJumping = true; }
    if (data.fire) p.bullets.push({x: p.x + (p.side === 1 ? p.w : 0), y: p.y + 25, vx: p.side * 16});
}

// --- スマホ操作 ---
let currentInput = { left: false, right: false, dash: false, jump: false };
let fireTrigger = false;
const bind = (id, key) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if(key === 'fire') { fireTrigger = true; if(navigator.vibrate) navigator.vibrate(20); }
        else currentInput[key] = true;
    });
    el.addEventListener('touchend', (e) => { e.preventDefault(); if(key !== 'fire') currentInput[key] = false; });
};
bind('btn-left', 'left'); bind('btn-right', 'right');
bind('btn-jump', 'jump'); bind('btn-dash', 'dash'); bind('btn-fire', 'fire');

function loop() {
    if(!gameActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 背景描画
    ctx.fillStyle = "#444"; platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
    ctx.fillStyle = "#333"; ctx.fillRect(0, 580, 1000, 20);
    
    players.forEach((p, idx) => {
        p.update();
        const enemy = players[idx === 0 ? 1 : 0];
        p.bullets.forEach((b, bi) => {
            if (b.x > enemy.x && b.x < enemy.x + enemy.w && b.y > enemy.y && b.y < enemy.y + enemy.h) {
                enemy.hp -= 10; p.bullets.splice(bi, 1);
            }
        });
        
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "white"; ctx.fillRect(p.side === 1 ? p.x + p.w - 12 : p.x, p.y + 10, 12, 12);
        ctx.fillStyle = "yellow"; p.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });

        if (p.hp <= 0 && gameActive) {
            gameActive = false;
            document.getElementById('winner-text').innerText = (idx === 0 ? "PLAYER 2" : "PLAYER 1") + " WIN!";
            document.getElementById('finish-ui').style.display = 'flex';
        }
    });
    
    document.getElementById('p1hp').innerText = players[0].hp;
    document.getElementById('p2hp').innerText = players[1].hp;
    requestAnimationFrame(loop);
}
initStage();
</script>
</body>
</html>
