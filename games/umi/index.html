<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Survival Battle - Landscape Perfect</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* 画面全体の固定 */
        body { 
            margin: 0; 
            background: #111; 
            color: white; 
            font-family: sans-serif; 
            overflow: hidden; 
            position: fixed; 
            width: 100%; 
            height: 100%; 
            touch-action: none; 
            -webkit-user-select: none; 
        }

        /* 接続・リザルト画面 */
        .overlay { 
            position: absolute; 
            inset: 0; 
            background: rgba(0,0,0,0.9); 
            z-index: 200; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(5px); 
        }

        /* PC用キャンバス表示 */
        #pc-view { display: none; text-align: center; width: 100vw; height: 100vh; }
        canvas { background: #000; border: 2px solid #333; max-width: 95vw; max-height: 75vh; }

        /* スマホ用コントローラー（横画面特化） */
        #mobile-view { 
            display: none; 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            background: #1a1a1a; 
        }

        /* 左側：移動ボタン（画面左下に固定） */
        .left-pad {
            position: absolute;
            bottom: 8vh; /* 画面下から8%の位置 */
            left: 5vw;   /* 画面左から5%の位置 */
            display: flex;
            gap: 4vw;
        }

        /* 右側：アクションボタン（画面右下に固定） */
        .right-pad {
            position: absolute;
            bottom: 5vh;
            right: 5vw;
            width: 42vh; /* 高さを基準にサイズを決定 */
            height: 42vh;
        }

        /* 共通ボタンデザイン */
        .btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 4px rgba(0,0,0,0.5);
            touch-action: none;
        }
        .btn:active { background: rgba(255,255,255,0.4); transform: scale(0.9); box-shadow: none; }

        .btn-move { width: 16vh; height: 16vh; border-radius: 20%; font-size: 6vh; }

        /* 十字配置の絶対位置 */
        .btn-action { position: absolute; width: 14vh; height: 14vh; border-radius: 50%; font-size: 2.5vh; }
        .pos-top    { top: 0; left: 14vh; background: rgba(46, 145, 255, 0.4); }
        .pos-left   { top: 14vh; left: 0; background: rgba(142, 68, 173, 0.4); }
        .pos-right  { top: 14vh; right: 0; background: rgba(255, 71, 87, 0.4); }

        .status-bar { position: absolute; top: 5px; width: 100%; text-align: center; color: #666; font-size: 10px; }
    </style>
</head>
<body>

<div id="setup-screen" class="overlay">
    <div id="host-setup">
        <h2 style="margin:0; color:gold;">SERVER ID</h2>
        <div style="font-size:50px; font-weight:bold;" id="my-id-display">----</div>
        <p id="conn-count">接続済み: 0台</p>
        <button onclick="startGame()" style="padding:15px 40px; background:#2ecc71; color:white; border:none; border-radius:8px; font-size:20px;">GAME START</button>
    </div>
    <div style="margin-top: 20px;">
        <input type="number" id="peer-id-input" placeholder="ID" style="padding:10px; width:80px; font-size:18px;">
        <button onclick="connectToPC()" style="padding:10px 20px; background:#2e91ff; color:white; border:none; border-radius:8px;">CONNECT</button>
    </div>
</div>

<div id="finish-ui" class="overlay" style="display:none;">
    <div id="winner-text" style="font-size:50px; color:gold; margin-bottom:20px;">WINNER!</div>
    <button onclick="rematch()" style="padding:15px 50px; background:#2ecc71; color:white; border:none; border-radius:8px; font-size:22px;">REMATCH</button>
</div>

<div id="pc-view">
    <div style="padding:10px; font-size:24px; font-weight:bold;">
        <span style="color:#ff4757">P1: <span id="p1hp">100</span></span> | 
        <span style="color:#2e91ff">P2: <span id="p2hp">100</span></span>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<div id="mobile-view">
    <div class="status-bar">CONTROLLER CONNECTED - LANDSCAPE MODE</div>
    <div class="left-pad">
        <div class="btn btn-move" id="btn-left">◀</div>
        <div class="btn btn-move" id="btn-right">▶</div>
    </div>
    <div class="right-pad">
        <div class="btn btn-action pos-top" id="btn-jump">JUMP</div>
        <div class="btn btn-action pos-left" id="btn-dash">DASH</div>
        <div class="btn btn-action pos-right" id="btn-fire">FIRE</div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = 1000; canvas.height = 600;

const shortId = Math.floor(1000 + Math.random() * 9000).toString();
const peer = new Peer(shortId);
let connections = [];
let gameActive = false;
let players = [];

peer.on('open', id => document.getElementById('my-id-display').innerText = id);

peer.on('connection', conn => {
    connections.push(conn);
    document.getElementById('conn-count').innerText = `接続済み: ${connections.length}台`;
    conn.on('data', data => { if(data.type === 'input') handleInput(connections.indexOf(conn), data); });
});

function startGame() {
    if (connections.length === 0) return;
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('pc-view').style.display = 'block';
    gameActive = true;
    initStage();
    loop();
}

function rematch() {
    document.getElementById('finish-ui').style.display = 'none';
    gameActive = true;
    initStage();
}

function connectToPC() {
    const targetId = document.getElementById('peer-id-input').value;
    const myConn = peer.connect(targetId);
    myConn.on('open', () => {
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('mobile-view').style.display = 'block';
        setInterval(() => {
            myConn.send({ type: 'input', ...currentInput, fire: fireTrigger });
            fireTrigger = false;
        }, 30);
    });
}

// --- ゲームロジック ---
function Player(color, x) {
    this.x = x; this.y = 400; this.w = 40; this.h = 60; this.color = color;
    this.vx = 0; this.vy = 0; this.hp = 100; this.side = 1; this.bullets = [];
    this.update = function() {
        this.vy += 0.8; this.x += this.vx; this.y += this.vy;
        if (this.y + this.h > 580) { this.y = 580 - this.h; this.vy = 0; this.isJumping = false; }
        this.bullets.forEach((b, i) => { b.x += b.vx; if (b.x < 0 || b.x > 1000) this.bullets.splice(i, 1); });
    };
}

function initStage() {
    players = [new Player("#ff4757", 100), new Player("#2e91ff", 860)];
}

function handleInput(pIdx, data) {
    const p = players[pIdx]; if(!p || !gameActive) return;
    const speed = data.dash ? 12 : 7;
    if (data.left) { p.vx = -speed; p.side = -1; }
    else if (data.right) { p.vx = speed; p.side = 1; }
    else { p.vx *= 0.8; }
    if (data.jump && !p.isJumping) { p.vy = -17; p.isJumping = true; }
    if (data.fire) p.bullets.push({x: p.x + (p.side === 1 ? p.w : 0), y: p.y + 25, vx: p.side * 18});
}

// --- 操作入力 ---
let currentInput = { left: false, right: false, dash: false, jump: false };
let fireTrigger = false;
const bind = (id, key) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if(key === 'fire') { fireTrigger = true; if(navigator.vibrate) navigator.vibrate(20); }
        else currentInput[key] = true;
    });
    el.addEventListener('touchend', (e) => { e.preventDefault(); currentInput[key] = false; });
};
bind('btn-left', 'left'); bind('btn-right', 'right');
bind('btn-jump', 'jump'); bind('btn-dash', 'dash'); bind('btn-fire', 'fire');

function loop() {
    if(!gameActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#333"; ctx.fillRect(0, 580, 1000, 20);
    
    players.forEach((p, idx) => {
        p.update();
        const enemy = players[idx === 0 ? 1 : 0];
        p.bullets.forEach((b, bi) => {
            if (b.x > enemy.x && b.x < enemy.x + enemy.w && b.y > enemy.y && b.y < enemy.y + enemy.h) {
                enemy.hp -= 10; p.bullets.splice(bi, 1);
            }
        });
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "yellow"; p.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });

        if (p.hp <= 0 && gameActive) {
            gameActive = false;
            document.getElementById('winner-text').innerText = (idx === 0 ? "P2" : "P1") + " WIN!";
            document.getElementById('finish-ui').style.display = 'flex';
        }
    });
    document.getElementById('p1hp').innerText = players[0].hp;
    document.getElementById('p2hp').innerText = players[1].hp;
    requestAnimationFrame(loop);
}
initStage();
</script>
</body>
</html>
