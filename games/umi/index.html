<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Survival Battle - Central Pad Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; position: fixed; width: 100vw; height: 100vh; touch-action: none; -webkit-user-select: none; }
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        
        /* PC画面 */
        #pc-view { display: none; text-align: center; width: 100vw; height: 100vh; }
        canvas { background: #111; border: 4px solid #333; max-width: 95vw; max-height: 70vh; margin-top: 10px; }
        .hp-bar { display: flex; justify-content: space-around; font-size: 24px; font-weight: bold; padding: 10px; }

        /* スマホ・コントローラー（中央配置） */
        #mobile-view { display: none; width: 100vw; height: 100vh; background: #111; position: relative; }
        
        /* 左：移動（垂直方向中央） */
        .left-pad {
            position: absolute;
            top: 55%; 
            left: 8vw;
            transform: translateY(-50%);
            display: flex;
            gap: 20px;
        }

        /* 右：アクション（垂直方向中央・十字） */
        .right-pad {
            position: absolute;
            top: 55%;
            right: 8vw;
            transform: translateY(-50%);
            width: 40vh;
            height: 40vh;
        }

        .btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 2px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
            touch-action: none;
        }
        .btn:active { background: rgba(255,255,255,0.4); transform: scale(0.9); }
        .btn-move { width: 15vh; height: 15vh; font-size: 5vh; border-radius: 20%; }
        
        .btn-action { position: absolute; width: 13vh; height: 13vh; font-size: 2.5vh; }
        .pos-top    { top: 0; left: 13.5vh; background: rgba(46, 145, 255, 0.4); border-color: #2e91ff; }
        .pos-left   { top: 13.5vh; left: 0; background: rgba(142, 68, 173, 0.4); border-color: #8e44ad; }
        .pos-right  { top: 13.5vh; right: 0; background: rgba(255, 71, 87, 0.4); border-color: #ff4757; }
    </style>
</head>
<body>

<div id="setup-screen" class="overlay">
    <h1 id="main-title" style="color:gold;">SURVIVAL ONLINE</h1>
    <div id="host-setup">
        <div style="font-size:50px; font-weight:bold; margin:10px;" id="my-id-display">----</div>
        <p id="conn-count">接続待ち...</p>
        <button onclick="startGame()" style="padding:15px 50px; background:#2ecc71; color:white; border:none; border-radius:10px; font-size:24px; font-weight:bold;">GAME START</button>
    </div>
    <div style="margin-top:30px;">
        <input type="number" id="peer-id-input" placeholder="ID" style="padding:15px; width:100px; font-size:20px; border-radius:10px;">
        <button onclick="connectToPC()" style="padding:15px 30px; background:#2e91ff; color:white; border:none; border-radius:10px; font-size:20px;">CONNECT</button>
    </div>
</div>

<div id="finish-ui" class="overlay" style="display:none;">
    <div id="winner-text" style="font-size:60px; color:gold; margin-bottom:20px;">WINNER!</div>
    <button onclick="rematch()" style="padding:20px 60px; background:#2ecc71; color:white; border:none; border-radius:10px; font-size:28px; font-weight:bold;">REMATCH</button>
</div>

<div id="pc-view">
    <div class="hp-bar">
        <span style="color:#ff4757">P1: <span id="p1hp">100</span></span>
        <span style="color:#2e91ff">P2: <span id="p2hp">100</span></span>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<div id="mobile-view">
    <div class="left-pad">
        <div class="btn btn-move" id="btn-left">◀</div>
        <div class="btn btn-move" id="btn-right">▶</div>
    </div>
    <div class="right-pad">
        <div class="btn btn-action pos-top" id="btn-jump">JUMP</div>
        <div class="btn btn-action pos-left" id="btn-dash">DASH</div>
        <div class="btn btn-action pos-right" id="btn-fire">FIRE</div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = 1000; canvas.height = 600;

const shortId = Math.floor(1000 + Math.random() * 9000).toString();
const peer = new Peer(shortId);
let connections = [];
let gameActive = false;
let platforms = [], walls = [], healZone = null, players = [];

peer.on('open', id => document.getElementById('my-id-display').innerText = id);
peer.on('connection', conn => {
    connections.push(conn);
    document.getElementById('conn-count').innerText = `接続済み: ${connections.length}台`;
    conn.on('data', data => { if(data.type === 'input') handleInput(connections.indexOf(conn), data); });
});

function startGame() {
    if (connections.length === 0) return;
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('pc-view').style.display = 'block';
    gameActive = true;
    initStage();
    loop();
}

function rematch() {
    document.getElementById('finish-ui').style.display = 'none';
    gameActive = true;
    initStage();
}

function connectToPC() {
    const targetId = document.getElementById('peer-id-input').value;
    const myConn = peer.connect(targetId);
    myConn.on('open', () => {
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('mobile-view').style.display = 'block';
        setInterval(() => {
            myConn.send({ type: 'input', ...currentInput, fire: fireTrigger });
            fireTrigger = false;
        }, 30);
    });
}

// --- ゲームエンジン ---
function Player(color, x) {
    this.x = x; this.y = 400; this.w = 40; this.h = 60; this.color = color;
    this.vx = 0; this.vy = 0; this.hp = 100; this.side = 1; this.isJumping = false;
    this.bullets = [];
    this.update = function() {
        this.vy += 0.8; // 重力
        this.x += this.vx; this.y += this.vy;

        // 床
        if (this.y + this.h > 580) { this.y = 580 - this.h; this.vy = 0; this.isJumping = false; }
        
        // 足場判定
        platforms.forEach(p => {
            if (this.vy > 0 && this.x + this.w > p.x && this.x < p.x + p.w && this.y + this.h > p.y && this.y + this.h < p.y + p.h + this.vy) {
                this.y = p.y - this.h; this.vy = 0; this.isJumping = false;
            }
        });

        // 壁判定
        walls.forEach(w => {
            if (this.x + this.w > w.x && this.x < w.x + w.w && this.y + this.h > w.y && this.y < w.y + w.h) {
                if (this.vx > 0 && this.x < w.x) this.x = w.x - this.w;
                else if (this.vx < 0 && this.x + this.w > w.x + w.w) this.x = w.x + w.w;
            }
        });

        // 回復
        if (healZone && this.x + this.w > healZone.x && this.x < healZone.x + healZone.w && this.y + this.h > healZone.y && this.y < healZone.y + healZone.h) {
            if (Date.now() % 1000 < 30) this.hp = Math.min(100, this.hp + 1);
        }

        this.bullets.forEach((b, i) => {
            b.x += b.vx;
            if (b.x < 0 || b.x > 1000) this.bullets.splice(i, 1);
        });
    };
}

function initStage() {
    players = [new Player("#ff4757", 100), new Player("#2e91ff", 860)];
    platforms = []; walls = [];
    for (let i = 0; i < 5; i++) platforms.push({x: 100+Math.random()*600, y: 200+Math.random()*250, w: 200, h: 15});
    for (let i = 0; i < 2; i++) walls.push({x: 300+Math.random()*400, y: 150+Math.random()*300, w: 40, h: 120});
    healZone = {x: 400, y: 100, w: 200, h: 15};
}

function handleInput(pIdx, data) {
    const p = players[pIdx]; if(!p || !gameActive) return;
    const speed = data.dash ? 12 : 7;
    if (data.left) { p.vx = -speed; p.side = -1; }
    else if (data.right) { p.vx = speed; p.side = 1; }
    else { p.vx *= 0.8; }
    if (data.jump && !p.isJumping) { p.vy = -18; p.isJumping = true; }
    if (data.fire) p.bullets.push({x: p.x + (p.side === 1 ? p.w : 0), y: p.y + 25, vx: p.side * 18});
}

// --- コントローラー入力 ---
let currentInput = { left: false, right: false, dash: false, jump: false };
let fireTrigger = false;
const bind = (id, key) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if(key === 'fire') { fireTrigger = true; if(navigator.vibrate) navigator.vibrate(25); }
        else currentInput[key] = true;
    });
    el.addEventListener('touchend', (e) => { e.preventDefault(); if(key !== 'fire') currentInput[key] = false; });
};
bind('btn-left', 'left'); bind('btn-right', 'right');
bind('btn-jump', 'jump'); bind('btn-dash', 'dash'); bind('btn-fire', 'fire');

function loop() {
    if(!gameActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 背景・ステージ
    ctx.fillStyle = "#444"; platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
    ctx.fillStyle = "#222"; walls.forEach(w => { ctx.fillRect(w.x, w.y, w.w, w.h); ctx.strokeStyle="#555"; ctx.strokeRect(w.x, w.y, w.w, w.h); });
    ctx.fillStyle = "rgba(46, 204, 113, 0.4)"; ctx.fillRect(healZone.x, healZone.y, healZone.w, healZone.h);
    ctx.fillStyle = "#333"; ctx.fillRect(0, 580, 1000, 20);
    
    players.forEach((p, idx) => {
        p.update();
        const enemy = players[idx === 0 ? 1 : 0];
        p.bullets.forEach((b, bi) => {
            if (b.x > enemy.x && b.x < enemy.x + enemy.w && b.y > enemy.y && b.y < enemy.y + enemy.h) {
                enemy.hp -= 10; p.bullets.splice(bi, 1);
            }
        });
        
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "white"; ctx.fillRect(p.side === 1 ? p.x + p.w - 12 : p.x, p.y + 10, 12, 12);
        ctx.fillStyle = "yellow"; p.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });

        if (p.hp <= 0 && gameActive) {
            gameActive = false;
            document.getElementById('winner-text').innerText = (idx === 0 ? "P2" : "P1") + " WIN!";
            document.getElementById('finish-ui').style.display = 'flex';
        }
    });
    
    document.getElementById('p1hp').innerText = Math.max(0, players[0].hp);
    document.getElementById('p2hp').innerText = Math.max(0, players[1].hp);
    requestAnimationFrame(loop);
}
initStage();
</script>
</body>
</html>
