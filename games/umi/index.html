<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival Online - Easy Connect</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; -webkit-user-select: none; }
        
        /* セットアップ画面 */
        #setup-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .id-box { font-size: 40px; color: gold; font-weight: bold; margin: 10px 0; background: #333; padding: 10px 20px; border-radius: 10px; border: 2px dashed #666; }
        input { padding: 15px; font-size: 24px; width: 200px; text-align: center; margin-bottom: 20px; border-radius: 10px; border: none; background: #eee; }
        
        /* キャンバス */
        canvas { background: #111; display: block; width: 100vw; height: 50vh; border-bottom: 2px solid #444; }
        
        /* スマホ用コントローラー */
        .controls { height: 50vh; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 8px; padding: 10px; background: #222; }
        .btn { background: #444; color: white; border-radius: 15px; font-size: 22px; font-weight: bold; display: flex; align-items: center; justify-content: center; active-background: #666; touch-action: none; }
        .btn:active { background: #777; transform: scale(0.95); }
        .btn-fire { background: #ff4757; }
        .btn-jump { background: #2e91ff; }
        .btn-dash { background: #8e44ad; }
    </style>
</head>
<body>

<div id="setup-screen">
    <h2 style="margin:0;">YOUR ID (相手に教えて)</h2>
    <div class="id-box" id="my-id-display">取得中...</div>
    
    <div style="margin-top: 30px;">
        <input type="number" id="peer-id-input" placeholder="相手の4桁ID">
        <br>
        <button id="connect-btn" style="padding:15px 40px; font-size:22px; background:#2ecc71; color:white; border:none; border-radius:10px; font-weight:bold;">CONNECT</button>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<div class="controls">
    <div class="btn" id="btn-left">◀ LEFT</div>
    <div class="btn" id="btn-right">RIGHT ▶</div>
    <div class="btn btn-jump" id="btn-jump">JUMP</div>
    <div class="btn btn-dash" id="btn-dash" style="grid-column: span 2;">DASH</div>
    <div class="btn btn-fire" id="btn-fire">FIRE 🔥</div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = 1000; canvas.height = 600;

// --- 4桁の短いIDを生成してPeerJSを初期化 ---
const shortId = Math.floor(1000 + Math.random() * 9000).toString();
const peer = new Peer(shortId); // 指定したIDで作成を試みる

let conn = null;
let isHost = false;
let myPlayerNum = 0; // 0=P1, 1=P2

peer.on('open', (id) => {
    document.getElementById('my-id-display').innerText = id;
});

// エラー（ID重複など）が発生した場合
peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
        location.reload(); // IDが被ったらリロードして再取得
    }
});

// ホスト側の待受
peer.on('connection', (c) => {
    conn = c;
    isHost = true;
    myPlayerNum = 0;
    initStage();
    setupConnection();
});

// ゲスト側の接続ボタン
document.getElementById('connect-btn').ontouchstart = (e) => {
    e.preventDefault();
    connectToPeer();
};
document.getElementById('connect-btn').onclick = () => connectToPeer(); // PC用

function connectToPeer() {
    const targetId = document.getElementById('peer-id-input').value;
    if(!targetId) return;
    conn = peer.connect(targetId);
    isHost = false;
    myPlayerNum = 1;
    setupConnection();
}

function setupConnection() {
    conn.on('open', () => {
        document.getElementById('setup-screen').style.display = 'none';
        if (isHost) {
            setTimeout(() => {
                conn.send({ type: 'stage', platforms, walls, healZone });
            }, 500);
        }
        loop();
    });

    conn.on('data', (data) => {
        if (data.type === 'stage') {
            platforms = data.platforms;
            walls = data.walls;
            healZone = data.healZone;
        } else if (data.type === 'update') {
            const other = allPlayers[data.pNum];
            other.x = data.x; other.y = data.y;
            other.side = data.side;
            if (data.shoot) other.shoot();
        }
    });
}

// --- ゲーム本体 ---
const gravity = 0.8;
let platforms = [], walls = [], healZone = null;
const allPlayers = [];

class Player {
    constructor(color, x) {
        this.x = x; this.y = 400; this.w = 45; this.h = 65;
        this.color = color; this.vx = 0; this.vy = 0;
        this.side = 1; this.isJumping = false; this.bullets = [];
    }
    update() {
        this.vy += gravity; this.x += this.vx; this.y += this.vy;
        if (this.y + this.h > 580) { this.y = 580 - this.h; this.vy = 0; this.isJumping = false; }
        
        [...platforms, healZone].forEach(obj => {
            if (this.vy > 0 && this.x + this.w > obj.x && this.x < obj.x + obj.w && this.y + this.h > obj.y && this.y + this.h < obj.y + obj.h + this.vy) {
                this.y = obj.y - this.h; this.vy = 0; this.isJumping = false;
            }
        });
        
        this.bullets.forEach((b, i) => {
            b.x += b.vx;
            if (b.x < 0 || b.x > 1000) this.bullets.splice(i, 1);
        });
    }
    shoot() { this.bullets.push({x: this.x + (this.side === 1 ? this.w : 0), y: this.y + 25, vx: this.side * 15}); }
    draw() {
        ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.w, this.h);
        ctx.fillStyle = "white"; ctx.fillRect(this.side === 1 ? this.x + this.w - 12 : this.x, this.y + 10, 12, 12);
        ctx.fillStyle = "yellow"; this.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });
    }
}

allPlayers.push(new Player("#ff4757", 100), new Player("#2e91ff", 850));

function initStage() {
    platforms = []; walls = [];
    for (let i = 0; i < 5; i++) platforms.push({x: 100+Math.random()*600, y: 200+Math.random()*250, w: 200, h: 15});
    healZone = {x: 400, y: 120, w: 200, h: 20};
}

// --- スマホ操作用イベント ---
const input = { left: false, right: false, dash: false };
const bindTouch = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); input[key] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); input[key] = false; });
};
bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-dash', 'dash');

document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
    e.preventDefault();
    const me = allPlayers[myPlayerNum];
    if (!me.isJumping) { me.vy = -17; me.isJumping = true; }
});

document.getElementById('btn-fire').addEventListener('touchstart', (e) => {
    e.preventDefault();
    const me = allPlayers[myPlayerNum];
    me.shoot();
    conn.send({ type: 'update', pNum: myPlayerNum, x: me.x, y: me.y, side: me.side, shoot: true });
});

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // ステージ描画
    ctx.fillStyle = "#444"; platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
    ctx.fillStyle = "rgba(46, 204, 113, 0.5)"; ctx.fillRect(healZone.x, healZone.y, healZone.w, healZone.h);
    ctx.fillStyle = "#333"; ctx.fillRect(0, 580, 1000, 20);

    const me = allPlayers[myPlayerNum];
    let speed = input.dash ? 10 : 6;
    if (input.left) { me.vx = -speed; me.side = -1; }
    else if (input.right) { me.vx = speed; me.side = 1; }
    else { me.vx *= 0.8; }
    
    allPlayers.forEach(p => p.update());
    allPlayers.forEach(p => p.draw());

    // 自分の状態を送信
    if (conn && conn.open) {
        conn.send({ type: 'update', pNum: myPlayerNum, x: me.x, y: me.y, side: me.side, shoot: false });
    }

    requestAnimationFrame(loop);
}
</script>
</body>
</html>
