<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival Battle Online</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #setup-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        canvas { background: #111; display: block; margin: auto; width: 100vw; height: 60vh; border-bottom: 2px solid #333; }
        .controls { height: 40vh; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 10px; background: #222; }
        .btn { background: #444; border: none; color: white; border-radius: 10px; font-size: 24px; display: flex; align-items: center; justify-content: center; user-select: none; }
        .btn:active { background: #666; }
        #shoot-btn { background: #ff4757; grid-column: 3; }
        #jump-btn { background: #2e91ff; grid-column: 3; }
        .peer-info { font-size: 14px; margin-bottom: 20px; color: gold; }
        input { padding: 10px; font-size: 18px; width: 80%; margin-bottom: 10px; border-radius: 5px; border: none; }
    </style>
</head>
<body>

<div id="setup-screen">
    <h1>Survival Online</h1>
    <div class="peer-info" id="my-id-display">Connecting to network...</div>
    <input type="text" id="peer-id-input" placeholder="相手のIDを入力">
    <button onclick="connectToPeer()" style="padding:10px 20px; font-size:20px; background:#2ecc71; color:white; border:none; border-radius:5px;">CONNECT (ゲスト側)</button>
    <p style="font-size:12px; margin-top:20px;">※ホスト側はIDを教えて待ちます</p>
</div>

<div style="position:absolute; top:10px; width:100%; display:flex; justify-content:space-around; pointer-events:none;">
    <div style="color:#ff4757">P1: <span id="p1hp">100</span></div>
    <div style="color:#2e91ff">P2: <span id="p2hp">100</span></div>
</div>

<canvas id="gameCanvas"></canvas>

<div class="controls">
    <div class="btn" id="left-btn">◀</div>
    <div class="btn" id="right-btn">▶</div>
    <div class="btn" id="jump-btn">JUMP</div>
    <div style="grid-column: 1 / 3;" class="btn" id="dash-btn">DASH</div>
    <div class="btn" id="shoot-btn">FIRE</div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = 1000; canvas.height = 600;

// --- 通信エンジン ---
const peer = new Peer();
let conn = null;
let isHost = false;
let myPlayerNum = 1;

peer.on('open', (id) => {
    document.getElementById('my-id-display').innerText = "あなたのID: " + id;
});

// ホストとして接続を受ける
peer.on('connection', (c) => {
    conn = c;
    isHost = true;
    myPlayerNum = 1;
    setupConnection();
    initStage(); // ホストがステージを生成
    setTimeout(() => sendStageData(), 500); // ゲストにデータを送る
});

// ゲストとして接続する
function connectToPeer() {
    const peerId = document.getElementById('peer-id-input').value;
    conn = peer.connect(peerId);
    isHost = false;
    myPlayerNum = 2;
    setupConnection();
}

function setupConnection() {
    conn.on('open', () => {
        document.getElementById('setup-screen').style.display = 'none';
        loop();
    });
    conn.on('data', (data) => {
        if (data.type === 'stage') {
            platforms = data.platforms;
            walls = data.walls;
            healZone = data.healZone;
        } else if (data.type === 'update') {
            // 相手の座標を同期
            const other = allPlayers[data.pNum - 1];
            other.x = data.x; other.y = data.y;
            other.hp = data.hp; other.side = data.side;
            if (data.shoot) other.shoot();
        }
    });
}

// --- ゲームロジック ---
const gravity = 0.8;
let platforms = [], walls = [], healZone = null;
const allPlayers = [];

class Player {
    constructor(color) {
        this.x = 0; this.y = 0; this.w = 40; this.h = 60;
        this.color = color; this.vx = 0; this.vy = 0; this.hp = 100;
        this.side = 1; this.isJumping = false; this.bullets = [];
    }
    update() {
        this.vy += gravity; this.x += this.vx; this.y += this.vy;
        if (this.y + this.h > canvas.height - 20) { this.y = canvas.height - 20 - this.h; this.vy = 0; this.isJumping = false; }
        
        [...platforms, healZone].forEach(obj => {
            if (this.vy > 0 && this.x + this.w > obj.x && this.x < obj.x + obj.w && this.y + this.h > obj.y && this.y + this.h < obj.y + obj.h + this.vy) {
                this.y = obj.y - this.h; this.vy = 0; this.isJumping = false;
                if (obj === healZone && Date.now() % 500 < 20) this.hp = Math.min(100, this.hp + 1);
            }
        });
        
        walls.forEach(w => {
            if (this.x + this.w > w.x && this.x < w.x + w.w && this.y + this.h > w.y && this.y < w.y + w.h) {
                if (this.vx > 0 && this.x < w.x) this.x = w.x - this.w;
                else if (this.vx < 0 && this.x + this.w > w.x + w.w) this.x = w.x + w.w;
                this.vx = 0;
            }
        });

        this.bullets.forEach((b, i) => {
            b.x += b.vx;
            let hit = false;
            walls.forEach(w => { if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) hit = true; });
            if (hit) this.bullets.splice(i, 1);
        });
    }
    shoot() { this.bullets.push({x: this.x + (this.side === 1 ? this.w : 0), y: this.y + 25, vx: this.side * 15}); }
    draw() {
        ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.w, this.h);
        ctx.fillStyle = "white"; ctx.fillRect(this.side === 1 ? this.x + this.w - 10 : this.x, this.y + 10, 10, 10);
        ctx.fillStyle = "yellow"; this.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });
    }
}

allPlayers.push(new Player("#ff4757"), new Player("#2e91ff"));

function initStage() {
    walls = [{x: -50, y: 0, w: 65, h: 600}, {x: 985, y: 0, w: 65, h: 600}];
    for (let i = 0; i < 5; i++) platforms.push({x: Math.random()*700+100, y: 200+Math.random()*250, w: 200, h: 15});
    for (let i = 0; i < 2; i++) walls.push({x: 300+Math.random()*400, y: 200+Math.random()*200, w: 40, h: 100});
    healZone = {x: 400, y: 120, w: 200, h: 20};
    allPlayers[0].x = 100; allPlayers[0].y = 400;
    allPlayers[1].x = 800; allPlayers[1].y = 400;
}

function sendStageData() {
    conn.send({ type: 'stage', platforms, walls, healZone });
}

// --- 操作 ---
const input = { left: false, right: false, jump: false, dash: false };
const setupBtn = (id, key) => {
    const el = document.getElementById(id);
    el.ontouchstart = (e) => { e.preventDefault(); input[key] = true; };
    el.ontouchend = (e) => { e.preventDefault(); input[key] = false; };
};
setupBtn('left-btn', 'left'); setupBtn('right-btn', 'right'); setupBtn('dash-btn', 'dash');
document.getElementById('jump-btn').ontouchstart = () => { if (!allPlayers[myPlayerNum-1].isJumping) { allPlayers[myPlayerNum-1].vy = -16; allPlayers[myPlayerNum-1].isJumping = true; } };
document.getElementById('shoot-btn').ontouchstart = () => {
    allPlayers[myPlayerNum-1].shoot();
    conn.send({ type: 'update', pNum: myPlayerNum, x: me.x, y: me.y, hp: me.hp, side: me.side, shoot: true });
};

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 背景・足場描画
    ctx.fillStyle = "#444"; platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
    ctx.fillStyle = "#222"; walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));
    ctx.fillStyle = "rgba(46, 204, 113, 0.5)"; ctx.fillRect(healZone.x, healZone.y, healZone.w, healZone.h);

    const me = allPlayers[myPlayerNum - 1];
    let speed = input.dash ? 9 : 5;
    if (input.left) { me.vx = -speed; me.side = -1; }
    else if (input.right) { me.vx = speed; me.side = 1; }
    else { me.vx *= 0.8; }
    
    allPlayers.forEach(p => p.update());

    // 自分の弾が相手に当たったか判定
    const enemy = allPlayers[myPlayerNum === 1 ? 1 : 0];
    me.bullets.forEach((b, i) => {
        if (b.x > enemy.x && b.x < enemy.x + enemy.w && b.y > enemy.y && b.y < enemy.y + enemy.h) {
            enemy.hp -= 10; me.bullets.splice(i, 1);
        }
    });

    allPlayers.forEach(p => p.draw());
    document.getElementById('p1hp').innerText = allPlayers[0].hp;
    document.getElementById('p2hp').innerText = allPlayers[1].hp;

    // 通信で自分の状態を送信
    if (conn && conn.open) {
        conn.send({ type: 'update', pNum: myPlayerNum, x: me.x, y: me.y, hp: me.hp, side: me.side, shoot: false });
    }

    requestAnimationFrame(loop);
}
</script>
</body>
</html>
