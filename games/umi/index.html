<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multi-Device Survival Battle</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        
        /* 接続画面 */
        #setup-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .id-display { font-size: 60px; color: gold; font-weight: bold; margin: 20px; }
        input { padding: 15px; font-size: 24px; width: 200px; text-align: center; border-radius: 10px; border: none; }
        
        /* PC用レイアウト */
        #pc-view { display: none; text-align: center; }
        canvas { background: #111; border: 4px solid #333; max-width: 95vw; max-height: 80vh; }
        
        /* スマホ用コントローラー */
        #mobile-view { display: none; height: 100vh; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 10px; padding: 10px; background: #222; }
        .btn { background: #444; color: white; border-radius: 15px; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .btn:active { background: #888; transform: scale(0.9); }
        .btn-fire { background: #ff4757; } .btn-jump { background: #2e91ff; } .btn-dash { background: #8e44ad; }
    </style>
</head>
<body>

<div id="setup-screen">
    <div id="host-ui">
        <h2>PCをホストにする (IDをスマホへ)</h2>
        <div class="id-display" id="my-id-display">----</div>
        <p id="conn-status">スマホの接続を待っています...</p>
    </div>
    <hr style="width:80%; border:0.5px solid #444;">
    <div id="client-ui">
        <h2>スマホを接続する</h2>
        <input type="number" id="peer-id-input" placeholder="PCの4桁ID">
        <button id="connect-btn" style="padding:15px 30px; font-size:20px; background:#2ecc71; border:none; border-radius:10px; color:white; margin-top:10px;">CONNECT</button>
    </div>
</div>

<div id="pc-view">
    <div style="font-size:24px; margin:10px;">
        <span style="color:#ff4757">P1: <span id="p1hp">100</span></span> | 
        <span style="color:#2e91ff">P2: <span id="p2hp">100</span></span>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<div id="mobile-view">
    <div class="btn" id="btn-left">◀ LEFT</div>
    <div class="btn" id="btn-right">RIGHT ▶</div>
    <div class="btn btn-jump" id="btn-jump">JUMP</div>
    <div class="btn btn-dash" id="btn-dash" style="grid-column: span 2;">DASH</div>
    <div class="btn btn-fire" id="btn-fire">FIRE 🔥</div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = 1000; canvas.height = 600;

// 通信設定
const shortId = Math.floor(1000 + Math.random() * 9000).toString();
const peer = new Peer(shortId);
let connections = []; // PCが保持するスマホへの接続リスト
let myConn = null;    // スマホが保持するPCへの接続
let role = "";        // "host" or "client"

peer.on('open', id => document.getElementById('my-id-display').innerText = id);

// --- ホスト(PC)の処理 ---
peer.on('connection', conn => {
    role = "host";
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('pc-view').style.display = 'block';
    
    const pIndex = connections.length; // 0ならP1, 1ならP2
    connections.push(conn);
    
    conn.on('data', data => {
        if(data.type === 'input') handleInput(pIndex, data);
    });
    
    if(connections.length === 1) initStage(); // 最初の接続でステージ生成
});

// --- クライアント(スマホ)の処理 ---
document.getElementById('connect-btn').onclick = () => {
    const targetId = document.getElementById('peer-id-input').value;
    myConn = peer.connect(targetId);
    myConn.on('open', () => {
        role = "client";
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('mobile-view').style.display = 'grid';
    });
};

// --- ゲームロジック ---
const gravity = 0.8;
let platforms = [], healZone = null;
const players = [new Player("#ff4757", 150), new Player("#2e91ff", 800)];

function Player(color, x) {
    this.x = x; this.y = 400; this.w = 45; this.h = 65; this.color = color;
    this.vx = 0; this.vy = 0; this.hp = 100; this.side = 1; this.isJumping = false;
    this.bullets = [];
    this.update = function() {
        this.vy += gravity; this.x += this.vx; this.y += this.vy;
        if (this.y + this.h > 580) { this.y = 580 - this.h; this.vy = 0; this.isJumping = false; }
        platforms.forEach(p => {
            if (this.vy > 0 && this.x + this.w > p.x && this.x < p.x + p.w && this.y + this.h > p.y && this.y + this.h < p.y + p.h + this.vy) {
                this.y = p.y - this.h; this.vy = 0; this.isJumping = false;
            }
        });
        this.bullets.forEach((b, i) => {
            b.x += b.vx;
            if (b.x < 0 || b.x > 1000) this.bullets.splice(i, 1);
        });
    };
    this.shoot = function() { this.bullets.push({x: this.x + (this.side === 1 ? this.w : 0), y: this.y + 25, vx: this.side * 15}); };
}

function initStage() {
    platforms = [];
    for (let i = 0; i < 5; i++) platforms.push({x: 100+Math.random()*600, y: 200+Math.random()*250, w: 200, h: 15});
    requestAnimationFrame(loop);
}

function handleInput(pIdx, data) {
    const p = players[pIdx];
    if(!p) return;
    const speed = data.dash ? 10 : 6;
    if (data.left) { p.vx = -speed; p.side = -1; }
    else if (data.right) { p.vx = speed; p.side = 1; }
    else { p.vx *= 0.8; }
    if (data.jump && !p.isJumping) { p.vy = -17; p.isJumping = true; }
    if (data.fire) p.shoot();
}

// --- スマホ操作送信 ---
const currentInput = { left: false, right: false, jump: false, dash: false, fire: false };
const sendInput = () => { if(myConn) myConn.send({ type: 'input', ...currentInput, fire: false }); };

const bind = (id, key) => {
    const el = document.getElementById(id);
    el.ontouchstart = (e) => { 
        e.preventDefault(); 
        if(key === 'fire') { if(myConn) myConn.send({ type: 'input', ...currentInput, fire: true }); }
        else if(key === 'jump') { if(myConn) myConn.send({ type: 'input', ...currentInput, jump: true }); }
        else { currentInput[key] = true; }
    };
    el.ontouchend = (e) => { e.preventDefault(); currentInput[key] = false; };
};
bind('btn-left', 'left'); bind('btn-right', 'right'); bind('btn-jump', 'jump'); bind('btn-dash', 'dash'); bind('btn-fire', 'fire');

setInterval(() => { if(role === "client") sendInput(); }, 30);

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#444"; platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
    ctx.fillStyle = "#333"; ctx.fillRect(0, 580, 1000, 20);
    
    players.forEach((p, idx) => {
        p.update();
        const enemy = players[idx === 0 ? 1 : 0];
        p.bullets.forEach((b, bi) => {
            if (b.x > enemy.x && b.x < enemy.x + enemy.w && b.y > enemy.y && b.y < enemy.y + enemy.h) {
                enemy.hp -= 10; p.bullets.splice(bi, 1);
            }
        });
        
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "white"; ctx.fillRect(p.side === 1 ? p.x + p.w - 12 : p.x, p.y + 10, 12, 12);
        ctx.fillStyle = "yellow"; p.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });
    });
    
    document.getElementById('p1hp').innerText = players[0].hp;
    document.getElementById('p2hp').innerText = players[1].hp;
    requestAnimationFrame(loop);
}
</script>
</body>
</html>
