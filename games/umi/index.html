<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival Battle - Pro Host Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        
        /* セットアップ・オーバーレイ */
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .id-display { font-size: 70px; color: gold; font-weight: bold; text-shadow: 0 0 20px rgba(212,175,55,0.5); }
        input { padding: 15px; font-size: 24px; width: 220px; text-align: center; border-radius: 10px; border: 2px solid #555; background: #eee; color: #333; }
        
        /* PC用表示 */
        #pc-game-view { display: none; text-align: center; width: 100vw; height: 100vh; }
        canvas { background: #111; border: 4px solid #333; margin-top: 10px; box-shadow: 0 0 50px #000; }
        .hp-bar { display: flex; justify-content: space-around; font-size: 28px; font-weight: bold; padding: 10px; text-shadow: 2px 2px 4px #000; }

        /* スマホ用コントローラー */
        #mobile-ctrl-view { display: none; height: 100vh; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 12px; padding: 15px; background: #111; }
        .btn { background: #333; color: white; border-radius: 20px; font-size: 26px; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 2px solid #444; }
        .btn:active { background: #666; transform: scale(0.92); }
        .btn-fire { background: #ff4757; border-color: #ff6b81; }
        .btn-jump { background: #2e91ff; border-color: #54a0ff; }
        .btn-dash { background: #8e44ad; grid-column: span 2; }

        .start-btn-group { display: flex; gap: 20px; margin-top: 30px; }
        .main-btn { padding: 15px 40px; font-size: 24px; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div id="setup-screen" class="overlay">
    <div id="host-setup">
        <h1 style="margin:0; color:gold;">SERVER ID</h1>
        <div class="id-display" id="my-id-display">----</div>
        <p>スマホでこのIDを入力して接続してください</p>
        <div id="conn-count" style="font-size:20px; color:#2ecc71;">接続済み: 0台</div>
        <div class="start-btn-group">
            <button class="main-btn" style="background:#444; color:white;" onclick="initStage()">SHUFFLE</button>
            <button class="main-btn" style="background:#2ecc71; color:white;" onclick="startGame()">START GAME</button>
        </div>
    </div>
    <div style="margin: 40px 0; width: 80%; border-bottom: 1px solid #444;"></div>
    <div id="client-setup">
        <input type="number" id="peer-id-input" placeholder="4桁IDを入力">
        <button class="main-btn" style="background:#2e91ff; color:white; margin-top:10px;" onclick="connectToPC()">CONNECT TO PC</button>
    </div>
</div>

<div id="pc-game-view">
    <div class="hp-bar">
        <div style="color:#ff4757">P1: <span id="p1hp">100</span></div>
        <div style="color:#2e91ff">P2: <span id="p2hp">100</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<div id="mobile-ctrl-view">
    <div class="btn" id="btn-left">◀ LEFT</div>
    <div class="btn" id="btn-right">RIGHT ▶</div>
    <div class="btn btn-jump" id="btn-jump">JUMP</div>
    <div class="btn btn-dash" id="btn-dash">DASH</div>
    <div class="btn btn-fire" id="btn-fire">FIRE 🔥</div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = 1000; canvas.height = 600;

const shortId = Math.floor(1000 + Math.random() * 9000).toString();
const peer = new Peer(shortId);
let connections = [];
let role = ""; // "host" or "client"
let gameRunning = false;

peer.on('open', id => document.getElementById('my-id-display').innerText = id);

// --- ホスト処理 ---
peer.on('connection', conn => {
    role = "host";
    connections.push(conn);
    document.getElementById('conn-count').innerText = `接続済み: ${connections.length}台`;
    document.getElementById('pc-game-view').style.display = 'block';
    
    const pIdx = connections.length - 1;
    conn.on('data', data => { if(data.type === 'input') handleInput(pIdx, data); });
});

function startGame() {
    if (connections.length === 0) { alert("スマホを1台以上接続してください"); return; }
    document.getElementById('setup-screen').style.display = 'none';
    gameRunning = true;
    initStage();
    loop();
}

// --- クライアント処理 ---
function connectToPC() {
    const targetId = document.getElementById('peer-id-input').value;
    const myConn = peer.connect(targetId);
    myConn.on('open', () => {
        role = "client";
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('mobile-ctrl-view').style.display = 'grid';
        
        // 入力ループ
        setInterval(() => {
            myConn.send({ type: 'input', ...currentInput, fire: fireTrigger });
            fireTrigger = false; // 発射は1回ずつ
        }, 30);
    });
}

// --- ゲームエンジン ---
const gravity = 0.8;
let platforms = [], walls = [], healZone = null;
const players = [];

function Player(color, x) {
    this.x = x; this.y = 400; this.w = 40; this.h = 60; this.color = color;
    this.vx = 0; this.vy = 0; this.hp = 100; this.side = 1; this.isJumping = false;
    this.bullets = [];
    this.update = function() {
        this.vy += gravity; this.x += this.vx; this.y += this.vy;
        if (this.y + this.h > 580) { this.y = 580 - this.h; this.vy = 0; this.isJumping = false; }
        
        platforms.forEach(p => {
            if (this.vy > 0 && this.x + this.w > p.x && this.x < p.x + p.w && this.y + this.h > p.y && this.y + this.h < p.y + p.h + this.vy) {
                this.y = p.y - this.h; this.vy = 0; this.isJumping = false;
            }
        });
        
        walls.forEach(w => {
            if (this.x + this.w > w.x && this.x < w.x + w.w && this.y + this.h > w.y && this.y < w.y + w.h) {
                if (this.vx > 0 && this.x < w.x) this.x = w.x - this.w;
                else if (this.vx < 0) this.x = w.x + w.w;
                this.vx = 0;
            }
        });

        if (this.x + this.w > healZone.x && this.x < healZone.x + healZone.w && this.y + this.h > healZone.y && this.y < healZone.y + healZone.h) {
            if (Date.now() % 500 < 30) this.hp = Math.min(100, this.hp + 1);
        }

        this.bullets.forEach((b, i) => {
            b.x += b.vx;
            let hitWall = false;
            walls.forEach(w => { if(b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) hitWall = true; });
            if (hitWall || b.x < 0 || b.x > 1000) this.bullets.splice(i, 1);
        });
    };
}

function initStage() {
    players[0] = new Player("#ff4757", 100);
    players[1] = new Player("#2e91ff", 860);
    platforms = []; walls = [{x: -50, y: 0, w: 60, h: 600}, {x: 990, y: 0, w: 60, h: 600}];
    for (let i = 0; i < 5; i++) platforms.push({x: 100+Math.random()*600, y: 200+Math.random()*250, w: 200, h: 15});
    for (let i = 0; i < 2; i++) walls.push({x: 300+Math.random()*400, y: 150+Math.random()*300, w: 40, h: 120});
    healZone = {x: 400, y: 100, w: 200, h: 15};
    // PCビューで見えるように一度描画
    draw();
}

function handleInput(pIdx, data) {
    const p = players[pIdx]; if(!p || p.hp <= 0) return;
    const speed = data.dash ? 11 : 6;
    if (data.left) { p.vx = -speed; p.side = -1; }
    else if (data.right) { p.vx = speed; p.side = 1; }
    else { p.vx *= 0.8; }
    if (data.jump && !p.isJumping) { p.vy = -17; p.isJumping = true; }
    if (data.fire) p.bullets.push({x: p.x + (p.side === 1 ? p.w : 0), y: p.y + 25, vx: p.side * 16});
}

// --- スマホ操作 ---
let currentInput = { left: false, right: false, dash: false, jump: false };
let fireTrigger = false;
const bind = (id, key) => {
    const el = document.getElementById(id);
    const start = (e) => { 
        e.preventDefault(); 
        if(key === 'fire') { fireTrigger = true; if(navigator.vibrate) navigator.vibrate(20); }
        else if(key === 'jump') currentInput.jump = true;
        else currentInput[key] = true;
    };
    const end = (e) => { e.preventDefault(); if(key !== 'fire') currentInput[key] = false; };
    el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
};
bind('btn-left', 'left'); bind('btn-right', 'right'); bind('btn-jump', 'jump'); bind('btn-dash', 'dash'); bind('btn-fire', 'fire');

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#444"; platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
    ctx.fillStyle = "#222"; walls.forEach(w => { ctx.fillRect(w.x, w.y, w.w, w.h); ctx.strokeStyle="#555"; ctx.strokeRect(w.x, w.y, w.w, w.h); });
    ctx.fillStyle = "rgba(46, 204, 113, 0.5)"; ctx.fillRect(healZone.x, healZone.y, healZone.w, healZone.h);
    ctx.fillStyle = "#333"; ctx.fillRect(0, 580, 1000, 20);

    players.forEach((p, idx) => {
        if (p.hp <= 0) return;
        p.update();
        const enemy = players[idx === 0 ? 1 : 0];
        p.bullets.forEach((b, bi) => {
            if (b.x > enemy.x && b.x < enemy.x + enemy.w && b.y > enemy.y && b.y < enemy.y + enemy.h) {
                enemy.hp -= 10; p.bullets.splice(bi, 1);
            }
        });
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "white"; ctx.fillRect(p.side === 1 ? p.x + p.w - 12 : p.x, p.y + 10, 12, 12);
        ctx.fillStyle = "yellow"; p.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });
    });
    document.getElementById('p1hp').innerText = players[0]?.hp || 0;
    document.getElementById('p2hp').innerText = players[1]?.hp || 0;
}

function loop() {
    if(!gameRunning) return;
    draw();
    requestAnimationFrame(loop);
}
initStage(); // プレビュー用
</script>
</body>
</html>
