<!DOCTYPE html>
<html lang="ja" style="touch-action: none; overflow: hidden;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Survival Battle - Landscape Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* 基本スタイル：ズーム・スクロールを徹底排除 */
        * {
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            margin: 0; 
            background: #111; 
            color: white; 
            font-family: sans-serif; 
            overflow: hidden; 
            position: fixed; 
            width: 100vw; 
            height: 100vh;
        }

        /* 初期画面：横画面ではみ出さないよう高さを調整 */
        .overlay { 
            position: absolute; 
            inset: 0; 
            background: rgba(0,0,0,0.95); 
            z-index: 200; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 10px;
        }

        h1 { font-size: 5vh; color: gold; margin: 5px 0; }
        
        .setup-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 15px;
        }

        .btn-ui { 
            padding: 10px 25px; 
            background: #2ecc71; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            font-weight: bold; 
            box-shadow: 0 4px #1e8449;
        }

        input {
            padding: 10px;
            width: 80px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            text-align: center;
        }

        /* ゲーム表示エリア */
        #pc-view { display: none; text-align: center; width: 100vw; height: 100vh; }
        canvas { 
            background: #000; 
            border: 2px solid #333; 
            max-width: 98vw; 
            max-height: 75vh; 
            margin-top: 5px; 
        }

        /* スマホ・コントローラー配置：横画面に最適化 */
        #mobile-view { display: none; width: 100vw; height: 100vh; position: relative; }
        
        .left-pad { 
            position: absolute; 
            bottom: 10%; 
            left: 5%; 
            display: flex; 
            gap: 15px; 
        }
        
        .right-pad { 
            position: absolute; 
            bottom: 10%; 
            right: 5%; 
            width: 45vh; 
            height: 45vh; 
        }

        .btn-ctrl { 
            background: rgba(255,255,255,0.15); 
            color: white; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            border: 2px solid rgba(255,255,255,0.3);
        }
        .btn-ctrl:active { background: rgba(255,255,255,0.4); transform: scale(0.92); }
        
        .btn-move { width: 16vh; height: 16vh; font-size: 5vh; border-radius: 25%; }
        .btn-action { position: absolute; width: 14vh; height: 14vh; font-size: 2.5vh; }
        
        /* 十字キー配置 */
        .pos-top { top: 0; left: 15.5vh; background: rgba(46, 145, 255, 0.5); }
        .pos-left { top: 15.5vh; left: 0; background: rgba(142, 68, 173, 0.5); }
        .pos-right { top: 15.5vh; right: 0; background: rgba(255, 71, 87, 0.5); }

        .hp-display { font-size: 20px; font-weight: bold; display: flex; justify-content: space-around; padding: 5px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="setup-screen" class="overlay">
    <h1>SURVIVAL ONLINE</h1>
    <div class="setup-container">
        <div style="text-align: center; border-right: 1px solid #444; padding-right: 20px;">
            <div style="font-size: 12px; color: #aaa;">MY ID</div>
            <div id="my-id-display" style="font-size: 40px; font-weight: bold; color: #2ecc71;">----</div>
            <div id="pc-conn-count" style="font-size: 14px; margin-bottom: 5px;">接続数: 0</div>
            <button onclick="requestStart()" class="btn-ui">START</button>
        </div>
        <div id="client-side" style="text-align: center; padding-left: 10px;">
            <div id="mobile-pre-connect">
                <input type="number" id="peer-id-input" placeholder="ID">
                <button onclick="connectToPC()" class="btn-ui" style="background:#2e91ff;">CONNECT</button>
            </div>
            <div id="mobile-post-connect" style="display:none;">
                <div id="mobile-conn-count" style="font-size: 16px; margin-bottom: 10px; color: #2ecc71;">接続完了</div>
                <button onclick="requestStart()" class="btn-ui">START GAME</button>
            </div>
        </div>
    </div>
</div>

<div id="finish-ui" class="overlay" style="display:none;">
    <div id="winner-text" style="font-size:60px; color:gold; margin-bottom:15px;">WINNER!</div>
    <button onclick="requestStart()" class="btn-ui" style="padding: 20px 60px; font-size: 30px;">REMATCH</button>
</div>

<div id="pc-view">
    <div class="hp-display">
        <span style="color:#ff4757">P1: <span id="p1hp">100</span></span>
        <span style="color:#2e91ff">P2: <span id="p2hp">100</span></span>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<div id="mobile-view">
    <div class="left-pad">
        <div class="btn-ctrl btn-move" id="btn-left">◀</div>
        <div class="btn-ctrl btn-move" id="btn-right">▶</div>
    </div>
    <div class="right-pad">
        <div class="btn-ctrl btn-action pos-top" id="btn-jump">JUMP</div>
        <div class="btn-ctrl btn-action pos-left" id="btn-dash">DASH</div>
        <div class="btn-ctrl btn-action pos-right" id="btn-fire">FIRE 🔥</div>
    </div>
</div>

<script>
/* ズーム徹底防止スクリプト */
document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastClickTime = 0;
document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastClickTime <= 300) e.preventDefault();
    lastClickTime = now;
}, false);

/* PeerJS & 通信ロジック */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = 1000; canvas.height = 600;

const shortId = Math.floor(1000 + Math.random() * 9000).toString();
const peer = new Peer(shortId);
let connections = [], gameActive = false, animationId = null;
let platforms = [], walls = [], healZone = null, players = [], particles = [];
let role = "host";

peer.on('open', id => document.getElementById('my-id-display').innerText = id);
peer.on('connection', conn => {
    connections.push(conn);
    updateConnDisplay();
    conn.on('data', data => {
        if(data.type === 'input') handleInput(connections.indexOf(conn), data);
        if(data.type === 'start_request') startLocalGame();
    });
});

function updateConnDisplay() {
    const txt = `接続数: ${connections.length}`;
    document.getElementById('pc-conn-count').innerText = txt;
    connections.forEach(c => c.send({type: 'conn_update', count: connections.length}));
}

function requestStart() {
    if(role === "host") startLocalGame();
    else if(connections[0]) connections[0].send({type: 'start_request'});
}

function startLocalGame() {
    if (connections.length === 0 && role === "host") return;
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('finish-ui').style.display = 'none';
    document.getElementById('pc-view').style.display = 'block';
    gameActive = true;
    connections.forEach(c => c.send({type: 'game_start'}));
    initStage();
    if (animationId) cancelAnimationFrame(animationId);
    loop();
}

function connectToPC() {
    role = "client";
    const targetId = document.getElementById('peer-id-input').value;
    const myConn = peer.connect(targetId);
    connections = [myConn];
    myConn.on('open', () => {
        document.getElementById('mobile-pre-connect').style.display = 'none';
        document.getElementById('mobile-post-connect').style.display = 'block';
        document.getElementById('mobile-view').style.display = 'block';
        setInterval(() => {
            myConn.send({ type: 'input', ...currentInput, fire: fireTrigger });
            fireTrigger = false;
        }, 30);
    });
    myConn.on('data', data => {
        if(data.type === 'game_over') {
            document.getElementById('finish-ui').style.display = 'flex';
            document.getElementById('winner-text').innerText = data.winner + " WIN!";
        }
        if(data.type === 'game_start') {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('finish-ui').style.display = 'none';
        }
    });
}

/* ゲームエンジン：演出 & 物理 */
function createFireworks(x, y, color) {
    for(let i=0; i<12; i++) {
        particles.push({ x, y, color, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, life: 1.0 });
    }
}

function Player(color, x) {
    this.x = x; this.y = 400; this.w = 40; this.h = 60; this.color = color;
    this.vx = 0; this.vy = 0; this.hp = 100; this.side = 1; this.isJumping = false;
    this.bullets = [];
    this.update = function() {
        this.vy += 0.8; this.x += this.vx;
        walls.forEach(w => {
            if (this.x + this.w > w.x && this.x < w.x + w.w && this.y + this.h > w.y && this.y < w.y + w.h) {
                if (this.vx > 0 && this.x < w.x) this.x = w.x - this.w;
                else if (this.vx < 0 && this.x + this.w > w.x + w.w) this.x = w.x + w.w;
            }
        });
        this.y += this.vy;
        if (this.y + this.h > 580) { this.y = 580 - this.h; this.vy = 0; this.isJumping = false; }
        [...platforms, healZone].forEach(p => {
            if (this.vy > 0 && this.x + this.w > p.x && this.x < p.x + p.w && 
                this.y + this.h >= p.y && this.y + this.h <= p.y + p.h + this.vy) {
                this.y = p.y - this.h; this.vy = 0; this.isJumping = false;
                if(p === healZone && Math.random() < 0.1) this.hp = Math.min(100, this.hp + 0.5);
            }
        });
        this.bullets.forEach((b, i) => {
            b.x += b.vx;
            players.forEach(enemy => {
                if(enemy.color !== this.color && b.x > enemy.x && b.x < enemy.x + enemy.w && b.y > enemy.y && b.y < enemy.y + enemy.h) {
                    enemy.hp -= 10; enemy.vx = (b.vx > 0) ? 12 : -12;
                    createFireworks(b.x, b.y, "orange");
                    this.bullets.splice(i, 1);
                }
            });
            if (b.x < 0 || b.x > 1000) this.bullets.splice(i, 1);
        });
    };
}

function initStage() {
    players = [new Player("#ff4757", 150), new Player("#2e91ff", 810)];
    platforms = []; walls = []; particles = [];
    for (let i = 0; i < 5; i++) platforms.push({x: 150+Math.random()*500, y: 250+Math.random()*200, w: 200, h: 15});
    for (let i = 0; i < 2; i++) walls.push({x: 350+Math.random()*300, y: 200, w: 40, h: 200});
    healZone = {x: 400, y: 120, w: 200, h: 20};
}

function handleInput(pIdx, data) {
    const p = players[pIdx]; if(!p || !gameActive) return;
    const speed = data.dash ? 13 : 8;
    if (data.left) { p.vx = -speed; p.side = -1; }
    else if (data.right) { p.vx = speed; p.side = 1; }
    else { p.vx *= 0.7; }
    if (data.jump && !p.isJumping) { p.vy = -18; p.isJumping = true; }
    if (data.fire) p.bullets.push({x: p.x + (p.side === 1 ? p.w : 0), y: p.y + 25, vx: p.side * 20});
}

/* スマホ入力処理 */
let currentInput = { left: false, right: false, dash: false, jump: false }, fireTrigger = false;
const bind = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if(key === 'fire') { fireTrigger = true; if(navigator.vibrate) navigator.vibrate(30); }
        else currentInput[key] = true;
    }, {passive: false});
    el.addEventListener('touchend', (e) => { 
        e.preventDefault(); if(key !== 'fire') currentInput[key] = false; 
    }, {passive: false});
};
bind('btn-left', 'left'); bind('btn-right', 'right');
bind('btn-jump', 'jump'); bind('btn-dash', 'dash'); bind('btn-fire', 'fire');

function loop() {
    if(!gameActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#444"; platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
    ctx.fillStyle = "#222"; walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));
    ctx.fillStyle = "#2ecc71"; ctx.fillRect(healZone.x, healZone.y, healZone.w, healZone.h);
    ctx.fillStyle = "#333"; ctx.fillRect(0, 580, 1000, 20);
    
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.05;
        if(p.life <= 0) particles.splice(i, 1);
        ctx.fillStyle = `rgba(255,165,0,${p.life})`;
        ctx.fillRect(p.x, p.y, 4, 4);
    });

    players.forEach((p, idx) => {
        p.update();
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "white"; ctx.fillRect(p.side === 1 ? p.x + p.w - 12 : p.x, p.y + 10, 12, 12);
        ctx.fillStyle = "yellow"; p.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });

        if (p.hp <= 0 && gameActive) {
            gameActive = false;
            const winnerName = (idx === 0 ? "P2" : "P1");
            document.getElementById('winner-text').innerText = winnerName + " WIN!";
            document.getElementById('finish-ui').style.display = 'flex';
            connections.forEach(c => c.send({type: 'game_over', winner: winnerName}));
        }
    });
    document.getElementById('p1hp').innerText = Math.floor(players[0].hp);
    document.getElementById('p2hp').innerText = Math.floor(players[1].hp);
    animationId = requestAnimationFrame(loop);
}
</script>
</body>
</html>
