<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Survival Battle - Landscape Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; -webkit-user-select: none; }
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .id-display { font-size: 60px; color: gold; font-weight: bold; }
        
        /* PCビュー */
        #pc-view { display: none; text-align: center; width: 100vw; height: 100vh; }
        canvas { background: #111; border: 4px solid #333; max-width: 90vw; max-height: 80vh; }

        /* スマホ・横画面コントローラー */
        #mobile-view { display: none; height: 100vh; width: 100vw; background: #111; position: relative; }
        .pad-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            height: 100%; 
            padding: 20px 40px; 
            box-sizing: border-box; 
        }
        
        /* 共通ボタン設定 */
        .btn { 
            background: rgba(255,255,255,0.1); 
            color: white; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            border: 2px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            touch-action: none;
        }
        .btn:active { background: rgba(255,255,255,0.3); transform: scale(0.9); }
        
        /* 左側：移動ボタン */
        .move-group { display: flex; gap: 20px; }
        .btn-move { width: 18vh; height: 18vh; font-size: 5vh; border-radius: 20%; }

        /* 右側：十字アクション */
        .action-group { position: relative; width: 45vh; height: 45vh; }
        .btn-action { position: absolute; width: 16vh; height: 16vh; font-size: 3vh; border-radius: 50%; }
        
        .pos-top    { top: 0; left: 14.5vh; background: rgba(46, 145, 255, 0.4); border-color: #2e91ff; }
        .pos-left   { top: 14.5vh; left: 0; background: rgba(142, 68, 173, 0.4); border-color: #8e44ad; }
        .pos-right  { top: 14.5vh; right: 0; background: rgba(255, 71, 87, 0.4); border-color: #ff4757; }

        .status-text { position: absolute; top: 10px; width: 100%; text-align: center; color: #555; font-size: 12px; }
    </style>
</head>
<body>

<div id="setup-screen" class="overlay">
    <div id="host-setup">
        <h1>SERVER ID</h1>
        <div class="id-display" id="my-id-display">----</div>
        <p id="conn-count" style="color:#2ecc71; text-align:center;">接続済み: 0台</p>
        <div style="display:flex; gap:10px;">
            <button onclick="startGame()" style="padding:15px 40px; background:#2ecc71; color:white; border:none; border-radius:10px; font-size:24px; font-weight:bold;">START</button>
            <button onclick="initStage()" style="padding:15px; background:#444; color:white; border:none; border-radius:10px;">SHUFFLE</button>
        </div>
    </div>
    <div id="client-setup" style="margin-top: 30px; text-align: center;">
        <input type="number" id="peer-id-input" placeholder="4桁ID" style="padding:12px; font-size:20px; width:120px; border-radius:8px;">
        <button onclick="connectToPC()" style="padding:12px 24px; background:#2e91ff; color:white; border:none; border-radius:8px; font-size:18px; margin-left:10px;">CONNECT</button>
    </div>
</div>

<div id="finish-ui" class="overlay" style="display:none;">
    <div style="font-size:60px; color:gold; margin-bottom:20px;" id="winner-text">P1 WIN!</div>
    <button onclick="rematch()" style="padding:20px 60px; background:#2ecc71; color:white; border:none; border-radius:10px; font-size:24px; font-weight:bold;">REMATCH</button>
</div>

<div id="pc-view">
    <div style="display:flex; justify-content:space-around; font-size:24px; padding:10px;">
        <span style="color:#ff4757">P1: <span id="p1hp">100</span></span>
        <span style="color:#2e91ff">P2: <span id="p2hp">100</span></span>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<div id="mobile-view">
    <div class="status-text">CONTROLLER MODE (LANDSCAPE)</div>
    <div class="pad-container">
        <div class="move-group">
            <div class="btn btn-move" id="btn-left">◀</div>
            <div class="btn btn-move" id="btn-right">▶</div>
        </div>
        <div class="action-group">
            <div class="btn btn-action pos-top" id="btn-jump">JUMP</div>
            <div class="btn btn-action pos-left" id="btn-dash">DASH</div>
            <div class="btn btn-action pos-right" id="btn-fire">FIRE</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = 1000; canvas.height = 600;

const shortId = Math.floor(1000 + Math.random() * 9000).toString();
const peer = new Peer(shortId);
let connections = [];
let gameActive = false;

peer.on('open', id => document.getElementById('my-id-display').innerText = id);

peer.on('connection', conn => {
    if (connections.length >= 2) return;
    connections.push(conn);
    document.getElementById('conn-count').innerText = `接続済み: ${connections.length}台`;
    conn.on('data', data => { if(data.type === 'input') handleInput(connections.indexOf(conn), data); });
});

function startGame() {
    if (connections.length === 0) return;
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('pc-view').style.display = 'block';
    gameActive = true;
    initStage();
    loop();
}

function rematch() {
    document.getElementById('finish-ui').style.display = 'none';
    gameActive = true;
    initStage();
}

function connectToPC() {
    const targetId = document.getElementById('peer-id-input').value;
    const myConn = peer.connect(targetId);
    myConn.on('open', () => {
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('mobile-view').style.display = 'block';
        setInterval(() => {
            myConn.send({ type: 'input', ...currentInput, fire: fireTrigger });
            fireTrigger = false;
        }, 30);
    });
}

// --- ゲームロジック ---
const gravity = 0.8;
let platforms = [], players = [];

function Player(color, x) {
    this.x = x; this.y = 400; this.w = 40; this.h = 60; this.color = color;
    this.vx = 0; this.vy = 0; this.hp = 100; this.side = 1; this.isJumping = false;
    this.bullets = [];
    this.update = function() {
        this.vy += gravity; this.x += this.vx; this.y += this.vy;
        if (this.y + this.h > 580) { this.y = 580 - this.h; this.vy = 0; this.isJumping = false; }
        platforms.forEach(p => {
            if (this.vy > 0 && this.x + this.w > p.x && this.x < p.x + p.w && this.y + this.h > p.y && this.y + this.h < p.y + p.h + this.vy) {
                this.y = p.y - this.h; this.vy = 0; this.isJumping = false;
            }
        });
        this.bullets.forEach((b, i) => {
            b.x += b.vx;
            if (b.x < 0 || b.x > 1000) this.bullets.splice(i, 1);
        });
    };
}

function initStage() {
    players = [new Player("#ff4757", 100), new Player("#2e91ff", 860)];
    platforms = [];
    for (let i = 0; i < 5; i++) platforms.push({x: 100+Math.random()*600, y: 200+Math.random()*250, w: 200, h: 15});
}

function handleInput(pIdx, data) {
    const p = players[pIdx]; if(!p || !gameActive) return;
    const speed = data.dash ? 12 : 7;
    if (data.left) { p.vx = -speed; p.side = -1; }
    else if (data.right) { p.vx = speed; p.side = 1; }
    else { p.vx *= 0.8; }
    if (data.jump && !p.isJumping) { p.vy = -17; p.isJumping = true; }
    if (data.fire) p.bullets.push({x: p.x + (p.side === 1 ? p.w : 0), y: p.y + 25, vx: p.side * 18});
}

// --- 操作入力 ---
let currentInput = { left: false, right: false, dash: false, jump: false };
let fireTrigger = false;
const bind = (id, key) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if(key === 'fire') { fireTrigger = true; if(navigator.vibrate) navigator.vibrate(25); }
        else currentInput[key] = true;
    });
    el.addEventListener('touchend', (e) => { e.preventDefault(); if(key !== 'fire') currentInput[key] = false; });
};
bind('btn-left', 'left'); bind('btn-right', 'right');
bind('btn-jump', 'jump'); bind('btn-dash', 'dash'); bind('btn-fire', 'fire');

function loop() {
    if(!gameActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#444"; platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
    ctx.fillStyle = "#333"; ctx.fillRect(0, 580, 1000, 20);
    
    players.forEach((p, idx) => {
        p.update();
        const enemy = players[idx === 0 ? 1 : 0];
        p.bullets.forEach((b, bi) => {
            if (b.x > enemy.x && b.x < enemy.x + enemy.w && b.y > enemy.y && b.y < enemy.y + enemy.h) {
                enemy.hp -= 10; p.bullets.splice(bi, 1);
            }
        });
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "white"; ctx.fillRect(p.side === 1 ? p.x + p.w - 12 : p.x, p.y + 10, 12, 12);
        ctx.fillStyle = "yellow"; p.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });

        if (p.hp <= 0 && gameActive) {
            gameActive = false;
            document.getElementById('winner-text').innerText = (idx === 0 ? "PLAYER 2" : "PLAYER 1") + " WIN!";
            document.getElementById('finish-ui').style.display = 'flex';
        }
    });
    document.getElementById('p1hp').innerText = players[0].hp;
    document.getElementById('p2hp').innerText = players[1].hp;
    requestAnimationFrame(loop);
}
initStage();
</script>
</body>
</html>
