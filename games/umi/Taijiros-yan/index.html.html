<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>たいじろうやん！</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* Layout: 画面いっぱいのキャンバス。左下に縦スライダー(ゴンドラ上下)、その上にうんちボタン。画面タップで発射。単一テーマのアーケード調。 */
:root {
  --bg: #0c1427;
  --panel: rgba(12, 20, 39, 0.58);
  --line: rgba(255, 255, 255, 0.38);
  --fg: #eef3ff;
  --accent: #ffcf4a;
  --accent-deep: #b8741a;
  --font: 'DotGothic16', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
#probe { position: fixed; top: 0; left: 0; width: 0; height: env(safe-area-inset-top, 0px); visibility: hidden; pointer-events: none; }
.stage {
  position: fixed;
  inset: 0;
  margin: auto;
  width: min(100vw, calc(100dvh * 0.75));
  height: 100dvh;
  overflow: hidden;
  background: #63b9ec;
  touch-action: none;
}
#game { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.controls { position: absolute; inset: 0; pointer-events: none; }
.dock {
  position: absolute;
  left: max(14px, env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
#bomb {
  pointer-events: auto;
  touch-action: none;
  width: 70px;
  height: 78px;
  padding: 6px 0 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font: inherit;
  font-size: 20px;
  line-height: 1;
  color: var(--accent);
  background: var(--panel);
  border: 3px solid var(--line);
  border-radius: 22px;
  cursor: pointer;
}
#bomb .emoji { font-size: 32px; line-height: 1; display: block; }
#bomb.hot { background: rgba(184, 116, 26, 0.85); transform: scale(0.94); }
#bomb.empty { opacity: 0.42; color: #c9d4ee; }
#slider {
  pointer-events: auto;
  touch-action: none;
  position: relative;
  width: 60px;
  height: clamp(160px, 36dvh, 320px);
  background: var(--panel);
  border: 3px solid var(--line);
  border-radius: 32px;
}
#slider::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 14px;
  bottom: 14px;
  width: 4px;
  margin-left: -2px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.28);
}
#thumb {
  position: absolute;
  left: 50%;
  top: 4px;
  width: 46px;
  height: 46px;
  margin-left: -23px;
  border-radius: 50%;
  background:
    repeating-linear-gradient(to bottom, transparent 0 14px, rgba(60, 36, 8, 0.55) 14px 17px, transparent 17px 20px) center / 20px 12px no-repeat,
    var(--accent);
  border: 3px solid #fff3c4;
  box-sizing: border-box;
}
#mute {
  position: absolute;
  right: max(8px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 3px);
  pointer-events: auto;
  font: inherit;
  font-size: 12px;
  height: 22px;
  padding: 0 8px;
  color: var(--fg);
  background: rgba(8, 16, 36, 0.6);
  border: 2px solid var(--line);
  border-radius: 4px;
  cursor: pointer;
}
#guide {
  position: absolute;
  right: max(8px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 27px);
  pointer-events: auto;
  font: inherit;
  font-size: 11px;
  line-height: 1;
  height: 17px;
  padding: 0 7px;
  color: var(--fg);
  background: rgba(8, 16, 36, 0.6);
  border: 2px solid var(--line);
  border-radius: 4px;
  cursor: pointer;
}
#guide[aria-pressed="true"] { background: rgba(255, 207, 74, 0.88); color: #2a1d00; border-color: #ffe28a; }
#pauseBtn {
  position: absolute;
  right: max(8px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 52px);
  pointer-events: auto;
  font: inherit;
  font-size: 12px;
  line-height: 1;
  height: 24px;
  padding: 0 8px;
  color: var(--fg);
  background: rgba(8, 16, 36, 0.6);
  border: 2px solid var(--line);
  border-radius: 4px;
  cursor: pointer;
}
#pauseMenu {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(8, 16, 36, 0.72);
  touch-action: none;
}
#pauseMenu .menu { width: min(240px, 70%); display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
#titleMenu {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(270px, 74%);
  z-index: 4;
  display: flex;
  flex-direction: column;
  gap: 8px;
  touch-action: none;
}
#titleMenu button {
  font: inherit;
  height: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--fg);
  background: rgba(36, 58, 107, 0.95);
  border: 3px solid var(--line);
  border-bottom-width: 5px;
  border-radius: 12px;
  cursor: pointer;
}
#titleMenu button b { font-weight: 400; font-size: 18px; line-height: 1; }
#titleMenu button small { font-size: 11px; line-height: 1; color: #c9d4ee; }
#titleMenu #easyBtn { background: var(--accent-deep); border-color: #e0a043; color: #fff7e0; }
#titleMenu #easyBtn small { color: #ffe9bf; }
#titleMenu button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#rotate {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--bg);
  color: var(--fg);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-align: center;
  padding: 24px;
  font-size: 18px;
  line-height: 1.7;
  touch-action: none;
}
#rotate small { font-size: 12px; color: #c9d4ee; }
#rotate .phone {
  width: 44px;
  height: 76px;
  border: 4px solid var(--accent);
  border-radius: 9px;
  position: relative;
  animation: tilt 2.4s ease-in-out infinite;
}
#rotate .phone::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 12px; height: 4px; margin-left: -6px; border-radius: 2px; background: var(--accent); }
@keyframes tilt { 0%, 30% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
@media (orientation: landscape) and (pointer: coarse) and (max-height: 600px) {
  #rotate { display: flex; }
}
@media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; } }
#pauseMode { text-align: center; font-size: 13px; color: #9fe3ff; margin-top: -6px; }
#pauseMenu h2 { margin: 0 0 6px; text-align: center; font-size: 30px; font-weight: 400; letter-spacing: 0.1em; color: var(--accent); }
#pauseMenu button {
  font: inherit;
  font-size: 18px;
  height: 54px;
  color: var(--fg);
  background: rgba(36, 58, 107, 0.95);
  border: 3px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
}
#pauseMenu #resumeBtn { background: var(--accent-deep); border-color: #e0a043; color: #fff7e0; }
#pauseBtn:focus-visible, #pauseMenu button:focus-visible, #mute:focus-visible, #guide:focus-visible, #bomb:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>

<div id="probe"></div>
<div id="rotate" aria-live="polite"><div class="phone" aria-hidden="true"></div><div>スマホを たてに してね<br><small>たいじろうやん！は たて画面 せんようです</small></div></div>
<div class="stage" id="stage">
  <canvas id="game" aria-label="たいじろうやん！のゲーム画面"></canvas>
  <div class="controls">
    <button id="mute" type="button" aria-pressed="false">おと ON</button>
    <button id="guide" type="button" aria-pressed="false">ガイド OFF</button>
    <button id="pauseBtn" type="button" hidden>一時停止</button>
    <div class="dock" id="dock">
      <button id="bomb" type="button" aria-label="うんち">
        <span class="emoji" aria-hidden="true">💩</span>
        <span id="bombCount">×3</span>
      </button>
      <div id="slider" role="slider" aria-label="ゴンドラの高さ" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><div id="thumb"></div></div>
    </div>
  </div>
  <div id="titleMenu" hidden>
    <button id="easyBtn" type="button"><b>やさしい</b><small>ミスに やさしい</small></button>
    <button id="normalBtn" type="button"><b>ふつう</b><small>ほんらいの むずかしさ</small></button>
  </div>
  <div id="pauseMenu" role="dialog" aria-label="一時停止" hidden>
    <div class="menu">
      <h2>一時停止</h2>
      <div id="pauseMode"></div>
      <button id="resumeBtn" type="button">つづける</button>
      <button id="titleBtn" type="button">タイトルへ もどる</button>
    </div>
  </div>
</div>

<script>
(function () {
  var FINAL = 10, W = 360, H = 640, GROUND = 592, ESC_Y = 50, PX = 312, PY_MIN = 62, PY_MAX = 540, TI = 0, SC = 1, DPR = 1, HUD_H = 44;
  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');
  var stage = document.getElementById('stage');
  var probe = document.getElementById('probe');
  var FONT = "'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif";
  var BC = ['#ff5d73', '#ffd23f', '#3ddc97', '#5aa9ff'];

  var hiN = 0, hiE = 0, easy = false;
  try { hiN = +localStorage.getItem('ponpoko-hi') || 0; } catch (e) {}
  try { hiE = +localStorage.getItem('ponpoko-hi-easy') || 0; } catch (e) {}
  try { easy = localStorage.getItem('ponpoko-mode') === 'easy'; } catch (e) {}
  var hi = easy ? hiE : hiN;
  var guideOn = false;
  try { guideOn = localStorage.getItem('ponpoko-guide') === '1'; } catch (e) {}

  var paused = false, endT = 0, boomT = 0;
  var state = 'title', g = null, frame = 0, overT = 0, soundOn = true;
  var keys = { up: false, down: false, fireKey: false };
  var firePtrs = {}, dragId = null, dragY = 0, dragSv = 0, dragMoved = false, dragFiring = false;
  var fireCount = 0, fireQ = 0, bombQueued = false, sv = 0.5;

  /* ---------- layout ---------- */
  function layout() {
    var cw = stage.clientWidth || 360, ch = stage.clientHeight || 640;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    SC = cw / W;
    H = ch / SC;
    cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
    ctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0);
    TI = (probe.offsetHeight || 0) / SC;
    GROUND = H - 48;
    ESC_Y = TI + HUD_H + 24;
    PY_MIN = TI + HUD_H + 68;
    PY_MAX = GROUND - 30;
    setThumb();
  }

  /* ---------- sound ---------- */
  var ac = null;
  function beep(f1, f2, dur, type, vol) {
    if (!soundOn) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      var o = ac.createOscillator(), gn = ac.createGain(), t = ac.currentTime;
      o.type = type || 'square';
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
      gn.gain.setValueAtTime(vol || 0.04, t);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn); gn.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }

  /* ---------- game setup ---------- */
  function newGame() {
    g = { score: 0, lives: 5, stage: 0, py: (PY_MIN + PY_MAX) / 2, cool: 0, uid: 0,
      acorns: [], onigiri: [], crows: [], parts: [], pops: [], rings: [], eb: [], invT: 0, hurt: 0, fall: null, downT: 0, ammo: 16, bag: null, dryF: -999,
      onigiriLeft: 3, mode: 'down', quota: 0, spawned: 0, spawnT: 0,
      phase: 'intro', phaseT: 0, bonus: 0 };
    sv = 0.5; setThumb();
  }
  function startStage(n) {
    g.stage = n;
    g.mode = n % 2 === 1 ? 'down' : 'up';
    g.quota = Math.min(6 + 2 * n, 24);
    g.spawned = 0;
    g.spawnT = 40;
    g.crows = []; g.acorns = []; g.onigiri = []; g.eb = [];
    g.phase = 'intro'; g.phaseT = 110;
  }
  function saveHi() {
    if (g && g.score > hi) {
      hi = g.score; if (easy) hiE = hi; else hiN = hi;
      try { localStorage.setItem(easy ? 'ponpoko-hi-easy' : 'ponpoko-hi', String(hi)); } catch (e) {}
    }
  }
  function finishGame() {
    saveHi();
    g.phase = 'end'; g.crows = []; g.eb = [];
    state = 'ending'; endT = 70; boomT = 0;
    beep(520, 1040, 0.5, 'triangle', 0.06);
  }
  function startGame(mode) {
    lockPortrait();
    if (mode) { easy = mode === 'easy'; try { localStorage.setItem('ponpoko-mode', mode); } catch (e) {} }
    hi = easy ? hiE : hiN;
    paused = false; resetInputs();
    state = 'play';
    newGame();
    startStage(1);
    beep(520, 880, 0.15, 'square', 0.05);
  }

  var LAST_BL = [[-27, -104], [-9, -104], [9, -104], [27, -104], [-36, -86], [-18, -86], [0, -86], [18, -86], [36, -86], [-27, -68], [-9, -68], [9, -68], [27, -68], [-18, -50], [0, -50], [18, -50]];
  var LAST_BL_E = [[-27, -104], [-9, -104], [9, -104], [27, -104], [-36, -86], [-18, -86], [0, -86], [18, -86], [36, -86], [-18, -68], [0, -68], [18, -68]];
  var MID_BL = [[-17, -46], [17, -46], [0, -64]];
  var BOSS_BL = [[-18, -78], [0, -78], [18, -78], [-27, -60], [-9, -60], [9, -60], [27, -60], [-18, -42], [0, -42], [18, -42]];
  var LAYOUT = { 1: [[0, -28]], 2: [[-9, -28], [9, -28]], 3: [[-11, -26], [11, -26], [0, -42]] };
  function spawnCrow(boss) {
    var down = g.mode === 'down';
    var last = boss === 'last';
    var n = 1;
    var mid = false, bomb = false;
    if (!boss && g.stage >= 2 && !g.crows.some(function (q) { return q.bomb && q.st !== 'dead'; })) {
      bomb = Math.random() < Math.min(0.05 + 0.02 * g.stage, 0.14);
    }
    if (!boss && !bomb && g.stage >= 2 && !g.crows.some(function (q) { return q.mid && q.st === 'fly'; })) {
      mid = Math.random() < Math.min(0.1 + 0.03 * g.stage, 0.28);
    }
    if (!boss && !mid && !bomb) {
      var r = Math.random();
      var p3 = g.stage >= 4 ? Math.min(0.1 * (g.stage - 3), 0.4) : 0;
      var p2 = g.stage >= 2 ? Math.min(0.15 * g.stage, 0.45) : 0;
      n = r < p3 ? 3 : r < p3 + p2 ? 2 : 1;
    }
    var sc = last ? 3.6 : boss ? 3 : mid ? 1.6 : 1;
    var bx = boss ? 130 + Math.random() * 100 : 92 + Math.random() * 180;
    var src = last ? (easy ? LAST_BL_E : LAST_BL) : boss ? BOSS_BL : mid ? MID_BL : LAYOUT[n];
    var bl = src.map(function (p, i) { return { dx: p[0], dy: p[1], ci: i }; });
    var runY = GROUND - 6 - (sc - 1) * 17;
    g.crows.push({
      id: ++g.uid, bx: bx, x: (down || bomb) ? bx : -40 * sc, y: down ? TI + HUD_H + (boss ? 70 : 20) : runY,
      runY: runY, run: !down && !bomb, chute: down, bomb: bomb,
      t: Math.random() * 6, bal: bl.length, bl: bl, big: !!boss, last: last, mid: mid, bal0: bl.length, sc: sc, hitT: 0, warn: false,
      fireT: (boss ? 90 : 140) + Math.random() * 140, kbT: 0, anger: 0, angry: false, queue: 0, queueT: 0,
      col: Math.floor(Math.random() * 4),
      st: 'fly', vx: 0, vy: 0, rot: 0, chain: 0, steal: false
    });
    if (bomb) popup(bx, down ? TI + HUD_H + 50 : GROUND - 50, 'ばくだん！', '#ffd23f', 18);
    if (boss) { g.alert = 110; g.alertText = last ? 'ラスボスわんこ あらわる！' : 'ボスわんこ あらわる！'; beep(220, 110, 0.5, 'sawtooth', last ? 0.07 : 0.06); }
  }
  function balloonPos(c) {
    return c.bl.map(function (b) { return { x: c.x + b.dx, y: c.y + b.dy, b: b }; });
  }

  /* ---------- effects ---------- */
  var CONFETTI = ['#ff5d73', '#ffd23f', '#3ddc97', '#5aa9ff', '#ffffff', '#ff9ff3'];
  function addPart(x, y, vx, vy, life, col, r, shape) {
    if (g.parts.length > 700) return;
    g.parts.push({ x: x, y: y, vx: vx, vy: vy, life: life, max: life, col: col, r: r, shape: shape || 'c', rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.5 });
  }
  function ringFx(x, y, col, w, grow, life) { g.rings.push({ x: x, y: y, r: 4, life: life, max: life, col: col, w: w, grow: grow }); }
  function popFx(x, y, col, k) {
    k = k || 1;
    var i, a, s;
    for (i = 0; i < 16 * k; i++) { a = Math.random() * 6.283; s = 1.5 + Math.random() * 3.4 * k; addPart(x, y, Math.cos(a) * s, Math.sin(a) * s - 0.8, 28 + Math.random() * 16, col, 2.5 + Math.random() * 2.5, 'c'); }
    for (i = 0; i < 6 * k; i++) { a = Math.random() * 6.283; s = 2 + Math.random() * 3.5 * k; addPart(x, y, Math.cos(a) * s, Math.sin(a) * s, 22 + Math.random() * 8, i % 2 ? '#fff6b0' : '#ffffff', 4 + Math.random() * 3, 's'); }
    for (i = 0; i < 6 * k; i++) { a = Math.random() * 6.283; s = 1 + Math.random() * 2.6 * k; addPart(x, y, Math.cos(a) * s, Math.sin(a) * s - 1.2, 40 + Math.random() * 20, CONFETTI[Math.floor(Math.random() * CONFETTI.length)], 2.5 + Math.random() * 1.5, 'r'); }
    ringFx(x, y, '#ffffff', 5, 3.6, 16);
    ringFx(x, y, col, 9, 2.2, 13);
    g.shake = Math.max(g.shake || 0, 3 * k);
  }
  function bigBurst(x, y) {
    for (var n = 0; n < 5; n++) popFx(x + (Math.random() - 0.5) * 70, y + (Math.random() - 0.5) * 70, BC[n % 4], 2.2);
    ringFx(x, y, '#ffe066', 12, 6, 30); ringFx(x, y, '#ff5d73', 8, 4.5, 26); ringFx(x, y, '#ffffff', 6, 8, 20);
    g.shake = 16; g.flash = 14;
    beep(200, 900, 0.5, 'sawtooth', 0.05); beep(900, 1800, 0.3, 'triangle', 0.05);
  }
  function drawStar(x, y, r, col, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
    ctx.beginPath();
    for (var i = 0; i < 8; i++) {
      var rr = i % 2 ? r * 0.3 : r, a = i * Math.PI / 4;
      if (i === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fillStyle = col; ctx.fill();
    ctx.restore();
  }
  function popup(x, y, s, col, size) {
    var life = size >= 28 ? 80 : 60;
    g.pops.push({ x: x, y: y, s: s, life: life, max: life, col: col || '#fff', size: size || 22 });
  }
  function addScore(n, x, y) {
    g.score += n;
    var size = n >= 1000 ? 46 : n >= 400 ? 34 : n >= 200 ? 30 : n >= 100 ? 24 : 18;
    popup(x, y, '+' + n, n >= 1000 ? '#ff8fa3' : n >= 200 ? '#ffe066' : '#ffffff', size);
  }

  function knock(c, chain, x, y) {
    var px = x != null ? x : c.x, py = y != null ? y : c.y - 20;
    c.st = 'fall'; c.vy = 0; c.rot = 0; c.chain = chain; c.bal = 0; c.bl = [];
    if (c.last) {
      addScore(5000, px, py - 10);
      popup(px, py + 30, 'ラスボスげきは！', '#ffffff', 22);
      bigBurst(c.x, c.y - 50); bigBurst(c.x - 40, c.y - 20); bigBurst(c.x + 40, c.y - 70);

    ctx.globalAlpha = 1;
    ctx.restore();
    g.pops.forEach(function (p) {

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (paused && (k === ' ' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'x' || k === 'X')) { e.preventDefault(); return; }
    if (k === 'ArrowUp' || k === 'w' || k === 'W') { keys.up = true; e.preventDefault(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { keys.down = true; e.preventDefault(); }
    else if (k === ' ' || k === 'z' || k === 'Z') { e.preventDefault(); if (!tryStart(true)) keys.fireKey = true; }
    else if (k === 'x' || k === 'X') { e.preventDefault(); if (!tryStart(true)) bombQueued = true; }
    else if (k === 'Enter') { tryStart(true); }
    else if (k === 'Escape' || k === 'p' || k === 'P') { if (paused) setPaused(false); else setPaused(true); }
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.up = false;
    else if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = false;
    else if (k === ' ' || k === 'z' || k === 'Z') keys.fireKey = false;
  });
  window.addEventListener('blur', function () { keys.up = keys.down = keys.fireKey = false; fireCount = 0; });

  firePtrs = {};
  function fireUp(e) {
    if (firePtrs[e.pointerId]) { delete firePtrs[e.pointerId]; fireCount = Math.max(0, fireCount - 1); }
  }
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    if (tryStart()) return;
    if (!firePtrs[e.pointerId]) { firePtrs[e.pointerId] = 1; fireCount++; }
    fireQ = 8;
  });
  cv.addEventListener('pointerup', fireUp);
  cv.addEventListener('pointercancel', fireUp);
  cv.addEventListener('lostpointercapture', fireUp);
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* スライダー: タップで発射、12px以上ドラッグすると相対移動（指を置いた位置へジャンプしない） */
  dragId = null; dragY = 0; dragSv = 0; dragMoved = false; dragFiring = false;
  function stopSliderFire() {
    if (dragFiring) { dragFiring = false; fireCount = Math.max(0, fireCount - 1); }
  }
  slider.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var started = tryStart();
    dragId = e.pointerId; dragY = e.clientY; dragSv = sv; dragMoved = false;
    try { slider.setPointerCapture(e.pointerId); } catch (err) {}
    if (!started) { dragFiring = true; fireCount++; fireQ = 8; }
  });
  slider.addEventListener('pointermove', function (e) {
    if (dragId !== e.pointerId) return;
    var dy = e.clientY - dragY;
    if (!dragMoved && Math.abs(dy) > 12) { dragMoved = true; stopSliderFire(); }
    if (dragMoved) {
      var span = Math.max(1, slider.getBoundingClientRect().height - 52);
      var adj = dy > 0 ? dy - 12 : dy + 12;
      sv = Math.max(0, Math.min(1, dragSv + adj / span));
      setThumb();
    }
  });
  function sliderUp(e) { if (dragId === e.pointerId) { dragId = null; stopSliderFire(); } }
  slider.addEventListener('pointerup', sliderUp);
  slider.addEventListener('pointercancel', sliderUp);
  slider.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  bombBtn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    bombBtn.classList.add('hot');
    if (!tryStart()) bombQueued = true;
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) {
    bombBtn.addEventListener(n, function () { bombBtn.classList.remove('hot'); });
  });
  bombBtn.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  document.getElementById('easyBtn').addEventListener('click', function () { if (state === 'title') startGame('easy'); });
  document.getElementById('normalBtn').addEventListener('click', function () { if (state === 'title') startGame('normal'); });
  pauseBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  pauseBtn.addEventListener('click', function () { setPaused(true); });
  document.getElementById('resumeBtn').addEventListener('click', function () { setPaused(false); });
  document.getElementById('titleBtn').addEventListener('click', toTitle);
  pauseMenu.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  try {
    var land = window.matchMedia('(orientation: landscape) and (pointer: coarse) and (max-height: 600px)');
    var onLand = function () { if (land.matches) setPaused(true); };
    if (land.addEventListener) land.addEventListener('change', onLand); else if (land.addListener) land.addListener(onLand);
  } catch (e) {}
  function lockPortrait() {
    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(function () {}); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) setPaused(true); });
  var muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  muteBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    muteBtn.textContent = soundOn ? 'おと ON' : 'おと OFF';
    muteBtn.setAttribute('aria-pressed', soundOn ? 'false' : 'true');
  });

  var guideBtn = document.getElementById('guide');
  function syncGuide() {
    guideBtn.textContent = guideOn ? 'ガイド ON' : 'ガイド OFF';
    guideBtn.setAttribute('aria-pressed', guideOn ? 'true' : 'false');
  }
  guideBtn.addEventListener('click', function () {
    guideOn = !guideOn;
    try { localStorage.setItem('ponpoko-guide', guideOn ? '1' : '0'); } catch (e) {}
    syncGuide();
  });
  syncGuide();

  window.addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
  layout();
  if (document.fonts && document.fonts.load) { document.fonts.load('16px DotGothic16').catch(function () {}); }
  requestAnimationFrame(loop);
})();
</script>

</body></html>
