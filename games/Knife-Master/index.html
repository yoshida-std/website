<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ナイフマスター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* 横向き専用。canvas は 480x270 の論理サイズで描いて画面に合わせて拡大。操作パッドは DOM（pointer イベント） */
:root{--font:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;
  -webkit-touch-callout:none;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;background:#000;color:#fff;font-family:var(--font);font-weight:700}
button{touch-action:manipulation;font-family:var(--font);font-weight:800;cursor:pointer}
img{-webkit-user-drag:none}
canvas,.pad,.pbtn{touch-action:none}
[hidden]{display:none!important}
/* 画面を縦に 2:1 に分ける。上 4/5 = ゲーム画面、下 1/5 = ボタン（重ならない） */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{flex:4 1 0;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
#ctl{flex:1 1 0;min-height:0;position:relative;background:linear-gradient(#1c1c26,#0b0b10);border-top:2px solid #3a3a4a}
#cv{display:block;image-rendering:pixelated;background:#000}
/* 操作パッド */
.pad{position:absolute;bottom:max(7px,env(safe-area-inset-bottom,0px));z-index:5}
#dpad{left:max(14px,env(safe-area-inset-left,0px));width:min(40vw,280px);height:min(16vh,64px);display:flex;border-radius:999px;
  background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35)}
#dpad i{flex:1;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:min(5vh,22px);color:rgba(255,255,255,.7);pointer-events:none}
#dpad.l i:first-child,#dpad.r i:last-child{color:#ffd23c}
#acts{right:max(14px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-end}
.pbtn{width:min(14vh,58px);height:min(14vh,58px);border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);font-size:min(3.4vh,13px);color:#fff;text-align:center;line-height:1.1}
#bA{left:calc(50% + 46px);border-color:rgba(120,220,255,.7);background:rgba(80,180,240,.25)}   /* ポーズの右。下段ナイフから離す */
#bA,#bL,#bT{font-size:min(3.4vh,13px)}
#bT{width:min(16vh,66px);height:min(16vh,66px);background:rgba(240,90,40,.35);border-color:rgba(255,160,100,.8)}
.pbtn.cool{opacity:.4}
.pbtn.on{background:rgba(255,210,60,.55)}
#pauseBtn{position:absolute;left:50%;bottom:max(7px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;
  width:42px;height:30px;border-radius:9px;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.4);color:#fff;font-size:14px;padding:0}
/* 画面（メニュー） */
#overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);padding:10px;box-sizing:border-box}
.card{max-height:100%;overflow-y:auto;touch-action:pan-y;text-align:center;box-sizing:border-box;padding:6px 14px;max-width:520px;width:100%}
.card h1{margin:0;font-size:clamp(28px,9vh,46px);line-height:1.1;color:#ffb030;letter-spacing:.04em;text-shadow:3px 3px 0 #a02000}
.card h2{margin:0 0 4px;font-size:clamp(24px,8vh,38px);color:#ffb030;text-shadow:3px 3px 0 #a02000}
.card p{margin:6px 0;font-size:13px;line-height:1.6;color:#dde}
.card.noscroll{overflow:hidden;touch-action:none}
.row{display:flex;gap:10px;justify-content:center}
.row .btn{margin:8px 0 0;width:auto;flex:1;max-width:230px}
@media (max-height:430px){
  .card h2{font-size:24px;margin:0 0 2px}
  .card p{margin:3px 0;font-size:12px;line-height:1.45}
  .card .sc{font-size:11px;line-height:1.6}
  .row .btn{padding:8px 8px;font-size:15px;margin-top:6px}
  .row .btn.sub{font-size:13px}
  .card .copy{margin-top:6px}
}
.card .en{margin:2px 0 0;letter-spacing:.4em;color:#7cf08a;font-size:12px;text-shadow:0 1px 3px #000}
/* タイトル画面: 画像を全面に敷き、上にタイトル、下にボタン */
#overlay.title{background:#000 url(title.jpg) center 35%/cover no-repeat;padding:0}
#overlay.title::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 62%,rgba(0,0,0,.78))}
#overlay.title .card{position:relative;height:100%;max-width:none;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;padding:max(6px,env(safe-area-inset-top,0px)) 14px max(6px,env(safe-area-inset-bottom,0px))}
.tTop{display:flex;justify-content:center}
.logo{height:min(38vh,150px);width:auto;max-width:60vw;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.65));-webkit-user-drag:none;pointer-events:none}
.tBot{display:flex;flex-direction:column;align-items:center}
.tBtns{display:flex;gap:10px;justify-content:center}
.tBtns .btn{margin:0;width:auto;padding:6px 18px;font-size:14px;border-width:2px;border-radius:10px;box-shadow:0 3px 0 #8a2a08}
.tBtns .btn.sub{font-size:12px;padding:6px 14px;box-shadow:0 3px 0 #141a38}
.tInfo{margin:6px 0 0!important;font-size:10px!important;color:#fff!important;text-shadow:0 1px 3px #000;white-space:nowrap}
.tCopy{margin-left:12px;color:#ddd}
.card .sc{font-family:"Press Start 2P",monospace;font-size:13px;color:#7cf08a;line-height:1.9}
.rules{display:inline-block;text-align:left;font-size:12px;line-height:1.7;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:600}
.rules b{color:#ffd23c}
.btn{display:block;width:min(240px,100%);margin:8px auto 0;padding:12px 10px;font-size:17px;border-radius:12px;border:3px solid #ffd7a0;background:#e8541c;color:#fff;box-shadow:0 4px 0 #8a2a08}
.btn.sub{background:#2b3560;border-color:#8a96d0;box-shadow:0 4px 0 #141a38;font-size:14px;padding:9px 10px}
.copy{margin-top:12px;font-size:11px;color:#9aa}
#rotate{position:absolute;inset:0;z-index:20;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-size:18px;line-height:1.8}
#rotate span{font-size:54px;display:block}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="ctl">
  <div id="dpad" class="pad" hidden><i>◀</i><i>▶</i></div>
  <div id="bA" class="pad pbtn" hidden>仲間<br>を呼ぶ</div>
  <div id="acts" class="pad" hidden>
    <div id="bL" class="pbtn">下段<br>ナイフ</div>
    <div id="bT" class="pbtn">上段<br>ナイフ</div>
  </div>
  <button id="pauseBtn" hidden>Ⅱ</button>
  </div>
  <div id="overlay" class="menu"><div class="card" id="card"></div></div>
  <div id="rotate"><div><span>📱↻</span>スマホを横向きにしてね</div></div>
</div>
<script>
/* ===== スマホ向け: 拡大・ピンチ・スクロール・長押しの抑止 ===== */
(()=>{
  const KEEP='button,.menu';
  document.addEventListener('touchstart',e=>{if(e.touches.length>1||!e.target.closest(KEEP))e.preventDefault();},{passive:false});
  let last=0;
  document.addEventListener('touchend',e=>{const t=Date.now();if(t-last<350&&!e.target.closest(KEEP))e.preventDefault();last=t;},{passive:false});
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('touchmove',e=>{if(!e.target.closest('.card'))e.preventDefault();},{passive:false});
})();

/* ===== 基本設定 ===== */
const W=480,H=200,GY=212,TOPY=-50;    // 論理サイズ / 地面（足元）のY（世界の座標）/ 世界を上へずらす量。スコア欄はゲーム画面の上に重ねる
const LEN=900;                         // ステージの長さ（世界の幅）。右（論理上）の端に上の階への階段がある
const GR=520, SPD=150;                 // 重力 / 歩く速さ（逃げ足は速い）
const TIMELIM=99, STAGES=5;
const EHP=12, EREC=.3;                  // 敵のライフ（全ステージ共通で持ち越し）/ 次のステージへ行くときに回復する割合
const cv=document.getElementById('cv'), cx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const BEST_KEY='knifemaster_best';
let best=0;
try{best=+(localStorage.getItem(BEST_KEY)||0);}catch(e){}
const G={eHP:EHP,state:'title',score:0,stage:1,time:TIMELIM,t:0,sound:true,shake:0,msg:''};
let P,E,camX=0,knives=[],parts=[];
const inp={l:false,r:false,jump:false,throw:false,low:false};

/* ===== 画面サイズ ===== */
let S=1;
function resize(){
  const r=$('stage').getBoundingClientRect();
  const sc=Math.max(.1,Math.min(r.width/W,r.height/H));
  S=clamp(Math.ceil(sc*(devicePixelRatio||1)),1,4);
  cv.width=W*S;cv.height=H*S;
  cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px';
}
addEventListener('resize',resize);resize();

/* ===== 音（WebAudio。スタートボタンを押したときに作る） ===== */
let ac=null;
function initAudio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
}
function tone(f,d,type='square',v=.06,slide=0,delay=0){
  if(!ac||!G.sound)return;
  const t0=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);
  g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+.02);
}
const SND={
  throw:()=>tone(900,.08,'square',.04,-500),
  jump:()=>tone(300,.12,'square',.04,300),
  hit:()=>{tone(420,.1,'sawtooth',.07,-250);tone(120,.12,'square',.06,-60,.02);},
  hurt:()=>{tone(200,.28,'sawtooth',.09,-140);},
  dodge:()=>tone(1200,.05,'triangle',.03,200),
  wind:()=>tone(500,.2,'triangle',.03,300),
  win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.16,'square',.05,0,i*.13)),
  lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.22,'triangle',.07,0,i*.2)),
  go:()=>{tone(660,.1,'square',.05);tone(880,.18,'square',.05,0,.12);}
};
/* ===== BGM（bgm.mp3。ゲーム開始から流れ、ステージをまたいでつづく。ポーズ・ゲームオーバー・クリア・タイトルでは止まる）===== */
let bgm=null,bgmWanted=false;
function bgmStart(fromTop){
  if(!bgm){bgm=new Audio('bgm.mp3');bgm.loop=true;bgm.volume=.5;bgm.preload='auto';}
  bgm.muted=!G.sound;bgmWanted=true;
  if(fromTop)try{bgm.currentTime=0;}catch(e){}
  const pr=bgm.play();if(pr&&pr.catch)pr.catch(()=>{});
}
function bgmStop(){bgmWanted=false;if(bgm)bgm.pause();}
function bgmPauseOnly(){if(bgm)bgm.pause();}
function bgmResume(){if(bgm&&bgmWanted){bgm.muted=!G.sound;const pr=bgm.play();if(pr&&pr.catch)pr.catch(()=>{});}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(G.state==='play')pause();if(ac)ac.suspend();bgmPauseOnly();}
  else if(ac&&G.sound){ac.resume();if(G.state!=='pause')bgmResume();}
});

/* ===== ステージ設定 ===== */
const PAL_P={gi:'#3a5cf0',sleeve:'#3a5cf0',pants:'#f4f4f4',belt:'#ffffff',skin:'#f8b878',hair:'#2030a0',shoe:'#202040'};
const STG=[
  {wall:'#4878f8',belt:'#f8d820'},{wall:'#7a5cd0',belt:'#58d854'},{wall:'#2e9a78',belt:'#f87820'},
  {wall:'#c85050',belt:'#40a0ff'},{wall:'#34345c',belt:'#f83030'}
];
function cfg(n){return{
  hp:6+2*(n-1), spd:110+7*(n-1), cdBase:1.1-0.12*(n-1),
  dodgeP:0.2+0.1*(n-1), swatP:0.3+0.1*(n-1), aggr:0.6+0.3*(n-1), armor:n>=3,
  pal:{gi:'#f6f6f6',sleeve:'#1a1a1a',pants:'#f6f6f6',belt:STG[n-1].belt,skin:'#f8b878',hair:'#161616',shoe:'#202020'}
};}

/* ===== ラウンド開始 ===== */
function goalX(){return G.stage===STAGES?LEN-100:LEN-140;}   // 敵がここまで来たら（階段のふもと／最上階は女性の前）
function EDGE(){return G.stage===STAGES?LEN-90:LEN-12;}   // 行き止まりの位置（最上階は椅子の手前）
function newPlayer(hp){return{hidden:true,lock:0,low:false,bufT:0,pT:false,pL:false,x:530,z:0,vz:0,hp,face:-1,cd:0,inv:0,hurt:0,kb:0,walk:0,moving:false,throwT:0,dead:false};}
function startRound(){
  if(!bgmWanted)bgmStart(false);                    // 2ステージ目以降もBGMはつづく
  const c=cfg(G.stage);
  camX=0;knives=[];parts=[];G.time=TIMELIM;G.shake=0;G.trick=false;G.cap={hits:0,fly:false,x:0,y:0,vx:0,vy:0,hit:0,rs:-1,stand:false,wx:0};
  P=newPlayer(1);
  E={x:-75,z:0,vz:0,vx:0,face:1,hp:G.eHP,max:EHP,c,st:'walk',t:0,at:0,cd:1.2,dodgeCd:0,noStun:0,walk:0,hitDone:false,dead:false};
  G.ally=null;G.state='intro';G.it=0;G.fightT=0;G.msg='';   // 開始演出: 敵が登場 → 敵に合わせてスクロール → 自機が登場 → そのままスタート
  hideOverlay();showControls(true);SND.go();
}
function startGame(){initAudio();bgmStart(true);G.score=0;G.stage=1;G.eHP=EHP;G.allyUsed=false;P=null;startRound();}

/* ===== 入力 ===== */
const keys={};
function setKey(e,v){
  const k=e.code;let h=true;
  if(k==='ArrowLeft'||k==='KeyA')inp.l=v;
  else if(k==='ArrowRight'||k==='KeyD')inp.r=v;
  else if(k==='ArrowDown'||k==='KeyX'||k==='KeyK')inp.low=v;
  else if(k==='KeyC'||k==='KeyV'){if(v)callAlly();}
  else if(k==='KeyZ'||k==='Space'||k==='KeyJ')inp.throw=v;
  else h=false;
  if(h)e.preventDefault();
}
addEventListener('keydown',e=>{
  if(e.code==='KeyP'||e.code==='Escape'){if(G.state==='play')pause();else if(G.state==='pause')resume();return;}
  if(e.code==='Enter'){const b=document.querySelector('#card .btn');if(b&&!$('overlay').hidden)b.click();}
  setKey(e,true);
});
addEventListener('keyup',e=>setKey(e,false));
addEventListener('blur',()=>{inp.l=inp.r=inp.jump=inp.throw=inp.low=false;});

(()=>{
  const dp=$('dpad');
  const set=e=>{const r=dp.getBoundingClientRect(),f=(e.clientX-r.left)/r.width;inp.l=f<.47;inp.r=f>.53;dp.classList.toggle('l',inp.l);dp.classList.toggle('r',inp.r);};
  const off=()=>{inp.l=inp.r=false;dp.classList.remove('l','r');};
  dp.addEventListener('pointerdown',e=>{dp.setPointerCapture(e.pointerId);set(e);});
  dp.addEventListener('pointermove',e=>{if(dp.hasPointerCapture(e.pointerId))set(e);});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>dp.addEventListener(t,off));
  const bind=(el,key)=>{
    el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);inp[key]=true;el.classList.add('on');});
    const up=()=>{inp[key]=false;el.classList.remove('on');};
    ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,up));
  };
  bind($('bT'),'throw');bind($('bL'),'low');
  $('bA').addEventListener('pointerdown',e=>{e.preventDefault();callAlly();});
})();
function showControls(v){$('dpad').hidden=!v;$('acts').hidden=!v;$('pauseBtn').hidden=!v;$('bA').hidden=!v;}

/* ===== メニュー ===== */
const COPY='<p class="copy">©YoshidaStudio, ©PANICPUMPKIN</p>';
function showOverlay(html,scroll){$('overlay').classList.remove('title');$('card').classList.toggle('noscroll',!scroll);$('card').innerHTML=html;$('overlay').hidden=false;$('card').scrollTop=0;}   // scroll=true の画面（あそびかた）だけスクロールできる
function hideOverlay(){$('overlay').hidden=true;}
function sc6(n){return String(n).padStart(6,'0');}
function showTitle(){
  G.state='title';showControls(false);bgmStop();
  showOverlay(`<div class="tTop"><img class="logo" src="logo.webp" alt="ナイフマスター" draggable="false"></div>
  <div class="tBot">
   <div class="tBtns"><button class="btn" data-act="start">ゲームスタート</button><button class="btn sub" data-act="howto">あそびかた</button></div>
   <p class="tInfo">ベストスコア ${sc6(best)}<span class="tCopy">${COPY.replace(/<[^>]+>/g,'')}</span></p>
  </div>`);
  $('overlay').classList.add('title');                   // タイトル画像（title.jpg）を背景にする
}
function showHowto(){
  showOverlay(`<h2>あそびかた</h2>
  <button class="btn sub" data-act="title" style="margin:2px auto 6px">もどる</button>
  <div class="rules">
   <div><b>めざせ</b> 主人公をたおせ！ 追いつめられるのは${STAGES}ステージ目まで</div>
   <div><b>戦い方</b> ナイフ使いは近づかれると弱い。<b>きょりをとって</b>ナイフを投げよう（ジャンプはなし）</div>
   <div><b>むき</b> 左右キーで自分の向きがかわる。<b>ナイフボタンを押すと、敵の方向を自動で向いて</b>投げる</div>
   <div><b>ナイフ</b> <b>上段</b>（立って投げる）と<b>下段</b>（しゃがんで投げる）。<b>投げている間は動けない</b>。近いと投げるのがおそい</div>
   <div><b>むき</b> ステージによって、敵が来る向き（左／右）がかわる</div>
   <div><b>よけ</b> 相手がしゃがんだら<b>下段</b>。ジャンプでよけたら着地を待とう</div>
   <div><b>仲間</b> ゲーム中<b>1回だけ</b>「仲間を呼ぶ」。敵にまとわりついて<b>最大2秒止めて</b>、ライフもへらす。敵にはらわれることも</div>
   <div><b>かち</b> 敵を<b>たおせば</b>ゲームクリア！ 敵のライフはステージをこえて持ち越し</div>
   <div><b>階段</b> 敵が階段にたどりつくと のぼられて次のステージへ（敵のライフは少し回復）</div>
   <div><b>まけ</b> 最上階（ステージ5）で<b>女性</b>にたどりつかれたら負け</div>
   <div><b>やられたら</b> <b>1回あたっただけでアウト</b>！ 画面の下に落とされる。敵にはライフがある</div>
   <div><b>じかん</b> ${TIMELIM}びょうで決着をつけよう</div>
  </div>
  <p style="font-size:11px;color:#9ab">キー: ←→ いどう・むき / Z 上段 / X 下段 / C 仲間 / P ポーズ</p>
  <button class="btn" data-act="title">もどる</button>`,true);
}
function pause(){
  if(G.state!=='play'&&G.state!=='intro')return;
  bgmPauseOnly();
  G.prev=G.state;G.state='pause';inp.l=inp.r=inp.jump=inp.throw=inp.low=false;
  showOverlay(`<h2>ポーズ</h2>
  <div class="row"><button class="btn" data-act="resume">つづける</button></div>
  <div class="row"><button class="btn sub" data-act="snd">おと: ${G.sound?'ON':'OFF'}</button><button class="btn sub" data-act="title">タイトルへ</button></div>`);
}
function resume(){G.state=G.prev||'play';hideOverlay();if(ac&&G.sound)ac.resume();bgmResume();}
function saveBest(){if(G.score>best){best=G.score;try{localStorage.setItem(BEST_KEY,best);}catch(e){}return true;}return false;}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='start')startGame();
  else if(a==='resume')resume();
  else if(a==='snd'){G.sound=!G.sound;if(bgm)bgm.muted=!G.sound;b.textContent='おと: '+(G.sound?'ON':'OFF');if(G.sound)initAudio();}
  else if(a==='title'){showTitle();}
  else if(a==='howto'){showHowto();}
  else if(a==='next'){G.stage++;G.eHP=Math.min(EHP,G.eHP+EHP*EREC);startRound();}   // 敵のライフは少し回復
  else if(a==='retry'){startGame();}
});
$('pauseBtn').addEventListener('click',pause);

/* ===== 判定ヘルパー ===== */
// 主人公（敵）の当たり：しゃがむと頭の位置がさがる
function eTop(){return E.st==='crouch'||E.st==='wind'||(E.st==='combo'&&E.kind==='sweep')?28:46;}
function spark(x,y,c,n=8){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*160,vy:-Math.random()*120-20,t:.35+Math.random()*.2,c});}

/* ===== プレイヤー ===== */
function canThrow(){return P.cd<=0&&P.lock<=0&&!knives.some(k=>k.mine);}   // ナイフは画面に1本だけ
function tryThrow(low){
  if(!canThrow())return false;
  P.face=E.x>=P.x?1:-1;                       // ナイフボタンを押すと、敵の方向を自動で向いて投げる
  const close=Math.abs(E.x-P.x)<46;           // 近いとナイフがおそい（近距離に弱い）
  P.lock=close?.55:.3;                        // 投げている間は動けない
  P.cd=close?1.4:1.0;P.throwT=P.lock;P.low=low;   // 1本投げたら、次を投げられるまで時間がかかる
  knives.push({x:P.x+P.face*12,y:GY-P.z-(low?10:36),vx:P.face*320,d:0,a:0,mine:true,seen:false,low});
  SND.throw();return true;
}
function hurtPlayer(dmg,dir,heavy){
  if(P.dead)return;
  P.hp=0;P.lock=0;P.throwT=0;P.inv=0;P.hurt=9;   // 1回あたったらアウト
  P.kb=dir*(heavy?120:50);P.vz=heavy?210:150;     // はね飛ばされて、画面の下へ落ちていく
  G.shake=heavy?.4:.2;
  spark(P.x,GY-P.z-28,'#ffd23c',12);spark(P.x,GY-P.z-28,'#ff6040',12);
  SND.hurt();lose('HIT');
}
function updPlayer(dt){
  const p=P;
  p.cd-=dt;p.inv-=dt;p.throwT-=dt;p.lock-=dt;
  // 連射はできない: ボタンを押した瞬間だけ受けつける（0.25秒だけ先行入力）
  const pressL=inp.low&&!p.pL,pressT=inp.throw&&!p.pT;p.pL=inp.low;p.pT=inp.throw;
  if(pressL||pressT){p.bufT=.25;p.bufLow=pressL;}
  p.bufT-=dt;
  if(p.hurt>0){p.hurt-=dt;p.x+=p.kb*dt;p.kb*=Math.pow(.04,dt);p.moving=false;}
  else if(G.state==='play'&&!p.dead){
    if(p.lock>0){p.moving=false;}
    else{
      const mv=((inp.r?1:0)-(inp.l?1:0))*(mirror()?-1:1);   // 反転ステージでは画面の左右が逆
      p.x+=mv*SPD*dt;p.moving=mv!==0;p.walk+=mv?dt:0;
      if(mv)p.face=mv;                      // 向きは左右キーで決まる
      if(p.bufT>0&&tryThrow(p.bufLow))p.bufT=0;
    }
  }else if(G.state==='win'){                  // 勝ったら、その場でバンザイしながらはねる
    p.moving=false;if(p.z===0&&p.vz===0)p.vz=105;
  }else if(G.state==='intro'){                // 画面の外から走って入ってくる
    if(!p.hidden){p.x-=SPD*dt;p.walk+=dt;p.moving=true;p.face=-1;}else p.moving=false;
  }else p.moving=false;
  if(p.dead||p.z>0||p.vz>0){p.vz-=GR*dt;p.z+=p.vz*dt;if(!p.dead&&p.z<=0){p.z=0;p.vz=0;}}   // やられたら床も抜けて落ちる
  p.x=clamp(p.x,camX+14,LEN-26);          // スクロールの終わりで行き止まり（最上階も女性の後ろまでまわりこめる）
}

/* ===== ナイフ ===== */
function updKnives(dt){
  for(const k of knives){
    k.x+=k.vx*dt;k.d+=Math.abs(k.vx)*dt;k.a+=dt*30;
    // 主人公のよけ判定（ナイフが近づいたら一度だけ）
    const dx=E.x-k.x;
    if(!k.seen&&k.vx*dx>0&&Math.abs(dx)<105&&Math.abs(dx)>34){
      k.seen=true;
      if(E.st==='walk'&&E.dodgeCd<=0&&Math.random()<E.c.dodgeP){
        E.dodgeCd=1.3;E.at=0;SND.dodge();
        if(k.low){E.st='jump';E.vz=240;E.vx=0;}          // 下段ナイフ → ジャンプでよける
        else{E.st='crouch';E.t=.5;}                     // 上段ナイフ → しゃがんでよける
      }
    }
    // 命中
    if(!E.dead&&Math.abs(k.x-E.x)<10){
      const top=GY-E.z-eTop(),bot=GY-E.z;
      if(k.y>=top-3&&k.y<=bot+3){
        k.dead=true;E.hp--;G.score+=100;spark(k.x,k.y,'#fff',8);spark(k.x,k.y,'#ffd23c',6);SND.hit();
        if(E.hp<=0){E.hp=0;win();}
        else if(E.noStun<=0&&E.st!=='held'&&!(E.c.armor&&(E.st==='dash'||E.st==='wind'))){
          E.st='hurt';E.t=.18;E.noStun=1.4;E.vx=0;
        }
      }
    }
    // 最上階: ナイフは女性にも当たる（3発で裏技の勝利）
    if(!k.dead&&G.stage===STAGES&&!G.cap.fly&&k.x>LEN-80&&k.x<LEN-52&&GY-k.y>-2&&GY-k.y<44){
      k.dead=true;G.cap.hits++;G.cap.hit=.25;spark(k.x,k.y,'#ffd23c',6);SND.hit();
      if(G.cap.hits>=3)win(true);
    }
    if(k.d>340||k.x<camX-40||k.x>camX+W+40)k.dead=true;
  }
  knives=knives.filter(k=>!k.dead);
}

/* ===== 主人公（敵）AI ===== */
function vOverlap(aBot,aTop,bBot,bTop){return aBot<bTop&&aTop>bBot;}
function updEnemy(dt){
  const e=E,c=e.c,dx=P.x-e.x,ad=Math.abs(dx);
  e.cd-=dt;e.dodgeCd-=dt;e.noStun-=dt;e.t-=dt;
  if(e.dead){e.x+=e.kbv*dt;e.vz-=GR*dt;e.z+=e.vz*dt;return;}
  if(G.state==='climb'){                       // 階段をのぼって、てっぺんの扉に消える
    e.face=1;e.x=Math.min(e.x+115*dt,LEN-16);e.walk+=dt*5;
    const i=clamp(Math.floor((e.x-(LEN-140))/16),-1,6);e.z=i>=0?(i+1)*12:0;e.vz=0;   // 踏み板の高さ（最上段は踊り場）
    if(e.x>=LEN-24)e.hidden=true;                                                       // 扉の中へ入って消える
    return;
  }
  const airborne=e.z>0||e.vz>0;
  if(airborne){e.vz-=GR*dt;e.z+=e.vz*dt;if(e.z<=0){e.z=0;e.vz=0;}}
  if(e.st!=='dash'&&e.st!=='hurt')e.face=(ad<90||dx>=0)?(dx>=0?1:-1):1;
  if(G.ally&&((e.st==='combo'&&e.tgtAlly)||e.st==='held'))e.face=G.ally.x>=e.x?1:-1;   // 近くの自分の方を向く。遠ければゴールの方
  if(G.state==='intro'){            // 画面の外から歩いて入ってくる（そのままゴールに向かって歩き続ける）
    e.x+=c.spd*dt;e.walk+=dt*c.spd/22;e.face=1;
    return;
  }
  if(G.state!=='play'||P.dead){return;}
  switch(e.st){
    case 'walk':{
      e.x+=c.spd*dt;e.walk+=dt*c.spd/22;       // 敵はいつも階段（最上階は女性）に向かって進む。自分が前にいても通りぬける
      const A=G.ally;                              // 仲間が近づいてきたら、はらいのけようとすることがある
      if(A&&A.st==='walk'&&e.cd<=0&&Math.abs(A.x-e.x)<54){
        if(A.swat===undefined)A.swat=Math.random()<c.swatP;
        if(A.swat){e.st='combo';e.kind=Math.random()<.5?'jab':'sweep';e.n=1;e.at=0;e.hitDone=false;e.tgtAlly=true;A.swat=false;}
      }
      if(e.st==='walk'&&e.cd<=0&&ad<56){
        e.tgtAlly=false;
        const r=Math.random(),kk=.22+.04*G.stage;
        if(ad<36&&r>kk+.3){                       // パンチ連打
          e.st='combo';e.kind='jab';e.n=2+Math.floor(Math.random()*(1+Math.ceil(G.stage/2)));e.at=0;e.hitDone=false;
        }else if(r>kk){                           // 足払い連打（しゃがんで下を蹴る）
          e.st='combo';e.kind='sweep';e.n=1+Math.floor(Math.random()*2)+(G.stage>=3?1:0);e.at=0;e.hitDone=false;
        }else{e.st='wind';e.t=.45;SND.wind();}   // 真上に飛ぶ飛び蹴り
      }
      break;}
    case 'combo':{
      const T=e.kind==='jab'?{w:.24,a:.34,r:.46,reach:40}:{w:.3,a:.42,r:.56,reach:50};
      e.at+=dt;
      const lo=e.kind==='jab'?[18,36]:[0,9];
      if(G.ally&&G.ally.st==='walk'&&e.at>T.w&&e.at<T.a&&Math.abs(G.ally.x-e.x)<T.reach){flingAlly(G.ally.x>=e.x?1:-1);}   // 仲間をはらいのけた
      if(e.at>T.w&&e.at<T.a&&!e.hitDone&&ad<T.reach&&vOverlap(P.z,P.z+(P.low&&P.lock>0?30:44),e.z+lo[0],e.z+lo[1])){e.hitDone=true;hurtPlayer(1,e.face,false);}
      if(e.at>=T.r){
        e.n--;e.at=0;e.hitDone=false;
        if(e.n<=0||ad>T.reach+8){e.st='walk';e.cd=c.cdBase;e.tgtAlly=false;}
      }
      break;}
    case 'held':                                       // 仲間にまとわりつかれて動けない。ライフもへっていく
      e.walk+=dt*10;e.hp-=ALLYDRAIN*dt;
      if(e.hp<=0){e.hp=0;win();}
      break;
    case 'wind':
      if(e.t<=0){e.st='dash';e.vz=250;e.vx=0;e.hitDone=false;}
      break;
    case 'dash':   // 真上に飛んで、落ちながら蹴る
      if(!e.hitDone&&e.vz<40&&e.z<44&&ad<50&&vOverlap(P.z,P.z+44,e.z+6,e.z+34)){e.hitDone=true;hurtPlayer(3,e.face,true);}
      if(e.z<=0&&e.vz===0){e.st='rest';e.t=.55;}
      break;
    case 'jump':
      if(e.z<=0&&e.vz===0){e.st='walk';e.cd=Math.max(e.cd,.25);}
      break;
    case 'crouch':
      if(e.t<=0){e.st='walk';e.cd=Math.max(e.cd,.2);}
      break;
    case 'rest':
      if(e.t<=0){e.st='walk';e.cd=c.cdBase*.6;}
      break;
    case 'hurt':
      e.x-=e.face*70*dt;
      if(e.t<=0){e.st='walk';e.cd=Math.max(e.cd,.3);}
      break;
  }
  e.x=clamp(e.x,camX-10,EDGE()-2);
  if(G.state==='play'&&e.x>=goalX()&&!P.dead){            // 敵がゴールに着いた
    if(G.stage>=STAGES)lose('GOAL');                     // 最上階: 女性にたどりつかれたら負け
    else climb();                                         // 階段を使われたら、次のステージへ持ち越し
  }
}

/* ===== 勝ち負け ===== */
/* ===== 仲間（ゲーム中1度だけ呼べる）===== */
const ALLYSPD=230;                         // 仲間の走る速さ（自機の逃げ足150より速い）
const ALLYDRAIN=.5, ALLYHOLD=2;            // まとわりついている間に敵のライフがへる速さ（/秒）/ まとわりつく最大の秒数
const PAL_A={gi:'#c63ca8',sleeve:'#c63ca8',pants:'#8cc8f0',belt:'#8cc8f0',skin:'#f8c8a0',hair:'#f8c040',shoe:'#6aa0d0'};
function callAlly(){
  if(G.state!=='play'||G.allyUsed||G.ally||!P||P.dead)return;
  G.allyUsed=true;SND.go();
  G.ally={x:camX+W+24,z:0,vz:0,vx:0,face:-1,st:'walk',walk:0,t:0,side:1,swat:undefined};   // 自機が登場したのと同じ側（画面のはし）から
}
function flingAlly(dir){                     // 画面の下へ飛ばされる
  const a=G.ally;if(!a||a.st==='fly')return;
  a.st='fly';a.vz=210;a.vx=dir*90;G.shake=.15;spark(a.x,GY-a.z-24,'#ffd23c',8);SND.hurt();
}
function updAlly(dt){
  const a=G.ally;if(!a)return;
  if(a.st==='walk'){
    a.face=E.x>=a.x?1:-1;a.x+=a.face*ALLYSPD*dt;a.walk+=dt*3;   // 足を速く
    if(Math.abs(E.x-a.x)<16&&!E.dead&&E.z<2&&E.st!=='dash'&&E.st!=='wind'&&E.st!=='combo'){   // 敵にとりついた
      a.st='cling';a.t=ALLYHOLD;a.side=a.face>0?-1:1;E.st='held';E.vx=0;SND.hit();
    }
  }else if(a.st==='cling'){
    a.t-=dt;a.walk+=dt*8;a.x=E.x+a.side*9;a.face=-a.side;
    if(a.t<=0||E.st!=='held'){if(E.st==='held'){E.st='walk';E.cd=.8;}flingAlly(a.side);}   // 時間がきたら画面の下へ飛ばされ、敵は自由になる
  }else{
    a.vz-=GR*dt;a.z+=a.vz*dt;a.x+=a.vx*dt;if(a.z<-320)G.ally=null;
  }
}
function climb(){
  G.ally=null;G.state='climb';G.t=2.2;G.eHP=E.hp;knives=[];P.lock=0;E.st='walk';
}
function endClimb(){
  G.state='stairs';showControls(false);
  showOverlay(`<h2>階段を のぼられた！</h2><p>敵は ステージ${G.stage+1}へ。ライフは すこし回復する…</p>
  <div class="sc">SCORE ${sc6(G.score)}</div>
  <div class="row"><button class="btn" data-act="next">つぎのステージへ</button></div>`);
}
function win(trick){
  bgmStop();
  G.state='win';G.t=2.9;knives=[];
  if(trick){G.trick=true;G.t=3.2;G.cap.fly=true;G.cap.vy=-200;G.cap.vx=-70;}   // 裏技: 女性が画面の下へ飛び出す
  else{E.dead=true;E.st='down';E.vz=230;E.kbv=-E.face*120;}                  // 敵がはね飛ばされて画面の下へ落ちる
  G.score+=Math.floor(G.time)*10+(STAGES-G.stage+1)*1000;G.shake=.2;SND.win();   // 早く勝つほど高得点
}
function lose(why){
  if(G.state!=='lose'&&G.state!=='win')bgmStop();
  if(G.state==='lose'||G.state==='win')return;
  G.state='lose';G.t=1.7;G.msg=why;SND.lose();
  if(why==='GOAL'){G.t=4;G.cap.rs=0;E.face=1;E.st='walk';}   // 敵が女性を救う: 女性が立ち上がって寄り添う
  else P.dead=true;
}
function endWin(){
  G.state='end';showControls(false);saveBest();
  showOverlay(`<h2>ゲームクリア！</h2><p>${G.trick?'裏技発見！ 女性が ふっとんでいった…':'主人公をたおした！ ナイフマスターの かちだ！'}${!G.trick&&G.stage<=2?'<br>（ステージ'+G.stage+'で決着）':''}</p>
  <div class="sc">SCORE ${sc6(G.score)}<br>BEST ${sc6(best)}</div>
  <div class="row"><button class="btn" data-act="retry">もういちど</button><button class="btn sub" data-act="title">タイトルへ</button></div>${COPY}`);
}
function endLose(){
  G.state='over';showControls(false);
  const nb=saveBest();
  showOverlay(`<h2>ゲームオーバー</h2><p>${G.msg==='TIME UP'?'じかんぎれ…':G.msg==='GOAL'?'女性を すくわれてしまった…':'やられてしまった…'}（ステージ${G.stage}）</p>
  <div class="sc">SCORE ${sc6(G.score)}<br>BEST ${sc6(best)}${nb?' NEW!':''}</div>
  <div class="row"><button class="btn" data-act="retry">もういちど</button><button class="btn sub" data-act="title">タイトルへ</button></div>`);
}

/* 奇数ステージ＝自分は画面左・敵は右から来て左へ進む（画面全体を左右反転して描く）。偶数ステージはその逆 */
function mirror(){return G.stage%2===1;}

/* ===== 更新 ===== */
let coolOn=null;
function showCool(){const on=!!P&&G.state==='play'&&!canThrow();if(on!==coolOn){coolOn=on;$('bT').classList.toggle('cool',on);$('bL').classList.toggle('cool',on);}
  $('bA').classList.toggle('cool',!P||G.allyUsed||G.state!=='play');}
function update(dt){
  const portrait=innerHeight>innerWidth;
  if(portrait&&(G.state==='play'||G.state==='intro')){pause();return;}
  G.shake=Math.max(0,G.shake-dt);
  if(G.cap){const c=G.cap;c.hit-=dt;if(c.fly){c.x+=c.vx*dt;c.vy+=GR*dt;c.y+=c.vy*dt;}
    if(c.rs>=0){                                   // 救出: 女性が立ち上がり、敵のそばまで歩いて寄り添う
      c.rs+=dt;
      if(c.rs>.7&&!c.stand){c.stand=true;c.wx=LEN-62;SND.win();}
      if(c.stand)c.wx=Math.max(E.x+17,c.wx-42*dt);
    }
  }
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=600*dt;q.t-=dt;}
  parts=parts.filter(q=>q.t>0);
  if(!P)return;
  const s=G.state;
  if(s==='play'||s==='intro'||s==='win'||s==='lose'||s==='climb'){
    updPlayer(dt);updEnemy(dt);
    if(s==='play'||s==='intro')updKnives(dt);
    if(s==='play')updAlly(dt);
    if(s==='intro'){
      G.it+=dt;
      if(E.x>40)camX=E.x-40;                                   // 敵に合わせてスクロールがはじまる
      if(G.it>=1.6&&P.hidden){P.hidden=false;P.x=camX+520;P.face=-1;SND.go();}   // 自機が画面の外から現れる
      if(!P.hidden&&P.x<=camX+250){                           // 所定の位置まで来たら、止めずにそのままスタート
        P.x=camX+250;P.moving=false;G.state='play';G.fightT=.9;G.arrowT=1.8;E.cd=Math.max(E.cd,.8);
      }
    }
    if(s!=='intro')camX=Math.min(LEN-W,Math.max(camX,P.x-250));   // スクロールには限界がある
  }
  if(G.state==='play'){
    G.time-=dt;
    if(G.time<=0){G.time=0;lose('TIME UP');}
  }
  showCool();
  G.fightT=Math.max(0,(G.fightT||0)-dt);G.arrowT=Math.max(0,(G.arrowT||0)-dt);
  if(s==='win'){G.t-=dt;if(G.t<=0)endWin();}
  if(s==='lose'){G.t-=dt;if(G.t<=0)endLose();}
  if(s==='climb'){G.t-=dt;if(G.t<=0)endClimb();}
}

/* ===== 描画：最上階の、椅子に座らされた女性（チャイナドレス）===== */
function drawCaptive(ox){
  const X=LEN-78+ox,Y=GY;          // 椅子の左端、足元。座った高さは約37px（以前より一回り小さい）
  const wood='#7a3410',wood2='#c8782a',red='#d02030',red2='#9a1020',gold='#f8d820',skin='#f8c8a0',hair='#14141c',rope='#d8c08a';
  R(LEN-3+ox,83,3,GY-83,'#f87820');                                   // 端の柱
  // 椅子
  R(X+22,Y-36,4,36,wood);R(X+22,Y-36,4,3,wood2);                       // 背もたれ
  R(X,Y-10,25,3,wood);R(X,Y-10,25,1,wood2);                            // 座面
  R(X+1,Y-7,3,7,wood);R(X+20,Y-7,3,7,wood);                            // 脚
  if(G.cap.stand)return;                                               // 立ち上がったあとは椅子だけ
  // ここから女性（ナイフが当たると飛ぶ）
  cx.save();
  const c=G.cap,sh=c.hit>0?Math.round((Math.random()-.5)*3):0;
  cx.translate(Math.round(c.x)+sh,Math.round(c.y));
  R(X+1,Y-14,21,4,red);R(X+1,Y-14,21,1,red2);                          // ふともも（スカート）
  R(X+1,Y-10,4,7,red);R(X+1,Y-6,4,2,rope);R(X+2,Y-4,2,1,skin);R(X,Y-3,6,3,red2);   // ひざ下、足首のひも、足
  R(X+12,Y-27,9,13,red);R(X+12,Y-27,2,13,red2);                        // 体（チャイナドレス）
  R(X+12,Y-23,9,2,gold);R(X+12,Y-18,9,2,gold);R(X+13,Y-29,5,2,gold);   // 金の縁どりと立ちえり
  R(X+10,Y-25,3,7,red2);R(X+11,Y-21,11,2,rope);                        // うしろ手、体をしばるひも
  R(X+10,Y-37,8,8,skin);                                               // 頭
  R(X+9,Y-39,11,3,hair);R(X+17,Y-37,3,8,hair);R(X+18,Y-42,4,4,hair);R(X+19,Y-41,2,2,gold);   // 髪とおだんご、かんざし
  R(X+11,Y-34,2,2,'#14141c');R(X+11,Y-31,2,1,'#c04858');               // 目と口
  cx.restore();
}
// 救出されて立ち上がった女性（敵に寄り添う）
function drawWomanStand(x,walking){
  const sx=Math.round(x-camX),Y=GY,red='#d02030',red2='#9a1020',gold='#f8d820',skin='#f8c8a0',hair='#14141c';
  cx.fillStyle='rgba(0,0,0,.28)';cx.fillRect(sx-8,GY-1,16,3);
  cx.save();cx.translate(sx,Y);cx.scale(-1,1);                         // 敵の方（論理上の左）を向く
  const st=walking?Math.round(Math.sin(G.cap.rs*16)*2):0;
  R(-3+st,-9,2,9,skin);R(1-st,-9,2,9,skin);R(-4+st,-2,4,2,red2);R(0-st,-2,4,2,red2);   // 脚と靴
  R(-5,-24,10,16,red);R(-5,-24,2,16,red2);R(-5,-19,10,2,gold);R(-5,-13,10,2,gold);      // チャイナドレス（体〜すそ）
  R(-1,-9,2,8,red2);                                                                    // すそのスリット
  R(-4,-26,5,2,gold);R(-7,-22,2,9,red);R(5,-22,2,9,red);R(-7,-14,2,2,skin);R(5,-14,2,2,skin);   // 立ちえり、腕
  R(-4,-34,8,8,skin);R(-5,-36,10,3,hair);R(-6,-34,3,8,hair);R(-5,-40,5,4,hair);R(-4,-39,2,2,gold);   // 頭、髪、おだんご
  R(1,-31,2,2,'#14141c');R(1,-28,2,1,'#c04858');                                         // 目と口
  cx.restore();
}
function drawHeart(x,y){
  const rows=['.##.##.','#######','#######','.#####.','..###..','...#...'];
  cx.fillStyle='#ff6088';
  rows.forEach((r,j)=>{for(let i=0;i<7;i++)if(r[i]==='#')cx.fillRect(Math.round(x-7+i*2),Math.round(y+j*2),2,2);});
}

/* ===== 描画：背景 ===== */
function R(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),w,h);}
function drawBG(){
  const st=STG[G.stage-1]||STG[0],ox=-Math.round(camX);
  R(0,TOPY,W,H-TOPY,'#000');
  // 屋根
  for(let x=-(Math.round(camX)%12)-12;x<W;x+=12){R(x,58,12,6,'#58d854');R(x+3,60,6,2,'#a8f0a0');R(x,64,12,2,'#00a800');}
  R(0,66,W,3,'#f87820');R(0,69,W,14,'#f87820');R(0,69,W,2,'#fcbc60');R(0,81,W,2,'#c04800');
  R(0,83,W,GY-83,st.wall);
  // はり・柱
  R(0,112,W,10,'#f87820');R(0,112,W,2,'#fcbc60');R(0,120,W,2,'#c04800');
  const px0=Math.floor(camX/110)-1;
  for(let k=px0;k<px0+6;k++){
    const x=k*110+ox+30;
    R(x,86,8,26,'#f87820');R(x-10,86,28,5,'#fcbc60');R(x-8,92,6,6,'#c04800');R(x+10,92,6,6,'#c04800');
    if(k%3===0){R(x+44,88,26,22,'#e8e0c8');R(x+51,92,12,14,'#181818');R(x+54,95,6,2,'#e8e0c8');}
  }
  // 床
  R(0,GY-2,W,3,'#fcbc3c');R(0,GY+1,W,12,'#f87820');R(0,GY+5,W,2,'#fcbc60');R(0,GY+13,W,2,'#c04800');
  const t0=Math.floor(camX/20);
  for(let k=t0;k<t0+26;k++){
    const x=k*20+ox;
    R(x,GY+15,20,16,'#f8a030');R(x+2,GY+17,16,12,'#a04800');R(x+4,GY+19,12,8,'#f8a030');R(x+7,GY+22,6,2,'#a04800');
  }
  // ステージの終わり: 上の階へ行く階段
  if(camX+W>LEN-160&&G.stage===STAGES)drawCaptive(ox);   // 最上階: 階段のかわりに、椅子に座らされた女性
  else if(camX+W>LEN-190){
    const x0=LEN-140+ox,sw=16,sh=12;
    const dx=LEN-36+ox,top=GY-7*sh;                  // 踊り場の高さ
    // 出口: 壁にはめこまれた両開きの扉（踊り場の奥）
    R(dx-4,top-45,40,47,'#c85a1a');R(dx-4,top-45,40,3,'#f8b848');    // 枠とまぐさ
    R(dx,top-40,32,40,'#0a0a14');R(dx+2,top-38,28,38,'#181830');     // 扉のあき
    R(dx+15,top-40,2,40,'#0a0a14');                                   // 合わせ目
    R(dx+11,top-22,3,5,'#f8d820');R(dx+18,top-22,3,5,'#f8d820');       // 取っ手
    // 階段（最上段は奥の扉までつづく踊り場）
    for(let i=0;i<7;i++){
      const x=x0+i*sw,t=GY-(i+1)*sh,w=i===6?LEN+ox-x:sw;
      R(x,t,w,GY-t,'#7a3410');R(x,t,w,3,'#f8b848');R(x,t+3,w,1,'#c8782a');R(x,t+sh-1,w,1,'#5a2208');
      R(x,t+3,2,GY-t-3,'#a85018');
    }
    for(let i=0;i<6;i++){const x=x0+i*sw,t=GY-(i+1)*sh;R(x+6,t-14,2,14,'#f87820');R(x,t-14,sw+2,2,'#f87820');}   // 手すり
    R(LEN-3+ox,83,3,GY-83,'#f87820');                                // 端の柱
  }
  // 床下の水と柱
  R(0,GY+31,W,H-TOPY-GY-31,'#103090');
  for(let x=-(Math.round(camX)%4)-4;x<W;x+=4){R(x,GY+36,2,2,'#40a0ff');R(x+2,GY+44,2,2,'#40a0ff');}
  const c0=Math.floor(camX/80)-1;
  for(let k=c0;k<c0+8;k++){const x=k*80+ox+20;R(x,GY+31,8,26,'#f87820');R(x-5,GY+31,18,4,'#fcbc60');}
}

/* ===== 描画：キャラクター ===== */
function fighter(o){
  const sx=Math.round(o.x-camX),by=Math.round(GY-o.z),p=o.pal,pose=o.pose;
  if(!o.dead){cx.fillStyle='rgba(0,0,0,.28)';cx.fillRect(sx-10,GY-1,20,3);}
  if(o.inv>0&&Math.floor(o.inv*18)%2)return;
  if(pose==='banzai'){                                     // 正面を向いて、両手をあげてバンザイ
    cx.save();cx.translate(sx,by);const p=o.pal,A=(x,y,w,h,c)=>R(x,y,w,h,c);
    A(-8,-16,6,16,p.pants);A(2,-16,6,16,p.pants);A(-9,-2,7,2,p.shoe);A(2,-2,7,2,p.shoe);   // 足をひらく
    A(-7,-32,14,16,p.gi);A(-7,-20,14,3,p.belt);A(-1,-32,2,6,p.skin);                       // 胴と帯
    A(-11,-39,3,11,p.sleeve);A(8,-39,3,11,p.sleeve);A(-11,-43,3,4,p.skin);A(8,-43,3,4,p.skin);   // 両手をあげる
    A(-5,-44,10,11,p.skin);A(-5,-45,10,4,p.hair);A(-5,-41,10,2,'#fff');A(-9,-41,4,3,'#fff');A(5,-41,4,3,'#fff');   // 頭、はちまき
    A(-3,-39,2,2,'#000');A(1,-39,2,2,'#000');A(-2,-35,4,2,'#c04858');                       // 目と口（よろこぶ顔）
    cx.restore();return;
  }
  cx.save();cx.translate(sx,by);cx.scale(o.face,1);
  if(pose==='down'){cx.translate(0,-7);cx.rotate(-Math.PI/2);}
  else if(pose==='hurt'){cx.rotate(-.18);}
  const cr=pose==='crouch'||pose==='wind'||pose==='cthrow'||pose==='sweep',u=cr?14:0;
  const sw=(pose==='walk'||pose==='raise')?Math.round(Math.sin(o.walk*14)*3):0;
  const A=(x,y,w,h,c)=>R(x,y,w,h,c);
  // 脚
  if(pose==='sweep'){A(-8,-8,10,8,p.pants);A(2,-5,26,5,p.pants);A(28,-6,4,7,p.shoe);A(-9,-2,8,2,p.shoe);}
  else if(cr){A(-8,-8,16,8,p.pants);A(-9,-2,18,2,p.shoe);}
  else if(pose==='kick'){A(-6,-14,5,14,p.pants);A(-6,-2,6,2,p.shoe);A(1,-25,24,5,p.pants);A(23,-27,5,8,p.shoe);}
  else if(pose==='air'||pose==='hurt'){A(-6,-14,6,9,p.pants);A(1,-12,7,6,p.pants);A(-6,-6,6,2,p.shoe);A(4,-7,5,2,p.shoe);}
  else{A(-6+sw,-16,5,16,p.pants);A(1-sw,-16,5,16,p.pants);A(-6+sw,-2,6,2,p.shoe);A(1-sw,-2,6,2,p.shoe);}
  // 胴
  A(-7,-32+u,14,16,p.gi);A(-7,-20+u,14,3,p.belt);A(0,-32+u,3,5,p.skin);
  // 頭
  A(-5,-44+u,10,11,p.skin);
  if(o.kind!=='thrower'){A(-5,-45+u,10,4,p.hair);A(-6,-44+u,3,10,p.hair);}
  else{A(-5,-45+u,10,4,p.hair);A(-5,-41+u,10,2,'#fff');A(-9,-41+u,4,3,'#fff');}
  A(2,-39+u,2,2,'#000');
  // 腕
  if(pose==='punch'){A(6,-31+u,20,4,p.sleeve);A(25,-32+u,5,6,p.skin);A(-9,-30+u,3,11,p.sleeve);}
  else if(pose==='punchw'){A(-13,-31+u,10,4,p.sleeve);A(-14,-32+u,4,6,p.skin);A(6,-30+u,3,10,p.sleeve);}
  else if(pose==='cthrow'){A(5,-31+u,12,3,p.sleeve);A(16,-32+u,4,5,p.skin);A(20,-31+u,7,2,'#e8e8f0');A(-9,-30+u,3,11,p.sleeve);}
  else if(pose==='throw'){A(5,-41+u,3,13,p.sleeve);A(4,-44+u,4,3,p.skin);A(6,-51+u,2,7,'#e8e8f0');A(-9,-30+u,3,11,p.sleeve);}
  else if(pose==='air'||pose==='kick'||pose==='hurt'||pose==='raise'){A(6,-37,3,9,p.sleeve);A(-10,-37,3,9,p.sleeve);}
  else{
    A(-9-sw,-30+u,3,11,p.sleeve);A(6+sw,-30+u,3,11,p.sleeve);A(6+sw,-19+u,3,3,p.skin);
  }
  cx.restore();
}
function playerPose(){
  if(G.state==='win'&&!P.dead)return'banzai';
  if(P.dead||P.hurt>0)return'hurt';if(P.throwT>0)return P.low&&P.z===0?'cthrow':'throw';
  if(P.z>0)return'air';return P.moving?'walk':'idle';
}
function enemyPose(){
  if(E.dead)return'hurt';
  switch(E.st){
    case 'combo':return E.kind==='jab'?(E.at>.24?'punch':'punchw'):(E.at>.3?'sweep':'crouch');
    case 'wind':return'wind';case 'dash':return E.vz<120?'kick':'air';case 'jump':return'air';
    case 'crouch':return'crouch';case 'hurt':return'hurt';
  }
  if(G.state==='climb')return'walk';
  return E.vx!==0||E.z>0?'air':'walk';
}
function drawKnife(k){
  cx.save();cx.translate(Math.round(k.x-camX),Math.round(k.y));cx.rotate(k.a*Math.sign(k.vx));
  R(-5,-1,10,2,'#e8e8f8');R(3,-2,2,4,'#e8e8f8');R(-8,-1,4,2,'#a05020');
  cx.restore();
}

/* ===== 描画：HUD ===== */
const FONT='"Press Start 2P",monospace';
function txt(s,x,y,c,size=8,align='left'){cx.font=size+'px '+FONT;cx.textAlign=align;cx.textBaseline='top';cx.fillStyle=c;cx.fillText(s,x,y);}
function drawHUD(){
  const g=cx.createLinearGradient(0,0,0,50);g.addColorStop(0,'rgba(0,0,0,.88)');g.addColorStop(.8,'rgba(0,0,0,.8)');g.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=g;cx.fillRect(0,0,W,50);
  txt('1-'+sc6(G.score),10,4,'#7cf08a');txt('TOP-'+sc6(Math.max(best,G.score)),150,4,'#f87820');
  txt('TIME',W-50,4,'#f87820',8,'right');
  txt(String(Math.ceil(G.time)).padStart(2,' '),W-10,4,G.time<15?'#ff5050':'#fff',8,'right');
  txt('PLAYER',10,18,'#f87820');R(76,17,10,9,'#f87820');txt('ONE HIT',92,18,'#ff5050',8);
  txt('ENEMY',10,32,'#f87820');
  const w=130*(E.hp/E.max);R(76,31,130,9,'#3a2010');R(76,31,Math.round(w),9,'#f87820');
  for(let i=1;i<=STAGES;i++){R(300+(i-1)*34,20,24,10,i<=G.stage?'#2060ff':'#102050');if(i<STAGES)R(324+(i-1)*34,24,10,2,'#f87820');}
  txt('STAGE '+G.stage,300,34,'#7cf08a',8);
}
// 自機の位置をしめす矢印（登場演出で、どれが自分か分かるように。画面の外にいるときは、画面のはしから方向をしめす）
function drawYou(){
  if(!P||P.hidden)return;
  if(!(G.state==='intro'||(G.state==='play'&&G.arrowT>0)))return;
  if(G.state==='play'&&G.arrowT<.6&&Math.floor(G.arrowT*10)%2)return;   // 消える前にまたたく
  const raw=mirror()?W-(P.x-camX):(P.x-camX);
  const bob=Math.round(Math.sin(performance.now()/110)*3);
  const col='#ffd23c',ol='#000';
  const down=(x,y,c)=>{for(let j=0;j<6;j++)cx.fillStyle=c,cx.fillRect(x-(5-j),y+j*2,11-2*j,2);};
  if(raw<8||raw>W-8){                                 // 画面の外: はしに、向きをしめす矢印
    const right=raw>W-8,x=right?W-12:12,y=GY+TOPY-28+bob*0;
    const side=(x,y,c,o)=>{for(let j=0;j<6;j++){cx.fillStyle=c;const w=2,h=11-2*j;cx.fillRect(right?x-6+j*2+o:x+6-j*2-w-o,y-(5-j),w,h);}};
    const off=bob;
    side(x+(right?off:-off),y+1,ol,0);side(x+(right?off:-off),y,col,0);
    txt('YOU',right?W-26:26,y-18,col,8,right?'right':'left');
    return;
  }
  const x=clamp(raw,16,W-16),y=100+bob;
  down(x,y+1,ol);down(x,y,col);
  txt('YOU',x+1,y-14,ol,8,'center');txt('YOU',x,y-15,col,8,'center');
}
function bigText(s,y,c,size){txt(s,W/2+2,y+2,'#000',size,'center');txt(s,W/2,y,c,size,'center');}

function draw(){
  cx.setTransform(S,0,0,S,0,0);cx.imageSmoothingEnabled=false;
  cx.save();
  if(G.shake>0)cx.translate(Math.round((Math.random()-.5)*5),Math.round((Math.random()-.5)*4));
  cx.translate(0,TOPY);
  if(mirror()){cx.translate(W,0);cx.scale(-1,1);}
  drawBG();
  if(P){
    // 奥にいる方を先に描く（足元の高さが同じなので、ジャンプ中でない方を先に）
    if(!E.hidden)fighter({x:E.x,z:E.z,face:E.face,pal:E.c.pal,pose:enemyPose(),walk:E.walk,kind:'hero',inv:0,dead:E.dead});
    if(G.ally){const a=G.ally;                                  // 3人が一列にならんで、重なっている（先頭が敵にいちばん近い）
      for(let i=2;i>=0;i--)fighter({x:a.x-a.face*i*11,z:a.z,face:a.face,pal:PAL_A,pose:a.st==='fly'?'hurt':'raise',walk:a.walk+i*.9,kind:'ally',inv:0,dead:a.st==='fly'});
    }
    if(!P.hidden)fighter({x:P.x,z:P.z,face:P.face,pal:PAL_P,pose:playerPose(),walk:P.walk,kind:'thrower',inv:P.inv,dead:P.dead});
    if(G.cap.stand){drawWomanStand(G.cap.wx,G.cap.wx>E.x+17.5);if(G.cap.rs>1.5)drawHeart((G.cap.wx+E.x)/2-camX+1,GY-62-Math.min(10,(G.cap.rs-1.5)*8)+Math.sin(G.cap.rs*5)*1.5);}
    knives.forEach(drawKnife);
    for(const q of parts)R(q.x-camX,q.y,3,3,q.c);
  }
  cx.restore();
  if(P)drawHUD();
  drawYou();
  if(G.state==='intro'&&G.it<2.2)bigText(G.stage===STAGES?'FINAL STAGE':'STAGE '+G.stage,54,'#fff',20);
  if(G.state==='play'&&G.fightT>0)bigText('FIGHT!',54,'#ffd23c',20);
  if(G.state==='climb')bigText('GOING UP...',76,'#ffd23c',16);
  if(G.state==='win')bigText('YOU WIN!',76,'#ffd23c',20);
  if(G.state==='lose')bigText(G.msg==='TIME UP'?'TIME UP':'YOU LOSE',76,'#ff5050',20);
}

/* ===== ループ ===== */
let lastT=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(G.state!=='pause')update(dt);
  draw();
  requestAnimationFrame(loop);
}
showTitle();
requestAnimationFrame(loop);
window.__g={G,inp,get P(){return P},get E(){return E},get knives(){return knives}};
</script>
