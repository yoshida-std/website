<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>すすめ！ゆうしゃ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@800&display=swap">
<style>
/* Layout: 横画面。左1/3が操作エリア（パーティ窓＋円盤）、右2/3がゲーム画面（高さ224ドット、幅は比率で決まる）。スーファミRPG風の青グラデーション窓と金属の円盤 */
:root{
  --bg:#0b0d14; --fg:#ffffff; --dim:#9aa2c8;
  --winTop:#5866bc; --winMid:#2c3888; --winBot:#141c58; --winLine:#e8e8f2;
  --hp:#3c9cf0; --hpHi:#a8ecff; --low:#f04828; --lowHi:#ffb090; --gold:#ffd84a; --pink:#ff9cf0;
  --metal:#9aa0a8; --panelTop:#262b3b; --panelBot:#11141d;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;
  -webkit-touch-callout:none;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--font)}
button{touch-action:manipulation;font-family:var(--font);cursor:pointer}
canvas{touch-action:none;display:block}
[hidden]{display:none!important}
#app{height:100%;display:flex;align-items:stretch;justify-content:center;box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.win{background:linear-gradient(180deg,var(--winTop) 0%,var(--winMid) 45%,var(--winBot) 100%);border:3px solid var(--winLine);border-radius:7px;
  box-shadow:0 0 0 1px #20223a,inset 0 0 0 1px #8890d0,0 3px 6px #0009;color:var(--fg);text-shadow:1px 1px 0 #000}
#panel{position:relative;flex:0 0 auto;display:flex;flex-direction:column;gap:6px;padding:6px 8px 8px;box-sizing:border-box;
  background:linear-gradient(180deg,var(--panelTop),var(--panelBot));box-shadow:inset -2px 0 0 #3d4356,inset -3px 0 0 #000}
#party{padding:3px 7px 4px;font-size:10px;border-width:2px;border-radius:6px}
#members{display:grid;gap:1px}
.mem{display:flex;align-items:center;gap:5px;min-width:0;line-height:1.15}
.mem .nm{flex:0 0 6em;white-space:nowrap;overflow:hidden}
.mem .bar{flex:1;height:5px;background:#080c2c;border:1px solid #b8bce0;border-radius:2px;position:relative;min-width:16px;overflow:hidden}
.mem .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,var(--hpHi),var(--hp) 55%,#2860c0)}
.mem.low .bar i{background:linear-gradient(180deg,var(--lowHi),var(--low) 55%,#a02010)}
.mem.empty{color:var(--dim)}
.mem.empty .bar{border-color:#5a6090}
#prog{position:relative;height:2px;background:linear-gradient(90deg,#2858d8,#7048b0 60%,#e02830);margin:5px 3px 2px;border-radius:2px}
#prog i{position:absolute;top:-2px;width:6px;height:6px;margin-left:-3px;background:var(--hpHi);border:1px solid #000;box-sizing:border-box}
#prog b{position:absolute;right:-3px;top:-2px;width:6px;height:6px;background:#ff3828;border:1px solid #000;box-sizing:border-box}
#screen{position:relative;overflow:hidden;align-self:center}
#cv{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#pauseBtn::after{content:"";position:absolute;inset:-6px -12px -4px -8px}   /* 指で押せる範囲を見た目より広くする */
#pauseBtn{position:relative;z-index:1;align-self:flex-start;height:28px;padding:0 12px;font-size:11px;border-width:2px;letter-spacing:.05em}
#msg{position:absolute;left:3%;right:3%;top:6px;padding:7px 12px;font-size:clamp(12px,3.6vh,16px);line-height:1.45;pointer-events:none}
#stickZone{position:relative;flex:1;min-height:0;touch-action:none}
#panelBg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#party,#stickZone{position:relative;z-index:1}
#panel{touch-action:none}
#stick{position:absolute;left:50%;bottom:7%;width:min(210px,80%,52vh);aspect-ratio:1;transform:translateX(-50%);pointer-events:none}
#shieldCv,#knobCv{display:block;width:100%;height:100%}
#knob{position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);z-index:1}
#knob.tap{filter:sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.15)}
#knob.c0{filter:brightness(1.15);animation:glow .4s steps(2) infinite}
#knob.c1{filter:sepia(1) saturate(4) hue-rotate(160deg) brightness(1.3);animation:glow .3s steps(2) infinite}
#knob.c2{filter:sepia(1) saturate(6) hue-rotate(-12deg) brightness(1.35);animation:glow .2s steps(2) infinite}
#knob.c3{filter:sepia(1) saturate(8) hue-rotate(-40deg) brightness(1.2);animation:glow .12s steps(2) infinite}
@keyframes glow{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-50%) scale(1.08)}}
@media (prefers-reduced-motion:reduce){#knob.c0,#knob.c1,#knob.c2,#knob.c3{animation:none}}
#stickLabel{position:absolute;left:0;right:0;top:2px;text-align:center;font-size:11px;color:var(--dim);line-height:1.5;text-shadow:1px 1px 0 #000,0 0 4px #000}
/* ステージクリア: ゲーム画面の上に重ねる（1em = ゲームの8ドット。layout() で決める） */
#clearView{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;gap:.35em;padding:.7em 1em 1.1em;box-sizing:border-box;
  background:linear-gradient(rgba(10,20,60,.28),rgba(10,20,60,0) 38%,rgba(10,20,60,0) 70%,rgba(10,20,60,.22));text-align:center;
  --round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",var(--font);--pop:"Mochiy Pop One","M PLUS Rounded 1c",var(--font)}
.cTitle{position:relative;margin:0;font-family:var(--pop);font-weight:400;font-size:3.3em;line-height:1.15;letter-spacing:.02em;white-space:nowrap}
.cTitle::before,.cTitle::after{content:attr(data-t);position:absolute;inset:0}
.cTitle::before{color:#4a2606;-webkit-text-stroke:.3em #4a2606;text-shadow:0 .1em 0 #2a1402}
.cTitle::after{color:#f0c040;-webkit-text-stroke:.19em #f0c040}
.cTitle span{position:relative;z-index:1;background:linear-gradient(#e8f8ff 8%,#7cc8ff 32%,#2f86e8 58%,#1a55b8 78%,#3a8ef0);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.045em #fff}
.cScroll{position:relative;margin:.3em 0 .3em;padding:.42em 2.4em .38em;font-family:var(--round);font-weight:800;font-size:1.2em;color:#4a2e12;white-space:nowrap;
  background:linear-gradient(#fdf4dc,#efdcb0 55%,#dcc290);border-top:.09em solid #9a7a48;border-bottom:.12em solid #7a5a30;box-shadow:0 .15em .25em #0005}
.cScroll::before,.cScroll::after{content:"";position:absolute;top:-.32em;bottom:-.32em;width:1.25em;border-radius:.45em;
  background:linear-gradient(90deg,#9a7444,#f4e4bc 45%,#c9a66b 70%,#8a6436);box-shadow:inset 0 0 0 .07em #6a4a22,0 .12em .2em #0006}
.cScroll::before{left:-.75em}.cScroll::after{right:-.75em}
.cStats{display:grid;grid-template-columns:auto auto;gap:0 2.2em;width:min(17em,92%);font-family:var(--round);font-weight:800;font-size:1.75em;line-height:1.22;
  color:#fff1cf;font-variant-numeric:tabular-nums;
  text-shadow:.06em 0 #3a220c,-.06em 0 #3a220c,0 .06em #3a220c,0 -.06em #3a220c,.05em .05em #3a220c,-.05em .05em #3a220c,.05em -.05em #3a220c,-.05em -.05em #3a220c,0 .11em #1e1004}
.cStats span{text-align:left;white-space:nowrap}.cStats span:nth-child(even){text-align:right}
.cBtns{display:flex;gap:1.3em;margin-top:auto}
.cBtn{position:relative;font-family:var(--round);font-weight:800;font-size:1.45em;line-height:1.2;padding:.38em 1.3em .42em;border-radius:.38em;border:.12em solid #3e2206;cursor:pointer}
.cBtn.gold{color:#4a2a08;text-shadow:0 .05em 0 #fff8;background:linear-gradient(#fff0b0,#f4c24a 42%,#d18d1e 75%,#e9a93a);
  box-shadow:inset 0 0 0 .1em #ffe7a0,inset 0 -.18em 0 #a8620e,0 0 .55em #ffd84aaa,0 .14em 0 #2a1402}
.cBtn.gold::before{content:"▶";margin-right:.15em;font-size:.85em}
.cBtn.wood{color:#fff1cf;text-shadow:.05em 0 #2e1a08,-.05em 0 #2e1a08,0 .05em #2e1a08,0 -.05em #2e1a08;
  background:repeating-linear-gradient(92deg,#0000 0 .5em,#0001 .5em .6em),linear-gradient(#a8703e,#7c4c26 55%,#5c3618);box-shadow:inset 0 0 0 .1em #c99060,inset 0 -.16em 0 #3e2410,0 .14em 0 #1e1004}
.cBtn:active{transform:translateY(.08em)}
.cBtn:focus-visible{outline:.12em solid #fff;outline-offset:.15em}
#clearView>*{animation:cFade .45s ease-out both}
#clearView .cTitle{animation:cDrop .5s cubic-bezier(.2,1.6,.5,1) both}
#clearView .cScroll{animation:cUnroll .4s .3s ease-out both}
#clearView .cStats span{animation:cFade .35s ease-out both}
#clearView .cBtns{animation-delay:1.25s}
@keyframes cDrop{from{opacity:0;transform:translateY(-.5em) scale(1.25)}}
@keyframes cUnroll{from{opacity:0;transform:scaleX(.08)}}
@keyframes cFade{from{opacity:0;transform:translateY(.35em)}}
@media (prefers-reduced-motion:reduce){#clearView *,#clearView>*{animation:none!important}}
#rotate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  text-align:center;font-size:18px;line-height:1.6;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#rotate .ph{width:46px;height:80px;border:4px solid var(--fg);border-radius:8px;animation:turn 2s steps(4) infinite}
@keyframes turn{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none;transform:rotate(-90deg)}}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000000c8;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.pc{font-size:11px!important;color:var(--dim)}
.card{width:100%;max-width:520px;max-height:100%;overflow-y:auto;touch-action:pan-y;box-sizing:border-box;padding:14px 16px 16px;text-align:center}
.card h1{font-size:clamp(30px,10vw,40px);font-weight:400;margin:4px 0 0;line-height:1.15;color:var(--gold);text-shadow:2px 2px 0 #b02818,4px 4px 0 #000;text-wrap:balance}
.card h2{font-size:24px;font-weight:400;margin:4px 0 8px;color:var(--gold)}
.card .tag{margin:4px 0 0;font-size:11px;letter-spacing:.3em;color:var(--hp)}
.card p{margin:6px 0;font-size:13px;line-height:1.7}
.rules{text-align:left;font-size:12.5px;line-height:1.65;margin:10px 0 4px;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:16px 1fr;gap:4px}
.rules li::before{content:"▶";font-size:9px;line-height:2.2;color:var(--gold)}
.rules em{font-style:normal;color:var(--gold)}
.rules em.m{color:var(--pink)}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px;max-width:240px;margin:10px auto;text-align:left;font-variant-numeric:tabular-nums}
.stats span:nth-child(even){text-align:right;color:var(--gold)}
.menuBtn{display:block;margin:10px auto 0;width:min(240px,92%);padding:10px 0;font-size:17px;color:var(--fg);text-shadow:1px 1px 0 #000;
  background:linear-gradient(180deg,#6a78d0,#2c3888);border:2px solid var(--winLine);border-radius:6px;position:relative;box-shadow:0 2px 0 #000}
.menuBtn::before{content:"▶";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:12px;opacity:0}
.menuBtn:hover::before,.menuBtn:focus-visible::before{opacity:1}
.menuBtn:active{background:linear-gradient(180deg,#2c3888,#4a58b0)}
.menuBtn.sub{font-size:14px;padding:7px 0;border-width:2px}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.copy{font-size:10px!important;color:var(--dim);margin-top:14px!important}
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <canvas id="panelBg"></canvas>
    <button id="pauseBtn" class="win" aria-label="一時停止">❚❚ ひとやすみ</button>
    <div id="party" class="win"><div id="members"></div><div id="prog"><i id="progHero"></i><b></b></div></div>
    <div id="stickZone"><div id="stick"><canvas id="shieldCv"></canvas><div id="knob"><canvas id="knobCv"></canvas></div></div></div>
  </div>
  <div id="screen">
    <canvas id="cv" width="320" height="224"></canvas>
    <div id="msg" class="win" hidden></div>
    <div id="clearView" hidden></div>
  </div>
</div>
<div id="rotate" hidden><div class="ph"></div><div>スマホを よこむきに してね</div></div>
<div id="overlay"></div>

<script>
'use strict';
/* ---------- ブラウザ動作の抑止（ダブルタップ拡大・ピンチ・長押し） ---------- */
const KEEP='button,.scrollable';
document.addEventListener('touchstart',e=>{
  if(e.touches.length>1||!e.target.closest(KEEP))e.preventDefault();
},{passive:false});
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{
  const t=Date.now();
  if(t-lastTouchEnd<350&&!e.target.closest(KEEP))e.preventDefault();
  lastTouchEnd=t;
},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(!e.target.closest('.scrollable'))e.preventDefault();},{passive:false});

const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- 定数 ---------- */
let W=320;const H=224,GY=124,DEPTH=92,END=4500,SCROLL=40;   // W は画面の比率で決まる。GY: 地面の奥の端の画面y、DEPTH: 奥行き、SCROLL: 強制スクロールの速さ(px/秒)
const cv=$('#cv'),ctx=cv.getContext('2d');

/* ---------- 音（WebAudio の矩形波） ---------- */
let ac=null,master=null,noiseBuf=null,muted=false;
function initAudio(){
  try{
    if(!ac){
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain();master.gain.value=.32;master.connect(ac.destination);
      noiseBuf=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      decodeBgm();
    }
    if(ac.state==='suspended')ac.resume();
  }catch(e){}
}
function tone(f,dur,type='square',vol=.25,slide=0,when=0){
  if(!ac||muted)return;
  const t=ac.currentTime+Math.max(0,when),o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol=.3,when=0){
  if(!ac||muted)return;
  const t=ac.currentTime+when,s=ac.createBufferSource(),g=ac.createGain();
  s.buffer=noiseBuf;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(g);g.connect(master);s.start(t);s.stop(t+dur);
}
const midi=n=>440*Math.pow(2,(n-69)/12);
const SFX={
  swing(){noise(.08,.18);tone(900,.06,'square',.08,-500)},
  hit(){noise(.1,.3);tone(220,.08,'square',.15,-120)},
  kill(){tone(660,.05,'square',.15);tone(990,.08,'square',.15,0,.05)},
  hurt(){tone(180,.18,'sawtooth',.25,-110);noise(.12,.2)},
  jump(){tone(300,.14,'square',.12,500)},
  fall(){tone(600,.6,'triangle',.3,-520)},
  magic(){tone(1200,.2,'triangle',.12,-900)},
  fire(){tone(500,.1,'square',.08,300)},
  heal(){[72,76,79,84].forEach((n,i)=>tone(midi(n),.12,'triangle',.2,0,i*.06))},
  join(){[67,72,76,79,84].forEach((n,i)=>tone(midi(n),i===4?.35:.1,'square',.13,0,i*.09))},
  down(){[64,60,55,52].forEach((n,i)=>tone(midi(n),.18,'square',.13,0,i*.14))},
  boss(){[45,44,45,44,40].forEach((n,i)=>tone(midi(n),.16,'sawtooth',.2,0,i*.12))},
  boom(){noise(.5,.4);tone(120,.5,'square',.2,-80)},
};
function sfx(n){SFX[n]&&SFX[n]()}
// オリジナルのBGM（8分音符の並び。0は休符）
const SONGS={
  field:{dt:.2,mel:[72,0,76,79,77,76,74,0,72,74,76,72,69,0,67,0,69,72,74,76,77,79,81,0,79,77,76,74,72,0,0,0],
    bass:[48,55,53,55,48,55,43,55,45,52,50,52,53,55,48,48]},
  boss:{dt:.16,mel:[69,72,76,72,75,72,76,0,69,72,77,76,75,0,71,0,69,72,76,81,80,76,77,0,74,77,76,75,76,0,64,0],
    bass:[45,57,45,57,44,56,44,56,43,55,43,55,44,56,40,52]},
};
let bgm=null,bgmWant=null;   // bgm: 合成の BGM の進み具合、bgmWant: 流したい曲の名前
function playBgm(name){bgm={s:SONGS[name],step:0,next:ac?ac.currentTime+.1:0};if(bgmWant!==name){stopFile(false);bgmFile.offset=0}bgmWant=name;syncBgm()}
function stopBgm(){bgm=null;bgmWant=null;stopFile(false);stopJingle()}
// BGM の音声ファイル（sound/*.mp3）。読めたらこちらを流し、読めないときは合成の BGM のまま
//   field: BGM031「力を出しきれ」（道中）、boss: BGM084「燃やしつくすぜ」（ボス）。len はもとの WAV の長さ（くり返す長さ）
const BGM_FILES={field:{src:'sound/bgm_field.mp3',len:1411200/44100},boss:{src:'sound/bgm_boss.mp3',len:1814398/44100},
  clear:{src:'sound/jingle_clear.mp3'}};   // clear: ME044「clear12」（ステージクリアのジングル、7.3秒、1回だけ）
const BGM_VOL=.24,JINGLE_VOL=.45;   // 効果音（master .32）が聞こえるよう、BGM は小さめ
// ステージクリアのジングル（くり返さない）。ファイルがないときは合成のファンファーレ
let jingleSrc=null;
function playJingle(){
  stopJingle();
  if(!ac||muted)return;
  const b=bgmFile.buf.clear;if(!b){SFX.join();return}
  const g=ac.createGain();g.gain.value=JINGLE_VOL;g.connect(ac.destination);
  const src=ac.createBufferSource();src.buffer=b;src.connect(g);src.start();jingleSrc=src;src.onended=()=>{if(jingleSrc===src)jingleSrc=null};
}
function stopJingle(){if(jingleSrc){try{jingleSrc.stop()}catch(e){}jingleSrc=null}}
const bgmFile={raw:{},buf:{},src:null,gain:null,offset:0,startAt:0,ls:0,le:0};
for(const k in BGM_FILES)fetch(BGM_FILES[k].src).then(r=>r.ok?r.arrayBuffer():null).then(a=>{if(a){bgmFile.raw[k]=a;decodeBgm()}}).catch(()=>{});
function decodeBgm(){
  if(!ac)return;
  for(const k in bgmFile.raw){const a=bgmFile.raw[k];delete bgmFile.raw[k];
    new Promise((ok,ng)=>ac.decodeAudioData(a,ok,ng)).then(b=>{bgmFile.buf[k]=b;syncBgm()}).catch(()=>{})}
}
// MP3 は頭に短い無音が入ることがある。無音のあとから、もとの長さぶんをくり返す（つなぎ目に間ができないように）
function loopPoints(b,len){
  const d=b.getChannelData(0),max=Math.min(d.length,Math.floor(b.sampleRate*.1));let i=0;
  while(i<max&&Math.abs(d[i])<.003)i++;if(i>=max)i=0;
  const ls=i/b.sampleRate;return [ls,Math.min(b.duration,ls+len)];
}
function startFile(){
  const b=bgmFile.buf[bgmWant],[ls,le]=loopPoints(b,BGM_FILES[bgmWant].len);
  if(!bgmFile.gain){bgmFile.gain=ac.createGain();bgmFile.gain.gain.value=BGM_VOL;bgmFile.gain.connect(ac.destination)}
  const src=ac.createBufferSource();src.buffer=b;src.loop=true;src.loopStart=ls;src.loopEnd=le;src.connect(bgmFile.gain);

  const P=512,GH=H-GY,b=new Buf(P,GH),r=rng(11),n=makeNoise(5);
  const pal=pals(['#a6da62','#8acb50','#72b844','#5ea23a','#4b8a31','#3a7128']);
  for(let y=0;y<GH;y++)for(let x=0;x<P;x++){
    const v=.62-y/GH*.3+(n(x,y*1.9,32,P)-.5)*.55+(n(x,y*2.2,8,P)-.5)*.35;
    b.set(x,y,pick(pal,clamp(v,0,.99),x,y));
  }
  // 土の地面
  const dirt=pals(['#d2b080','#b48e5e','#946e44','#76552f']);
  for(let k=0;k<10;k++){
    const cx=r()*P,cy=8+r()*(GH-14),rw=10+r()*24,rh=(2+r()*3.5)*(.6+cy/GH);
    for(let j=Math.floor(-rh-2);j<=rh+2;j++)for(let i=Math.floor(-rw-3);i<=rw+3;i++){
      const e=i*i/(rw*rw)+j*j/(rh*rh)+(n(cx+i,cy+j,4,P)-.5)*.9;
      if(e<1)b.setW(cx+i,cy+j,e>.78?dirt[3]:j<-rh*.35?dirt[0]:pick(dirt.slice(1,3),.5+(n(cx+i,cy+j,2,P)-.5),cx+i,cy+j));
    }
  }
  // 草の葉
  for(let k=0;k<3200;k++){
    const x=r()*P|0,y=2+r()*(GH-2)|0,l=1+(r()*(1+y/GH*3)|0),dark=r()<.55,c=dark?pal[5]:pal[0];
    for(let i=0;i<l;i++)b.setW(x+(i===l-1&&r()<.4?(r()<.5?-1:1):0),y-i,c);
    if(dark)b.setW(x,y-l,pal[2]);
  }
  // 花
  const fl=pals(['#ffffff','#fff07a','#ff8a8a','#d8a0ff','#ffb347']);
  for(let k=0;k<80;k++){const x=r()*P|0,y=4+r()*(GH-6)|0,c=fl[r()*5|0];b.setW(x,y,c);if(r()<.6){b.setW(x+1,y,c);b.setW(x,y+1,pal[5])}}
  // 森とのさかいの影
  for(let x=0;x<P;x++)for(let y=0;y<4;y++)if(y<2||bay(x,y)<0)b.set(x,y,mix(pal[5],[20,50,20],.4-y*.08));
  return b.canvas();
}
function makeTree(){
  const b=new Buf(52,66),r=rng(21),n=makeNoise(9);

  for(let y=34;y<66;y++){const sp=y>56?(y-56)*1.3:0,hw=3.5+sp+(y<40?(40-y)*.3:0);
    for(let x=-hw;x<=hw;x++){const t=(x+hw)/(2*hw)+(n(x*3,y,2,999)-.5)*.3;b.set(26+x,y,bark[clamp(Math.floor(t*4),0,3)])}}
  const leaf=pals(['#b6e06a','#8cc650','#68a83e','#4e8c32','#386e28','#26541e']);
  const cl=[];for(let k=0;k<34;k++){const a=r()*Math.PI*2,d=Math.sqrt(r())*16;cl.push([26+Math.cos(a)*d*1.15,25+Math.sin(a)*d*.9,5+r()*5])}
  cl.sort((a,b)=>b[1]-a[1]);
  for(const [cx,cy,rr] of cl)for(let j=-rr;j<=rr;j++)for(let i=-rr;i<=rr;i++){

function makeRock(seed,w,h){

    const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry,e=dx*dx+dy*dy*(dy>0?2.6:1)+(n(x,y,3,99)-.5)*.25;
    if(e>=1)continue;const nz=Math.sqrt(1-Math.min(.99,e)),li=-dx*.55-dy*.75+nz*.5;

// スライム: しずく形。左上から光、白いつや
function makeSlime(sq){
  const W2=36,H2=30,b=new Buf(W2,H2),pal=pals(['#e8f8ff','#a6dcff','#72bcf8','#4f9cec','#3480dc','#2466c4','#1a50a2']);
  const sx=sq?1.12:1,sy=sq?.8:1;
  for(let y=0;y<H2;y++)for(let x=0;x<W2;x++){
    const px=(x+.5-18)/(14*sx),py=(H2-1-(y+.5))/(25*sy);
    if(py<0||py>1)continue;
    const wd=py<.42?Math.sqrt(Math.max(0,1-((.42-py)/.52)**2)):Math.pow(Math.max(0,1-(py-.42)/.6),1.25);
    const tip=py>.8?(py-.8)*.8:0;
    if(Math.abs(px-tip)>=wd)continue;
    let v=.4+px*.36-(py-.35)*.55+(Math.abs(px)>wd-.1?.12:0);
    const hl=Math.hypot((px+.38)*1.2,py-.6);if(hl<.12)v=-.3;else if(hl<.2)v-=.18;
    b.set(x,y,pick(pal,clamp(v,0,.99),x,y));
  }
  const ink=hex('#0b1838'),wht=hex('#ffffff'),ey=H2-1-Math.round(.36*25*sy)-2;
  for(const ex of [12,22])for(let j=0;j<5;j++)for(let i=0;i<3;i++)if(!(j===0&&i!==1)&&!(j===4&&i!==1))b.set(ex+i,ey+j,ink);
  for(const ex of [12,22])b.set(ex+1,ey+1,wht);
  for(let x=16;x<=20;x++)b.set(x,ey+7+(x===16||x===20?-1:0),ink);
  return sprC(b.outline(hex('#0e3478')).canvas());
}

    const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry,e=dx*dx+dy*dy;if(e<1)sh(x,y,dx,dy,Math.sqrt(1-e),pal,bias)}};
  const cap=(ax,ay,bx,by,rad,pal,bias=0)=>{const L=Math.hypot(bx-ax,by-ay)||1;
    for(let y=Math.floor(Math.min(ay,by)-rad);y<=Math.max(ay,by)+rad;y++)for(let x=Math.floor(Math.min(ax,bx)-rad);x<=Math.max(ax,bx)+rad;x++){
      const t=clamp(((x-ax)*(bx-ax)+(y-ay)*(by-ay))/(L*L),0,1),qx=ax+(bx-ax)*t,qy=ay+(by-ay)*t,dx=(x+.5-qx)/rad,dy=(y+.5-qy)/rad,e=dx*dx+dy*dy;
      if(e<1)sh(x,y,dx,dy,Math.sqrt(1-e),pal,bias)}};

    for(let y=Math.floor(Math.min(...ys));y<=Math.max(...ys);y++)for(let x=Math.floor(Math.min(...xs));x<=Math.max(...xs);x++)if(inPoly(pts,x+.5,y+.5))fn(x,y)};

  // しっぽ

  for(let i=0;i<tp.length-1;i++)cap(tp[i][0],tp[i][1],tp[i+1][0],tp[i+1][1],7-i*1.4,SKIN,.08);
  tri(100,70,104,62,106,72,HORN);tri(90,86,94,80,97,88,HORN);
  // 奥の足と腕
  ell(70,84,10,9,SKIN,.18);ell(73,94,8,3.5,SKIN,.25);
  cap(72,56,84,68,4,SKIN,.15);ell(86,70,5,4,SKIN,.12);flame(88,66,14+f*3,5);
  // 胴とおなか
  ell(58,64,21,24,SKIN);
  ell(52,68,12,18,BELLY);
  for(let y=54;y<84;y+=5)for(let x=42;x<63;x++)if(((x+.5-52)/12)**2+((y+.5-68)/18)**2<.92)b.set(x,y,hex('#c87a2c'));
  tri(68,44,74,36,74,48,HORN);tri(74,50,82,44,80,56,HORN);tri(78,58,86,54,82,64,HORN);

  ell(22,42,10,4,SKIN,.12);
  for(let x=11;x<31;x++)for(let y=36;y<40;y++)if(x>11+(39-y)*.3)b.set(x,y,hex(y>=38?'#c02c3c':'#3c0608'));
  for(const tx of [12,16,20,24,28])tri(tx,36,tx+2.5,36,tx+1,39,HORN);

  tri(45,26,52,24,46,32,HORN);tri(45,33,51,34,45,38,HORN);

/* ---------- キャラのグラフィックシート（sprites.png / sprites.json） ---------- */
// sprites.png を描きかえて置くと、ゲームのキャラの絵がその絵になる（どの絵がどこにあるかは sprites.json）。
// 読めないとき（ファイルがない・?nosheet を付けたとき）は、上のコードで描いた絵のまま。
// 絵は右向きで描く（左向きと、当たったときの白い絵はゲームが作る）。足もとがセルの下の端、左右の真ん中がキャラの立つ位置
const SHEET={loaded:false,weaponIn:new Set()};
// 面積の平均で縮める（どのブラウザでも同じ結果）。ふちの半透明はなくして、ドットの輪郭をくっきりさせる
function shrink(src,w,h){
  const sw=src.width,sh=src.height,s=src.getContext('2d').getImageData(0,0,sw,sh).data,o=canvasOf(w,h),ox=o.getContext('2d'),im=ox.createImageData(w,h),d=im.data;
  const fx=sw/w,fy=sh/h;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let r=0,g=0,b=0,a=0,t=0;const x0=x*fx,x1=x0+fx,y0=y*fy,y1=y0+fy;
    for(let yy=Math.floor(y0);yy<Math.ceil(y1);yy++){const wy=Math.min(y1,yy+1)-Math.max(y0,yy);
      for(let xx=Math.floor(x0);xx<Math.ceil(x1);xx++){const wx=Math.min(x1,xx+1)-Math.max(x0,xx),wgt=wx*wy,i=(yy*sw+xx)*4,al=s[i+3]*wgt;
        r+=s[i]*al;g+=s[i+1]*al;b+=s[i+2]*al;a+=al;t+=wgt}}
    const k=(y*w+x)*4,A=a/t;
    if(A>110&&a>0){d[k]=r/a;d[k+1]=g/a;d[k+2]=b/a;d[k+3]=255}
  }
  ox.putImageData(im,0,0);return o;
}
async function loadSheet(){
  if(/[?&]nosheet\b/.test(location.search))return;
  try{
    // ?preview: シートエディタで描きかえ中のシート（同じサイトの localStorage）で試す
    let pv=null;if(/[?&]preview\b/.test(location.search))try{pv=JSON.parse(localStorage.getItem('susumeYusha.sheetPreview'))}catch(e){}
    const meta=pv?pv.json:await (await fetch('sprites.json',{cache:'no-cache'})).json();
    const img=new Image();
    img.src=pv?pv.png:URL.createObjectURL(await (await fetch('sprites.png',{cache:'no-cache'})).blob());await img.decode();
    // セルは描くときの大きさ（キャラ 48、敵は2倍）。s（表示の倍率）に合わせて縮めて使う
    const F=meta.frames,cut=k=>{const f=F[k];if(!f)return null;let c=canvasOf(f.w,f.h);c.getContext('2d').drawImage(img,f.x,f.y,f.w,f.h,0,0,f.w,f.h);
      if(f.s&&f.s!==1)c=shrink(c,Math.max(1,Math.round(f.w*f.s)),Math.max(1,Math.round(f.h*f.s)));return sprC(c)};
    const set=(obj,key,name)=>{const s2=cut(name);if(s2)obj[key]=s2};
    for(const k in CLS){set(CLS[k].spr,0,`char.${k}.0`);set(CLS[k].spr,1,`char.${k}.1`);set(CLS[k],'pose',`char.${k}.pose`)}
    for(const k in MOB){set(MOB[k].spr,0,`mob.${k}.0`);set(MOB[k].spr,1,`mob.${k}.1`)}
    for(const k of ['slime','bat','skel','wiz'])SP[k].forEach((_,i)=>set(SP[k],i,`enemy.${k}.${i}`));
    SP.dragon.forEach((_,i)=>set(SP.dragon,i,`boss.dragon.${i}`));
    SHEET.weaponIn=new Set(meta.weaponInSprite||[]);   // 絵に武器が入っているキャラは、ゲームが武器を重ねて描かない
    SHEET.loaded=true;
  }catch(e){}
}
loadSheet();

function digits(n,x,y,col,k=2){
  const s=String(n),cw=4*k;x=Math.round(x-s.length*cw/2);y=Math.round(y-5*k);
  for(const ch of s){const d=DIG[+ch];
    ctx.fillStyle='#000';for(let i=0;i<15;i++)if(d[i]==='1')for(const [ox,oy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1]])ctx.fillRect(x+(i%3)*k+ox,y+(i/3|0)*k+oy,k,k);
    ctx.fillStyle=col;for(let i=0;i<15;i++)if(d[i]==='1')ctx.fillRect(x+(i%3)*k,y+(i/3|0)*k,k,k);
    x+=cw;}
}

  ['rock',1440,80],['tree',1500,80],['tree',1725,84],['rock',1830,40],['crate',1950,64],['crate',2160,30],['tree',2340,30],
  ['rock',2430,76],['rock',2660,78],['crate',2715,20],['tree',3000,12],['tree',3040,24],['rock',3090,52],['crate',3405,74],
  ['rock',3420,70],['tree',3465,40],['crate',3700,30],['rock',3720,18],['tree',3975,70],['tree',4180,16]].map(([t,x,z])=>({t,x,z,...OB_DEF[t]}));
const ALLY_SPOTS=[{cls:'warrior',x:960,z:50},{cls:'mage',x:1875,z:36},{cls:'priest',x:2970,z:58}];
const MOB_SPOTS=[{cls:'town',x:720,z:72},{cls:'child',x:1350,z:22},{cls:'woman',x:1695,z:62},{cls:'merchant',x:2370,z:60},{cls:'soldier',x:2700,z:42},{cls:'princess',x:3360,z:46},{cls:'king',x:3750,z:62}];
const SLOTS=[{dx:-24,dz:-18},{dx:-24,dz:18},{dx:-44,dz:0}];

function inHole(x,z,m=3){for(const h of HOLES)if(x>h[0]+m&&x<h[1]-m&&z>h[2]+m&&z<h[3]-m)return h;return null}
function obAt(x,z,h){for(const o of OBS)if(Math.abs(x-o.x)<o.w+3&&Math.abs(z-o.z)<o.d+2&&h<o.ht-3)return o;return null}
function groundAt(x,z,h){
  let g=-999,on=false;
  for(const o of OBS)if(Math.abs(x-o.x)<o.w&&Math.abs(z-o.z)<o.d&&h>=o.ht-3){g=Math.max(g,o.ht);on=true}
  if(on)return g;
  return inHole(x,z)?-999:0;
}
function moveBody(e,dx,dz){
  if(obAt(e.x,e.z,e.h)){e.x+=dx;e.z+=dz;return}
  if(!obAt(e.x+dx,e.z,e.h))e.x+=dx;
  if(!obAt(e.x,e.z+dz,e.h))e.z+=dz;
}

/* ---------- 入力 ---------- */
const input={x:0,y:0,sx:0,sy:0,charging:false,release:false,keys:{}};
const zone=$('#stickZone'),stick=$('#stick'),knob=$('#knob');
let stickId=null,stickT0=0,stickX0=0,stickY0=0,stickMoved=0,stickCenter=false;
function stickMove(e){
  const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width*.4;
  let dx=e.clientX-cx,dy=e.clientY-cy;const len=Math.hypot(dx,dy);
  if(len>R){dx=dx/len*R;dy=dy/len*R}
  knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  stickMoved=Math.max(stickMoved,Math.hypot(e.clientX-stickX0,e.clientY-stickY0));
  const m=Math.min(1,len/R);
  if(m<.2){input.sx=input.sy=0}else{const k=Math.min(1,(m-.2)/.6)/m;input.sx=dx/R*k;input.sy=dy/R*k}
}
function slashTap(){input.release=true;knob.classList.add('tap');setTimeout(()=>knob.classList.remove('tap'),150)}
function stickRelease(tap){
  stickId=null;input.sx=input.sy=0;knob.style.transform='';
  input.charging=false;
  if(tap&&stickCenter)slashTap();   // 中央のつまみから始めたタッチは、放すと斬撃（ためていたら、ためた斬撃）。そのまま指を動かせば、ためながら移動できる。矢印の上から始めたときは移動だけ
}
// 円盤の操作として受けるのは、操作エリアの下側か円盤の円の中で始めたタッチ（円盤が上にはみ出しても受ける）
function onStick(x,y){
  const z=zone.getBoundingClientRect(),r=stick.getBoundingClientRect();
  return (y>=z.top&&x>=z.left&&x<=z.right)||Math.hypot(x-r.left-r.width/2,y-r.top-r.height/2)<r.width/2;
}
function stickStart(id,x,y){
  initAudio();
  if(stickId!==null){slashTap();return}   // 動かしながら別の指で円盤をタップ → 斬撃
  stickId=id;stickT0=performance.now();stickX0=x;stickY0=y;stickMoved=0;
  const r=stick.getBoundingClientRect();stickCenter=Math.hypot(x-r.left-r.width/2,y-r.top-r.height/2)<r.width*.2;
  input.charging=stickCenter;
  stickMove({clientX:x,clientY:y});
}
// スマホはタッチイベントで受ける（iOS や Artifact の中でもスクロールに取られにくい）。マウスはポインターイベント
const panelEl=$('#panel');
panelEl.addEventListener('touchstart',e=>{
  if(e.target.closest('button'))return;   // 一時停止ボタンは普通に押せるようにする
  e.preventDefault();
  for(const t of e.changedTouches)if(onStick(t.clientX,t.clientY))stickStart('t'+t.identifier,t.clientX,t.clientY);
},{passive:false});
panelEl.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches)if('t'+t.identifier===stickId)stickMove(t);
},{passive:false});
const touchEnd=e=>{for(const t of e.changedTouches)if('t'+t.identifier===stickId)stickRelease(e.type==='touchend')};
panelEl.addEventListener('touchend',touchEnd);panelEl.addEventListener('touchcancel',touchEnd);
panelEl.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'||e.target.closest('button')||!onStick(e.clientX,e.clientY))return;
  try{panelEl.setPointerCapture(e.pointerId)}catch(_){}stickStart('p'+e.pointerId,e.clientX,e.clientY);
});
panelEl.addEventListener('pointermove',e=>{if('p'+e.pointerId===stickId)stickMove(e)});
const ptrEnd=e=>{if('p'+e.pointerId===stickId)stickRelease(e.type==='pointerup')};
panelEl.addEventListener('pointerup',ptrEnd);panelEl.addEventListener('pointercancel',ptrEnd);
const KEYS={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d'};
addEventListener('keydown',e=>{
  if(KEYS[e.code]){input.keys[KEYS[e.code]]=true;e.preventDefault()}
  if((e.code==='Space'||e.code==='KeyZ'||e.code==='KeyK')&&!e.repeat){initAudio();input.charging=true;e.preventDefault()}
  if(e.code==='Escape'||e.code==='KeyP')togglePause();
});
addEventListener('keyup',e=>{if(KEYS[e.code])input.keys[KEYS[e.code]]=false;if((e.code==='Space'||e.code==='KeyZ'||e.code==='KeyK')&&input.charging){input.charging=false;input.release=true}});
function readInput(){
  const k=input.keys,kx=(k.r?1:0)-(k.l?1:0),ky=(k.d?1:0)-(k.u?1:0);
  if(kx||ky){const l=Math.hypot(kx,ky);input.x=kx/l;input.y=ky/l}else{input.x=input.sx;input.y=input.sy}
}

function addFx(x,z,h,col,n=6,sp=50){for(let i=0;i<n;i++)G.fx.push({x,z,h,vx:rnd(-sp,sp),vh:rnd(10,sp*1.4),life:rnd(.25,.5),col})}
function popNum(x,z,h,n,col,big=false){G.fx.push({x:x+rnd(-3,3),z,h,num:n,col,big,life:.8,vh:big?95:80,vx:0})}
function damage(m,amt,dir){
  if(m.inv>0||m.hp<=0||G.state!=='play')return;
  m.hp=Math.max(0,m.hp-amt);m.inv=m===G.hero?1:.8;m.kx=dir*130;m.flash=.15;
  popNum(m.x,m.z,m.h+38,amt,'#f83800');sfx('hurt');

// ダメージ: 基本値の ±15%。8% で会心（2倍、黄色の大きな数字）
function roll(base){const crit=Math.random()<.08;let d=Math.max(1,Math.round(base*rnd(.85,1.15)));if(crit)d*=2;return [d,crit]}
// 命中演出: 火花・斬撃の線・数字。剣のときは一瞬止める（ヒットストップ）
function hitFx(x,z,h,dir,d,crit,slash){
  G.fx.push({k:'spark',x:x-dir*3,z,h,life:.22,max:.22,crit,vx:0,vh:0});
  if(slash)G.fx.push({k:'slash',x,z,h,dir,life:.16,max:.16,vx:0,vh:0});
  popNum(x,z,h+14,d,crit?'#ffd84a':'#ffffff',crit);
  if(slash)G.hitstop=Math.max(G.hitstop||0,crit?.09:.045);
  if(crit){G.shake=Math.max(G.shake,.12);tone(1320,.12,'square',.12,400)}
}
function hitEnemy(e,base,dir,slash=false){
  if(e.hp<=0)return;
  const [d,crit]=roll(base);
  e.hp-=d;e.flash=.14;e.kx=dir*(e.type==='skel'?80:130);
  hitFx(e.x,e.z,e.h+e.ht*.55,dir,d,crit,slash);
  if(e.hp<=0){e.dead=true;G.kills++;launch(e,dir||1);addFx(e.x,e.z,e.h+e.ht/2,e.col,8,60);sfx('kill')}else sfx('hit');
}
function hitBoss(base,dir=-1,slash=false){
  const b=G.boss;if(!b||b.hp<=0||b.inv>0||b.state==='enter')return;
  const [d,crit]=roll(base);
  b.hp-=d;b.inv=.12;b.flash=.1;hitFx(b.x-24,b.z,b.h+50,dir,d,crit,slash);sfx('hit');
  if(b.hp<=0){b.hp=0;b.state='die';b.t=0;G.enemies.forEach(e=>{e.dead=true});G.shots=G.shots.filter(s=>s.friend);stopBgm()}
}
// 剣: 近くに敵がいると自動で振って、前方の敵をまとめて薙ぎ払う
function trySwing(m,range,dmg){
  if(m.swCD>0)return;
  let best=null,bd=1e9;
  for(const e of G.enemies){
    if(e.dead||e.falling)continue;
    const dx=e.x-m.x,dz=e.z-m.z;
    if(Math.abs(dz)<16&&Math.abs(dx)<range&&Math.abs(e.h+e.ht/2-m.h-16)<30){const d=Math.abs(dx)+Math.abs(dz);if(d<bd){bd=d;best=e}}
  }
  const b=G.boss,bossNear=b&&b.hp>0&&b.state!=='enter'&&Math.abs(b.z-m.z)<22&&Math.abs(b.x-m.x)<range+b.w;
  if(!best&&!bossNear)return;
  m.face=(best?best.x:b.x)>=m.x?1:-1;
  m.swing=.2;m.swCD=.36;sfx('swing');
  for(const e of G.enemies){
    if(e.dead||e.falling)continue;
    const dx=(e.x-m.x)*m.face;
    if(dx>-10&&dx<range+6&&Math.abs(e.z-m.z)<18&&Math.abs(e.h+e.ht/2-m.h-16)<32)hitEnemy(e,dmg,m.face,true);
  }
  if(bossNear&&(b.x-m.x)*m.face>-b.w)hitBoss(dmg,m.face,true);
}

/* ---------- 敵 ---------- */
const ET={
  slime:{hp:9,w:12,ht:22,dmg:6,spd:28,col:'#3cbcfc'},
  bat:{hp:8,w:12,ht:16,dmg:5,spd:44,col:'#9878f8',fly:true},
  skel:{hp:30,w:11,ht:30,dmg:10,spd:20,col:'#fcfcfc'},
  wiz:{hp:20,w:11,ht:30,dmg:4,spd:26,col:'#6844fc'},
};
function freeZ(x){for(let i=0;i<8;i++){const z=rnd(6,DEPTH-6);if(!obAt(x,z,0)&&!inHole(x,z,-6))return z}return rnd(6,DEPTH-6)}
function spawnEnemy(type,x,z,force=false){
  if(G.enemies.length>=11&&!force)return;
  const d=ET[type];
  G.enemies.push({type,x,z:z??freeZ(x),h:d.fly?24:0,hp:d.hp,w:d.w,ht:d.ht,dmg:d.dmg,spd:d.spd*rnd(.85,1.15),col:d.col,
    t:rnd(0,6),kx:0,flash:0,face:-1,cast:2+rnd(0,1.5),charge:0,falling:0,dead:false,target:null});
  return G.enemies[G.enemies.length-1];
}
// 道の仲間: 画面に入る前に魔物の群れが取りかこむ。全部たおすと助けられる。画面の左へ流れたら助けられない
const GUARDS={warrior:['slime','slime','slime','skel'],mage:['skel','skel','bat','bat'],priest:['skel','wiz','skel','bat','bat'],
  town:['slime','slime'],child:['bat','slime'],woman:['skel','slime'],merchant:['slime','slime','bat'],soldier:['skel','skel'],princess:['skel','wiz','bat'],king:['skel','skel','wiz']};
const npcName=n=>(n.mob?MOB:CLS)[n.cls].name;
function updNpcs(){
  for(const n of G.npcs){
    if(n.state==='wait'&&n.x<G.camX+W+70){
      n.state='captive';n.guards=[];
      const list=GUARDS[n.cls];
      list.forEach((t,i)=>{const a=i/list.length*Math.PI*2+.4,e=spawnEnemy(t,n.x+Math.cos(a)*34,clamp(n.z+Math.sin(a)*18,4,DEPTH-4),true);
        e.guard=n;e.ang=a;n.guards.push(e)});
      say(`${npcName(n)}が まものに おそわれている！`);
    }else if(n.state==='captive'){
      if(n.guards.every(e=>e.dead)){
        if(n.mob){   // 町の人: 後ろをついてくる
          n.state='joined';G.followers.push({cls:n.cls,x:n.x,z:n.z,h:0,walk:0,face:1});
          say(`${npcName(n)}を たすけた！`);tone(midi(79),.1,'square',.12);tone(midi(84),.18,'square',.12,0,.1);addFx(n.x,n.z,20,'#fcd800',10,50);
          continue;
        }
        n.state='joined';const a=member(n.cls,n.x,n.z);a.face=1;G.allies.push(a);
        say(`${CLS[n.cls].name}を たすけた！ なかまに くわわった！`);say(`ためぎりが ${maxLv()}だんかい まで できるように なった！`);sfx('join');addFx(n.x,n.z,20,'#fcd800',14,60);
      }else if(n.x<G.camX-14){
        n.state='lost';n.guards.forEach(e=>{e.guard=null});
        say(`${npcName(n)}を たすけられなかった…`);sfx('down');
      }
    }

}
function spawnLogic(dt){
  if(G.locked)return;
  const edge=G.camX+W+24,prog=G.camX/END;
  if(!G.wizIntro&&G.camX>1140){G.wizIntro=true;spawnEnemy('wiz',edge,30);say('まどうしの まほうは けんで はじけない！ よけろ！')}
  while(G.camX+W>=G.nextSpawn){
    const pool=prog<.15?['slime','slime']:prog<.3?['slime','slime','bat']:prog<.5?['slime','bat','skel']:['slime','bat','skel','wiz','skel'];
    const n=prog<.2?2:prog<.6?3:4;
    for(let i=0;i<n;i++)spawnEnemy(pool[Math.random()*pool.length|0],edge+i*26);
    G.nextSpawn+=rnd(120,190);
  }
  G.spawnT-=dt;
  if(G.spawnT<=0){G.spawnT=rnd(2.6,3.6)-prog*1.2;spawnEnemy(prog<.3?'slime':Math.random()<.4?'bat':'slime',edge)}
}
function updEnemy(e,dt){
  e.t+=dt;e.flash-=dt;
  if(e.falling){e.falling+=dt;e.h-=120*dt;if(e.falling>.6)e.dead=true;return}
  const tg=e.target&&e.target.hp>0&&party().includes(e.target)?e.target:G.hero;
  const dx=tg.x-e.x,dz=tg.z-e.z,dist=Math.hypot(dx,dz)||1;
  let vx=0,vz=0;
  const n=e.guard;
  if(n&&n.state==='captive'&&!e.aggro&&Math.hypot(G.hero.x-e.x,G.hero.z-e.z)<96)e.aggro=true;
  if(n&&n.state==='captive'&&!e.aggro){
    e.ang+=dt*.7;const lunge=Math.max(0,Math.sin(e.t*2.6+e.ang*3))*16,rad=34-lunge;
    const tx=n.x+Math.cos(e.ang)*rad,tz=n.z+Math.sin(e.ang)*rad*.55;
    vx=clamp((tx-e.x)*4,-60,60);vz=clamp((tz-e.z)*4,-50,50);
    if(e.type==='slime')e.h=Math.max(0,Math.sin(e.t*7))*9;else if(e.type==='bat')e.h=20+Math.sin(e.t*5)*8;
    if(lunge>12)n.hurt=.15;
    e.face=n.x<e.x?-1:1;
    vx+=e.kx;e.kx-=e.kx*Math.min(1,dt*8);
    if(ET[e.type].fly){e.x+=vx*dt;e.z+=vz*dt}else moveBody(e,vx*dt,vz*dt);
    e.z=clamp(e.z,2,DEPTH-2);
    return;
  }
  if(e.type==='slime'){
    const hop=Math.sin(e.t*7);e.h=Math.max(0,hop)*9;
    if(hop>0){vx=dx/dist*e.spd*1.6;vz=dz/dist*e.spd*1.6}
  }else if(e.type==='bat'){
    e.h=20+Math.sin(e.t*5)*8;vx=dx/dist*e.spd;vz=dz/dist*e.spd+Math.cos(e.t*3)*20;
  }else if(e.type==='skel'){
    vx=dx/dist*e.spd;vz=dz/dist*e.spd;
  }else if(e.type==='wiz'){
    const want=84,adx=Math.abs(dx);
    vx=adx>want+10?Math.sign(dx)*e.spd:adx<want-20?-Math.sign(dx)*e.spd:0;
    vz=clamp(dz,-1,1)*e.spd*.6;
    e.cast-=dt;
    if(e.cast<.45&&!e.charge){e.charge=1}
    if(e.cast<=0&&e.x<G.camX+W-4){
      e.cast=rnd(2.3,3.1);e.charge=0;
      const a=Math.atan2(dz,dx);
      G.shots.push({kind:'magic',x:e.x+Math.sign(dx)*12,z:e.z,h:16,vx:Math.cos(a)*78,vz:Math.sin(a)*78,dmg:12,life:4,friend:false});
      sfx('magic');e.target=Math.random()<.35&&G.allies.length?G.allies[Math.random()*G.allies.length|0]:G.hero;
    }
  }
  e.face=dx<0?-1:1;
  vx+=e.kx;e.kx-=e.kx*Math.min(1,dt*8);
  if(ET[e.type].fly){e.x+=vx*dt;e.z+=vz*dt}else moveBody(e,vx*dt,vz*dt);
  e.z=clamp(e.z,2,DEPTH-2);
  if(!ET[e.type].fly&&e.h<1&&inHole(e.x,e.z)){e.falling=.001;return}
  if(e.x<G.camX-40)e.dead=true;
  // ぶつかる
  for(const m of party()){

/* ---------- ボス ---------- */
// 助けた町の人: 画面の左の最後列を、スクロールに合わせて歩く。ボス戦では画面の外へかくれ、勝ったら入ってきて後ろに並ぶ
function updFollowers(dt){
  const n=G.followers.length,won=G.state==='won',hide=G.locked&&!won;
  G.followers.forEach((f,i)=>{
    let tx,tz,sp;
    if(won){tx=G.lineX-17+(i-(n-1)/2)*22;tz=clamp(G.lineZ-22,2,DEPTH-2);sp=110}
    else if(hide){tx=G.camX-40;tz=f.z;sp=90}
    else{tx=G.camX+14+(n-1-i)*15;tz=clamp(G.hero.z+((i%3)-1)*16,4,DEPTH-4);sp=SCROLL+90}
    const dx=tx-f.x,dz=tz-f.z,mx=clamp(dx,-sp*dt,sp*dt),mz=clamp(dz,-50*dt,50*dt);
    f.x+=mx;f.z+=mz;

    f.face=dx<-2?-1:1;
    f.h=inHole(f.x,f.z)?Math.abs(Math.sin(G.t*9))*10:0;   // 穴の上は跳ねてわたる
    if(won&&Math.abs(dx)<2&&G.clearT>1.2){f.face=1;f.h=Math.max(0,Math.sin(G.clearT*7+i*1.3))*8}   // 勝ったら喜んで跳ねる
  });
}
function drawFollower(f){

  if(m.spear){const sx=SX(f.x)+f.face*9,sy=Math.round(GY+f.z-f.h);ctx.fillStyle='#8a5a28';ctx.fillRect(sx,sy-34,2,30);ctx.fillStyle='#d8dee6';ctx.fillRect(sx-1,sy-40,4,6);ctx.fillStyle='#ffffff';ctx.fillRect(sx,sy-40,1,4)}
}
function startBoss(){

function updBoss(dt){
  const b=G.boss,p=G.hero;

  const rage=b.hp<b.max/2;
  if(b.state==='enter'){b.x-=50*dt;if(b.x<=b.home){b.x=b.home;b.state='idle';b.t=0}return}

  }else if(b.state==='fire'){

      const n=rage?5:3,a0=Math.atan2(p.z-b.z,p.x-b.x);
      for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.22;G.shots.push({kind:'boss',x:b.x-40,z:b.z,h:58,fallTo:16,vx:Math.cos(a)*90,vz:Math.sin(a)*90*.8,dmg:14,life:4,friend:false})}
      sfx('magic');b.state='idle';b.t=0;

  }else if(b.state==='back'){

/* ---------- 味方 ---------- */
function updMember(m,dt){
  m.inv-=dt;m.flash-=dt;m.swing-=dt;m.swCD-=dt;m.atkCD-=dt;
  m.kx-=m.kx*Math.min(1,dt*8);
}
function findSafe(x,z){
  for(let dx=0;dx<160;dx+=8)for(const zz of [z,46,24,68,10,82]){
    const xx=x+dx;if(!inHole(xx,zz,-10)&&!obAt(xx,zz,0))return {x:xx,z:zz};
  }
  return {x,z};
}
// 自動ジャンプ: 進む先に穴か、こえられる障害物（岩・箱）があると跳ぶ。向こう側まで届く速さで飛ぶ
const AIR_T=2*245/620;
function blocker(x,z,h){if(inHole(x,z,2))return true;const o=obAt(x,z,h);return !!(o&&o.ht<99)}
function autoJump(p,vx,vz){
  const sp=Math.hypot(vx,vz);if(sp<8)return;
  const ux=vx/sp,uz=vz/sp;
  let hit=0;for(const d of [10,16])if(blocker(p.x+ux*d,p.z+uz*d,p.h)){hit=d;break}
  if(!hit)return;
  let d=hit;   // 見つけた所から向こう側を探す
  const bad=d=>{const z=p.z+uz*d;return z<2||z>DEPTH-2||blocker(p.x+ux*d,z,0)||obAt(p.x+ux*d,z,0)};
  while(d<120&&bad(d))d+=2;
  if(d>=120)return 'wall';   // 向こう側がない（木・地面の端まで続く穴）ときは跳ばない
  if(p.x+ux*(d+10)>G.camX+W-16||p.x+ux*(d+10)<G.camX+16)return 'wall';   // 着地点が画面の外になるときは、手前で待つ
  const need=Math.min(200,(d+10)/AIR_T*1.05),k=Math.max(sp,need)/sp;
  p.vh=245;p.onG=false;p.airV={vx:vx*k,vz:vz*k};sfx('jump');
  G.allies.forEach((a,i)=>{a.jd=.07*(i+1)});
}
// 飛ぶ斬撃: 剣を振って三日月の斬撃を飛ばす。長押しで3段階ため。ためた斬撃（1段以上）は大きく、敵をつらぬき、敵の弾を消す
const LV_T=[.5,1,1.6];   // 1・2・3段目がたまるまでの秒数
const WAVE=[   // 段ごとの 大きさ・ダメージ・速さ・射程(秒)・色（外側・内側）
  {r:10,dmg:12,spd:235,life:.75,c1:'#3c9cf0',c2:'#a8ecff'},
  {r:14,dmg:24,spd:255,life:1,c1:'#30d8e8',c2:'#c8fcff'},
  {r:18,dmg:42,spd:270,life:1.2,c1:'#ffb820',c2:'#ffe878'},
  {r:25,dmg:72,spd:285,life:1.4,c1:'#ff5020',c2:'#ffc080'},
];
const chargeLv=t=>Math.min(t>=LV_T[2]?3:t>=LV_T[1]?2:t>=LV_T[0]?1:0,maxLv());
const maxLv=()=>Math.min(3,G.allies.length);   // ためられる段の上限 = 仲間の数
function castSlash(p,lv){
  if(p.slashCD>0&&!lv)return;p.slashCD=.35;
  p.swing=.2;p.swCD=Math.max(p.swCD,.22);
  const w=WAVE[lv];
  G.shots.push({kind:'wave',x:p.x+p.face*18,z:p.z,h:p.h+17,vx:p.face*w.spd,vz:0,dmg:w.dmg,life:w.life,friend:true,lv,big:lv>0,pierce:lv>0,hitSet:new Set()});
  sfx('swing');
  if(lv){noise(.2+lv*.1,.25+lv*.05);tone(260-lv*40,.3,'sawtooth',.15,600)}
  if(lv===3)G.shake=Math.max(G.shake,.2);
}
function updHero(dt){
  const p=G.hero;updMember(p,dt);
  p.slashCD=(p.slashCD||0)-dt;
  if(p.fall){
    p.fall+=dt;p.h-=150*dt;
    if(p.fall>.8){
      p.fall=0;p.h=0;p.vh=0;const sp=findSafe(Math.max(p.safe.x,G.camX+30),p.safe.z);p.x=sp.x;p.z=sp.z;p.inv=0;
      damage(p,20,0);p.kx=0;p.inv=1.6;
    }
    return;
  }
  if(G.intro){   // スタート: 左の画面外から歩いて入ってくる（その間は操作・スクロール・敵なし）
    p.x+=70*dt;p.walk+=dt;p.face=1;
    if(p.x>=70){p.x=70;G.intro=false;p.safe={x:70,z:p.z}}
    return;
  }
  readInput();
  let ix=input.x,iy=input.y;
  if(Math.abs(ix)>.25&&p.swing<=0)p.face=ix>0?1:-1;
  // 方向を入れていないときは、強制スクロールに合わせて前へ歩く（ボス戦でカメラが止まったら止まる）
  const auto=!G.locked&&Math.abs(ix)<.25;   // 左右を入れていないとき（上下だけのときも）
  if(auto&&p.swing<=0)p.face=1;
  let vx=(auto?SCROLL:ix*130)+p.kx,vz=iy*90;
  if(!p.onG&&p.airV){vx=p.airV.vx+p.kx;vz=p.airV.vz}   // 跳んでいる間は踏み切ったときの速さで進む
  if(p.onG&&autoJump(p,vx-p.kx,vz)==='wall'){   // 跳べないときは穴に入らないよう、入る向きの動きを止める
    if(inHole(p.x+vx*dt,p.z,0))vx=0;
    if(inHole(p.x,p.z+vz*dt,0))vz=0;
  }
  moveBody(p,vx*dt,vz*dt);
  p.x=clamp(p.x,G.camX+16,G.camX+W-16);p.z=clamp(p.z,2,DEPTH-2);   // 左端に押されたら障害物もすり抜けて押し出される
  if(input.charging){
    p.charge=Math.min((LV_T[maxLv()-1]||0)+.2,(p.charge||0)+dt);const lv=chargeLv(p.charge);
    if(lv>(p.lv||0)){p.lv=lv;const n=[0,76,79,84][lv];tone(midi(n+12),.12,'square',.1);tone(midi(n+19),.18,'triangle',.08,0,.06)}   // 段が上がるたびに音
  }
  if(input.release){input.release=false;castSlash(p,chargeLv(p.charge||0));p.charge=0;p.lv=0}
  else if(!input.charging){p.charge=0;p.lv=0}
  const kc=input.charging&&p.charge>.12?'c'+chargeLv(p.charge):'';
  if(knob.dataset.c!==kc){['c0','c1','c2','c3'].forEach(c=>knob.classList.toggle(c,c===kc));knob.dataset.c=kc}
  p.vh-=620*dt;p.h+=p.vh*dt;
  const g=groundAt(p.x,p.z,p.h);
  if(g>-100&&p.h<=g){p.h=g;p.vh=0;p.onG=true;p.airV=null}else p.onG=false;
  if(g<-100&&p.h<-3){p.fall=.001;p.onG=false;sfx('fall');return}
  if(p.onG&&p.h===0&&!inHole(p.x,p.z,-10))p.safe={x:p.x,z:p.z};
  if(auto||Math.abs(ix)+Math.abs(iy)>.2)p.walk+=dt;
  trySwing(p,40,11);
}
function nearestEnemy(m,maxd){
  let best=null,bd=maxd;
  for(const e of G.enemies){if(e.dead||e.falling||e.x>G.camX+W+4)continue;const d=Math.hypot(e.x-m.x,(e.z-m.z)*1.5);if(d<bd){bd=d;best=e}}
  const b=G.boss;if(b&&b.hp>0&&b.state!=='enter'){const d=Math.abs(b.x-m.x)-10;if(d<bd)best=b}
  return best;
}
function updAlly(a,i,dt){
  updMember(a,dt);
  const p=G.hero,s=SLOTS[i];
  const tx=p.x+s.dx*p.face,tz=clamp(p.z+s.dz,2,DEPTH-2);
  const k=Math.min(1,dt*5);

  a.x=clamp(a.x,G.camX+14,G.camX+W-14);

  if(a.jd>0){a.jd-=dt;if(a.jd<=0){a.vh=230;a.jd=-1}}
  a.vh-=620*dt;a.h+=a.vh*dt;
  if(a.h<=0){a.h=0;a.vh=0;if(inHole(a.x,a.z))a.vh=120}  // 穴の上はぴょんと跳ねてわたる
  if(a.swing<=0)a.face=p.face;
  if(a.cls==='warrior')trySwing(a,36,17);
  else if(a.cls==='mage'){
    if(a.atkCD<=0){

      if(low){a.atkCD=4.5;const v=Math.min(24,low.max-low.hp);low.hp+=v;popNum(low.x,low.z,low.h+20,v,'#58d854');addFx(low.x,low.z,8,'#b8f818',8,30);sfx('heal')}

/* ---------- たま ---------- */
function updShots(dt){
  for(const s of G.shots){
    s.x+=s.vx*dt;s.z+=s.vz*dt;s.life-=dt;
    if(s.fallTo!=null&&s.h>s.fallTo)s.h=Math.max(s.fallTo,s.h-80*dt);   // ボスの火の玉は口から地面近くへ下りてくる
    if(s.z<-6||s.z>DEPTH+6||s.x<G.camX-10||s.x>G.camX+W+20)s.life=0;
    if(s.life<=0)continue;
    if(s.friend){
      const lv=s.lv||0,zr=s.kind==='wave'?12+lv*5:9,hr=s.kind==='wave'?24+lv*8:20,xr=s.kind==='wave'?6+lv*4:3;
      if(lv)for(const o of G.shots)if(!o.friend&&o.life>0&&Math.abs(o.x-s.x)<WAVE[lv].r*.8+6&&Math.abs(o.z-s.z)<zr&&Math.abs(o.h-s.h)<hr){   // ためた斬撃は敵の弾を消す
        o.life=0;G.fx.push({k:'spark',x:o.x,z:o.z,h:o.h,life:.2,max:.2,crit:true,vx:0,vh:0});addFx(o.x,o.z,o.h,o.kind==='boss'?'#ff8424':'#f878f8',6,50);tone(1568,.08,'square',.08,-600)}
      for(const e of G.enemies)if(!e.dead&&!e.falling&&!(s.hitSet&&s.hitSet.has(e))&&Math.abs(e.x-s.x)<e.w+xr&&Math.abs(e.z-s.z)<zr&&Math.abs(e.h+e.ht/2-s.h)<hr){
        hitEnemy(e,s.dmg,Math.sign(s.vx),s.kind==='wave');if(s.pierce)s.hitSet.add(e);else{s.life=0;break}}
      const b=G.boss;
      if(s.life>0&&b&&b.hp>0&&!(s.hitSet&&s.hitSet.has(b))&&Math.abs(b.x-s.x)<b.w&&Math.abs(b.z-s.z)<20){b.inv=0;hitBoss(s.dmg,Math.sign(s.vx),s.kind==='wave');if(s.pierce)s.hitSet.add(b);else s.life=0}
    }else{
      // 魔法は剣で薙ぎ払えない。ジャンプか移動でよける
      for(const m of party()){
        if(Math.abs(m.x-s.x)<11&&Math.abs(m.z-s.z)<8&&Math.abs(m.h+16-s.h)<13&&m.inv<=0){
          damage(m,s.dmg,Math.sign(s.vx));s.life=0;addFx(s.x,s.z,s.h,'#f878f8',6,40);
          if(m===G.hero&&!G.magicTold){G.magicTold=true;say('まほうは けんでは はじけない！ うごいて かわせ！')}
          break;
        }
      }
    }
  }
  G.shots=G.shots.filter(s=>s.life>0);
}

/* ---------- 更新 ---------- */
function update(dt){
  G.t+=dt;G.shake-=dt;
  updMsg(dt);
  for(const f of G.fx){f.life-=dt;f.x+=f.vx*dt;f.h+=f.vh*dt;if(f.num!=null)f.vh*=Math.pow(.02,dt);else if(!f.k)f.vh-=200*dt}
  G.fx=G.fx.filter(f=>f.life>0);
  if(G.state==='over'){G.overT+=dt;if(G.overT>1.6&&!overlayShown)showOver();return}
  if(G.state==='won'){   // 勝利: みんなで小さく跳んで、正面を向いて決めポーズ
    G.clearT+=dt;
    const lx=G.camX+W/2+17,lz=36,OFF=[0,-34,34,-68];   // 勇者を真ん中に横一列に並ぶ（画面の真ん中）
    G.lineX=lx;G.lineZ=lz;updFollowers(dt);
    party().forEach((m,i)=>{const k=Math.min(1,dt*5);m.x+=(lx+OFF[i]-m.x)*k;m.z+=(lz-m.z)*k;m.walk+=dt});
    party().forEach((m,i)=>{const t=G.clearT-.15*i;m.h=t>0&&t<.45?Math.sin(t/.45*Math.PI)*22:0;
      if(Math.random()<dt*3)G.fx.push({k:'twinkle',x:m.x+rnd(-16,16),z:m.z,h:rnd(20,48),life:.35,max:.35,vx:0,vh:0})});
    if(G.clearT>(G.followers.length?4:3.2)&&!overlayShown)showClear();return}
  if(G.state!=='play')return;
  updHero(dt);
  G.allies.forEach((a,i)=>updAlly(a,i,dt));
  if(!G.locked&&!G.intro){G.camX=Math.min(END-W,G.camX+SCROLL*dt);if(G.camX>=END-W){G.camX=END-W;startBoss()}}
  if(!G.intro){spawnLogic(dt);updNpcs()}
  G.enemies.forEach(e=>updEnemy(e,dt));
  G.enemies=G.enemies.filter(e=>!e.dead);
  updFlyers(dt);
  updFollowers(dt);
  if(G.boss)updBoss(dt);
  updShots(dt);
}

/* ---------- 描画 ---------- */
let CAM=0;

    ctx.fillStyle='#1a1f2e';ctx.fillRect(bx+13,y-14,9,14);ctx.fillStyle='#ffd84a';ctx.fillRect(bx-6,y-50,3,4);ctx.fillRect(bx+36,y-50,3,4);

function drawSword(m){

  }
  if(SHEET.weaponIn.has('char.'+m.cls))return;   // 絵に剣が入っているときは、振った軌跡だけ描く
  for(let i=0;i<len;i++){const x=Math.round(sx+Math.cos(ang)*i),y=Math.round(sy+Math.sin(ang)*i);ctx.fillStyle=i<5?(i===4?'#fff07a':'#c89020'):'#6c7480';ctx.fillRect(x,y,2,2);if(i>=5){ctx.fillStyle=i>len-3?'#ffffff':'#d8dee6';ctx.fillRect(x,y,1,1)}}

function drawShot(s){

    for(let k=2;k>=0;k--){const ox=x-d*k*(5+lv*2),col=k?w.c1:'#ffffff';ctx.globalAlpha=k?.45/k:1;
      for(let a=-1.25;a<=1.25;a+=.06){const th=Math.cos(a)*thk,px=ox+d*Math.cos(a)*R0-d*R0*.55,py=y+Math.sin(a)*R0*1.15;
        ctx.fillStyle=col;ctx.fillRect(Math.round(px-d*th),Math.round(py),Math.max(1,Math.round(th)),2);

  else if(s.kind==='fire'){const d=Math.sign(s.vx);ctx.fillStyle='#d82800';ctx.fillRect(x-d*7-1,y-1,3,3);ctx.fillStyle='#fc7400';ctx.fillRect(x-3,y-3,6,6);ctx.fillStyle='#fcd800';ctx.fillRect(x-2,y-2,4,4);ctx.fillStyle='#ffffff';ctx.fillRect(x-1,y-1,2,2)}

function draw(){
  CAM=Math.round(G.camX);

    n.hurt-=1/60;const sp=(n.mob?MOB:CLS)[n.cls].spr[0],shk=Math.floor(G.t*24)%2?1:-1;
    shadow(n.x,n.z,22);drawImg(n.hurt>0?sp.wl:sp.l,n.x+shk,n.z,0);

  G.shots.forEach(s=>L.push({z:s.z+.2,f:()=>drawShot(s)}));
  if(G.boss)L.push({z:G.boss.z,f:()=>drawBoss(G.boss)});
  for(const f of G.flyers)L.push({z:f.z+.3,f:()=>{ctx.save();ctx.translate(SX(f.x),Math.round(GY+f.z-f.h-f.img.height/2));ctx.rotate(f.rot);ctx.drawImage(f.img,-f.img.width/2,-f.img.height/2);ctx.restore()}});
  L.sort((a,b)=>a.z-b.z).forEach(o=>o.f());

      ctx.globalAlpha=1}

      ctx.fillStyle='#fff8c0';const q=Math.round(L*.5);ctx.fillRect(fx-q,fy-q,1,1);ctx.fillRect(fx+q,fy-q,1,1);ctx.fillRect(fx-q,fy+q,1,1);ctx.fillRect(fx+q,fy+q,1,1)}
    else if(f.k==='poof'){const t=1-f.life/f.max;ctx.globalAlpha=1-t*.8;
      for(let i=0;i<6;i++){const a=i*1.047+.3,d=4+t*14;ctx.fillStyle=i%2?'#e8e8f0':'#b8bcd0';ctx.beginPath();ctx.arc(fx+Math.cos(a)*d,fy+Math.sin(a)*d*.6,(5-t*3),0,Math.PI*2);ctx.fill()}

// ボタンは指を離したとき（touchend）にも動かす。ホーム画面に追加したアプリ（iOS）では、タップのあとの click が届かないことがある
function onTap(el,fn){
  let tTime=0,sx=0,sy=0;
  el.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});
  el.addEventListener('touchend',e=>{
    const t=e.changedTouches[0];if(Math.hypot(t.clientX-sx,t.clientY-sy)>12)return;   // なぞった（スクロールした）ときは押したことにしない
    const target=document.elementFromPoint(t.clientX,t.clientY)||e.target;if(!target.closest('button'))return;
    tTime=Date.now();e.preventDefault();fn(target);
  },{passive:false});
  el.addEventListener('click',e=>{if(Date.now()-tTime<700)return;fn(e.target)});   // マウス・キーボード用（タッチのあとの click は二重にしない）
}

/* ---------- 操作エリアの絵（石の板・ルーンの輪・鷲・盾の円盤）。画面の解像度で描く ---------- */
function hiCanvas(c,w,h){const dpr=Math.min(3,devicePixelRatio||1);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);return x}
// 彫り込み: 左上に暗い線、右下に明るい線、真ん中に地の線
function engrave(x,path,lw,base='#1c222c'){
  x.lineWidth=lw;x.lineCap='round';x.lineJoin='round';
  for(const [dx,dy,col] of [[-.8,-.8,'rgba(0,0,0,.85)'],[.9,.9,'rgba(120,132,150,.45)'],[0,0,base]]){x.save();x.translate(dx,dy);x.strokeStyle=col;path();x.stroke();x.restore()}
}
function drawPanel(){
  const panel=$('#panel'),pc=$('#panelBg'),pr=panel.getBoundingClientRect(),w=pr.width,h=pr.height;if(!w||!h)return;
  const x=hiCanvas(pc,w,h),r=rng(42);
  let g=x.createLinearGradient(0,0,w*.6,h);g.addColorStop(0,'#252c39');g.addColorStop(.5,'#171c25');g.addColorStop(1,'#0d1016');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  for(let i=0;i<w*h/40;i++){x.fillStyle=r()<.5?`rgba(255,255,255,${r()*.035})`:`rgba(0,0,0,${r()*.12})`;const s=1+r()*4;x.fillRect(r()*w,r()*h,s,s*(.5+r()))}
  // 光るひび
  const crack=(sx,sy,n,col)=>{x.save();x.strokeStyle=col;x.shadowColor=col;x.shadowBlur=7;x.lineWidth=.9;x.globalAlpha=.6;x.beginPath();x.moveTo(sx,sy);
    let px=sx,py=sy,a=r()*6.3;for(let i=0;i<n;i++){a+=(r()-.5)*1.3;px+=Math.cos(a)*7;py+=Math.sin(a)*7;x.lineTo(px,py);if(r()<.2){x.moveTo(px,py);}}x.stroke();x.restore()};
  crack(w*.04,h*.36,14,'#3aaeff');crack(w*.42,h*.34,9,'#30d890');crack(w*.18,h*.3,8,'#ff4a4a');crack(w*.92,h*.9,7,'#3aaeff');crack(w*.08,h*.95,6,'#30d890');
  const sr=$('#stick').getBoundingClientRect(),cx=sr.left+sr.width/2-pr.left,cy=sr.top+sr.height/2-pr.top,R0=sr.width/2;
  // ルーンの輪
  const Ri=R0*1.08,Ro=Math.max(Ri+14,Math.min(w/2-3,R0*1.42)),Rm=(Ri+Ro)/2,band=Ro-Ri;
  for(const rr of [Ri,Ri+2.5,Ro-2.5,Ro])engrave(x,()=>{x.beginPath();x.arc(cx,cy,rr,0,Math.PI*2)},rr===Ri||rr===Ro?1.6:1);
  const N=Math.floor(Math.PI*2*Rm/(band*.62)),bs=band*.42;
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2,pts=[[0,-1],[0,1]],extra=1+(r()*3|0);
    for(let k=0;k<extra;k++){const y0=[-1,0,1][r()*3|0],y1=clamp(y0+(r()<.5?-1:1),-1,1),s=r()<.5?-1:1;pts.push([0,y0],[s*.7,y1])}
    engrave(x,()=>{x.beginPath();for(let k=0;k<pts.length;k+=2){
      const p=(q)=>{const lx=q[0]*bs*.55,ly=q[1]*bs,ca=Math.cos(a),sa=Math.sin(a);return [cx+ca*(Rm-ly)-sa*lx,cy+sa*(Rm-ly)+ca*lx]};
      const A=p(pts[k]),B=p(pts[k+1]);x.moveTo(A[0],A[1]);x.lineTo(B[0],B[1])}},1.5,'#2a313d');
  }
  // 鷲（円盤の上で翼を広げる）
  const top=cy-R0*.98;
  for(const sd of [-1,1])for(let k=6;k>=0;k--){
    const a=-Math.PI/2+sd*(.5+k*.17),L=R0*(.38+k*.06),bx=cx+sd*R0*.1,by=top,tx=bx+Math.cos(a)*L,ty=by+Math.sin(a)*L,wd=R0*.075,na=a+Math.PI/2;
    x.beginPath();x.moveTo(bx,by);x.quadraticCurveTo((bx+tx)/2+Math.cos(na)*wd,(by+ty)/2+Math.sin(na)*wd,tx,ty);x.quadraticCurveTo((bx+tx)/2-Math.cos(na)*wd,(by+ty)/2-Math.sin(na)*wd,bx,by);
    const fg=x.createLinearGradient(bx,by,tx,ty);fg.addColorStop(0,'#3a4352');fg.addColorStop(1,'#1a1f28');x.fillStyle=fg;x.fill();
    x.strokeStyle='rgba(150,162,180,.55)';x.lineWidth=1;x.stroke();
  }
  const hx=cx,hy=top-R0*.12,hr=R0*.12;
  x.beginPath();x.arc(hx,hy,hr,0,Math.PI*2);x.moveTo(hx+hr*.6,hy-hr*.5);x.lineTo(hx+hr*1.7,hy+hr*.1);x.lineTo(hx+hr*.5,hy+hr*.55);
  x.fillStyle='#2e3542';x.fill();x.strokeStyle='rgba(150,162,180,.6)';x.lineWidth=1;x.stroke();
  x.fillStyle='#e0b050';x.beginPath();x.arc(hx+hr*.35,hy-hr*.2,1.3,0,Math.PI*2);x.fill();
  // 下の角の組みひも模様
  for(const sd of [0,1]){const ox=sd?w:0,dir=sd?-1:1;
    for(let k=0;k<3;k++)engrave(x,()=>{x.beginPath();x.arc(ox,h,18+k*9,sd?Math.PI:-Math.PI/2,sd?Math.PI*1.5:0)},1.4);
    engrave(x,()=>{x.beginPath();for(let k=0;k<4;k++){x.moveTo(ox+dir*(8+k*10),h-2);x.lineTo(ox+dir*(2+k*10),h-46+k*8)}},1.2);}
  engrave(x,()=>{x.beginPath();x.rect(3,3,w-6,h-6)},1.2);
}
function drawShield(){
  const c=$('#shieldCv'),D=c.getBoundingClientRect().width;if(!D)return;
  const x=hiCanvas(c,D,D),R=D/2,r=rng(77);x.translate(R,R);
  x.save();x.shadowColor='rgba(0,0,0,.75)';x.shadowBlur=D*.07;x.shadowOffsetY=D*.035;x.beginPath();x.arc(0,0,R*.96,0,Math.PI*2);x.fillStyle='#000';x.fill();x.restore();
  // 銅のふち
  let g=x.createLinearGradient(-R,-R,R,R);g.addColorStop(0,'#f0c08a');g.addColorStop(.3,'#c08048');g.addColorStop(.65,'#7a4420');g.addColorStop(1,'#3c200c');
  x.beginPath();x.arc(0,0,R*.96,0,Math.PI*2);x.fillStyle=g;x.fill();
  for(let i=0;i<40;i++){x.strokeStyle=`rgba(${r()<.5?'40,20,5':'255,220,170'},${r()*.25})`;x.lineWidth=.8;const a=r()*6.3,a2=a+r()*.3;x.beginPath();x.arc(0,0,R*(.88+r()*.07),a,a2);x.stroke()}
  x.lineWidth=1.5;x.strokeStyle='#2a1406';x.beginPath();x.arc(0,0,R*.96,0,Math.PI*2);x.stroke();
  x.strokeStyle='rgba(255,220,170,.5)';x.lineWidth=1;x.beginPath();x.arc(0,0,R*.93,Math.PI*.9,Math.PI*1.6);x.stroke();
  // 鋼の面
  g=x.createRadialGradient(-R*.3,-R*.35,R*.05,0,0,R*.86);g.addColorStop(0,'#eef0f2');g.addColorStop(.35,'#b9bec4');g.addColorStop(.75,'#878d94');g.addColorStop(1,'#565b62');
  x.beginPath();x.arc(0,0,R*.85,0,Math.PI*2);x.fillStyle=g;x.fill();
  x.save();x.clip();
  for(let i=0;i<220;i++){const a=r()*6.3,d=r()*R*.85,l=2+r()*R*.12,b=r()*6.3;x.strokeStyle=r()<.55?`rgba(40,44,50,${.12+r()*.18})`:`rgba(255,255,255,${.12+r()*.2})`;x.lineWidth=.6;
    x.beginPath();x.moveTo(Math.cos(a)*d,Math.sin(a)*d);x.lineTo(Math.cos(a)*d+Math.cos(b)*l,Math.sin(a)*d+Math.sin(b)*l);x.stroke()}
  for(let i=0;i<14;i++){const a=r()*6.3,d=R*(.3+r()*.55),s=R*(.05+r()*.14),bx=Math.cos(a)*d,by=Math.sin(a)*d,gg=x.createRadialGradient(bx,by,0,bx,by,s);
    gg.addColorStop(0,'rgba(110,70,35,.28)');gg.addColorStop(1,'rgba(110,70,35,0)');x.fillStyle=gg;x.fillRect(bx-s,by-s,s*2,s*2)}
  x.restore();
  x.strokeStyle='#30343a';x.lineWidth=1.5;x.beginPath();x.arc(0,0,R*.85,0,Math.PI*2);x.stroke();
  // 4つの矢印
  for(let k=0;k<4;k++){x.save();x.rotate(k*Math.PI/2);
    const arrow=()=>{x.beginPath();x.moveTo(0,-R*.8);x.lineTo(R*.14,-R*.64);x.lineTo(R*.05,-R*.64);x.lineTo(R*.05,-R*.5);x.lineTo(-R*.05,-R*.5);x.lineTo(-R*.05,-R*.64);x.lineTo(-R*.14,-R*.64);x.closePath()};
    x.save();x.translate(1,1.2);arrow();x.fillStyle='rgba(0,0,0,.45)';x.fill();x.restore();
    arrow();const ag=x.createLinearGradient(-R*.14,-R*.8,R*.14,-R*.5);ag.addColorStop(0,'#e6e9ec');ag.addColorStop(1,'#80868d');x.fillStyle=ag;x.fill();
    x.strokeStyle='#2c3036';x.lineWidth=1;x.stroke();x.restore()}
  // 銅の翼の紋章
  for(const sd of [-1,1])for(let k=4;k>=0;k--){
    const a=(sd<0?Math.PI:0)+sd*(-.55+k*.28),L=R*(.3+k*.035),bx=sd*R*.14,by=-R*.04,tx=bx+Math.cos(a)*L,ty=by+Math.sin(a)*L,na=a+Math.PI/2,wd=R*.05;
    x.beginPath();x.moveTo(bx,by);x.quadraticCurveTo((bx+tx)/2+Math.cos(na)*wd,(by+ty)/2+Math.sin(na)*wd,tx,ty);x.quadraticCurveTo((bx+tx)/2-Math.cos(na)*wd,(by+ty)/2-Math.sin(na)*wd,bx,by);
    const fg=x.createLinearGradient(bx,by-R*.2,tx,ty+R*.1);fg.addColorStop(0,'#e8b47a');fg.addColorStop(1,'#7a4420');x.fillStyle=fg;x.fill();x.strokeStyle='#3a1e0a';x.lineWidth=.9;x.stroke();
  }
  // 中心の受け
  g=x.createRadialGradient(0,0,R*.1,0,0,R*.32);g.addColorStop(0,'#1a1d22');g.addColorStop(.8,'#2e3238');g.addColorStop(1,'#6a7078');
  x.beginPath();x.arc(0,0,R*.32,0,Math.PI*2);x.fillStyle=g;x.fill();x.strokeStyle='#15171b';x.lineWidth=1.2;x.stroke();
  const rivet=(a,d,s)=>{const px=Math.cos(a)*d,py=Math.sin(a)*d,rg=x.createRadialGradient(px-s*.35,py-s*.35,0,px,py,s);rg.addColorStop(0,'#ffffff');rg.addColorStop(.4,'#b8bcc2');rg.addColorStop(1,'#3a3e44');
    x.beginPath();x.arc(px,py,s,0,Math.PI*2);x.fillStyle=rg;x.fill()};
  for(let i=0;i<16;i++)rivet(i/16*Math.PI*2+.1,R*.905,R*.034);
  for(let i=0;i<8;i++)rivet(i/8*Math.PI*2+Math.PI/8,R*.36,R*.026);
}
function drawKnob(){
  const c=$('#knobCv'),D=c.getBoundingClientRect().width;if(!D)return;
  const x=hiCanvas(c,D,D),R=D/2;x.translate(R,R);
  x.save();x.shadowColor='rgba(0,0,0,.8)';x.shadowBlur=D*.15;x.shadowOffsetY=D*.08;x.beginPath();x.arc(0,0,R*.92,0,Math.PI*2);x.fillStyle='#202328';x.fill();x.restore();
  let g=x.createLinearGradient(-R,-R,R,R);g.addColorStop(0,'#dfe3e7');g.addColorStop(1,'#3a3e44');x.beginPath();x.arc(0,0,R*.92,0,Math.PI*2);x.fillStyle=g;x.fill();
  g=x.createRadialGradient(-R*.3,-R*.35,R*.02,0,0,R*.78);g.addColorStop(0,'#ffffff');g.addColorStop(.18,'#e6e9ec');g.addColorStop(.55,'#9399a0');g.addColorStop(1,'#43484e');
  x.beginPath();x.arc(0,0,R*.76,0,Math.PI*2);x.fillStyle=g;x.fill();x.strokeStyle='#2a2d32';x.lineWidth=1;x.stroke();
  x.fillStyle='rgba(255,255,255,.8)';x.beginPath();x.ellipse(-R*.28,-R*.34,R*.18,R*.1,-.6,0,Math.PI*2);x.fill();
}
function drawControls(){drawPanel();drawShield();drawKnob()}

/* ---------- レイアウト ---------- */
function layout(){
  const app=$('#app'),cs=getComputedStyle(app);
  const iw=app.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ih=app.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const portrait=ih>iw;
  $('#rotate').hidden=!portrait;
  if(portrait&&G&&G.state==='play')togglePause();
  const pw=Math.floor(iw/3),sw=iw-pw;   // 左1/3が操作エリア、右2/3がゲーム画面
  $('#panel').style.width=pw+'px';
  let sc=ih/H;
  W=clamp(Math.floor(sw/sc),256,440);
  if(W*sc>sw)sc=sw/W;
  if(cv.width!==W)cv.width=W;
  ctx.imageSmoothingEnabled=false;
  const s=$('#screen');s.style.width=Math.floor(W*sc)+'px';s.style.height=Math.floor(H*sc)+'px';
  $('#clearView').style.fontSize=(Math.floor(H*sc)/28)+'px';   // クリア画面の 1em = ゲームの8ドット
  fitStick();requestAnimationFrame(drawControls);
}
addEventListener('resize',layout);
// 円盤は操作エリアの下側に収まる大きさにする（一時停止ボタンに重ならない）。フォントの読み込みなどで高さが変わったら合わせ直す
function fitStick(){
  const z=$('#stickZone'),w=Math.floor(Math.max(90,Math.min(210,z.clientWidth*.8,z.clientHeight*.92)));
  if($('#stick').style.width!==w+'px'){$('#stick').style.width=w+'px';requestAnimationFrame(drawControls)}
}
if(window.ResizeObserver)new ResizeObserver(fitStick).observe($('#stickZone'));

/* ---------- ループ ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(1/30,(now-last)/1000);last=now;
  if(G){if(G.hitstop>0)G.hitstop-=dt;else update(dt);draw();updHud()}
  else drawIdle(now/1000);
  requestAnimationFrame(frame);
}
// タイトルの後ろで流す画面
function drawIdle(t){
  if(!G){G={camX:t*20%(END-W),hero:{x:0},enemies:[],shots:[],fx:[],allies:[],npcs:[],boss:null,locked:false,t};CAM=G.camX;
    drawBg();for(const o of OBS)if(o.x>CAM-20&&o.x<CAM+W+20)drawImg(SP[o.t].r,o.x,o.z+o.d-1,0);
    const hs=CLS.hero.spr[Math.floor(t*8)%2].r;drawImg(hs,CAM+70,50,0);G=null;}
  $('#members').innerHTML||updHudEmpty();
}
function updHudEmpty(){let h='<div class="mem"><span class="nm">ゆうしゃ</span><span class="bar"><i style="width:100%"></i></span></div>';
  for(let i=0;i<3;i++)h+='<div class="mem empty"><span class="nm">？？？</span><span class="bar"></span></div>';$('#members').innerHTML=h}
layout();showTitle();requestAnimationFrame(frame);
</script>
